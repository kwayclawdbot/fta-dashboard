/* ---------------- ONE THING PER PAGE ----------------
   A lesson used to be a single scroll: a hook, three paragraphs, a worked example,
   a task, a warning and a recap — 233 words and twelve boxes, all shouting at once.
   Now it is a deck. Each page holds exactly ONE idea, and you tap through it.
   The diagram stays on screen the whole way, so the picture never leaves. */
/* which task types need the interactive "mark it here" chart. choice + number
   are answered without touching the chart — but a choice that asks you to READ a
   specific chart opts back in with task.chart = true (read-only, no marking). */
const CHART_MARK_TYPES = ['pick-price','pick-candle','multi-pick','hline','trendline','zone'];
function taskIsMark(type){ return CHART_MARK_TYPES.includes(type); }
function taskUsesChart(l){ return taskIsMark(l.task.type) || l.task.chart === true; }
function lessonPages(l){
  // step = how much of the diagram is showing. The picture builds as you tap.
  const pages = [{k:'idea', tag:'THE IDEA', body:l.hook, step:0}];
  l.teach.forEach((t,i)=> pages.push({k:'point', tag:'STEP '+(i+1), body:t, step:i+1}));
  if(l.watch) pages.push({k:'watch', tag:'WATCH ME DO IT', body:l.watch, step:9});
  pages.push({k:'task', tag:'YOUR TURN', step:9});
  if(l.mistake) pages.push({k:'mistake', tag:'WHERE PEOPLE GO WRONG', body:l.mistake, step:9});
  pages.push({k:'recap', tag:'GOT IT', body:l.recap, step:9});
  return pages;
}
function openLesson(i){
  LZ.idx = i; LZ.mark = null; LZ.revealed = false; LZ.choice = null; LZ.drag = null;
  LZ.picks = []; LZ.page = 0; LZ.solved = false;
  LZ.win = LESSONS[i].build();
  LZ.pages = lessonPages(LESSONS[i]);
  renderLessonPage();
}
function gotoPage(n){
  const p = LZ.pages[LZ.page];
  // you can't skip past the task without doing it
  if(n > LZ.page && p && p.k==='task' && !LZ.solved){
    feedback(false, 'Have a go first', 'Answer it, or tap SHOW ME if you are stuck. Getting it wrong here costs nothing.');
    return;
  }
  LZ.page = Math.max(0, Math.min(LZ.pages.length-1, n));
  renderLessonPage();
}
function renderLessonPage(){
  const l = LESSONS[LZ.idx];
  const page = LZ.pages[LZ.page];
  const stage = STAGES[l.stage];
  const last = LZ.page === LZ.pages.length-1;
  const wrap = document.getElementById('lzWrap');
  const nextL = LESSONS[LZ.idx+1];

  const dots = LZ.pages.map((p,i)=>
    `<button class="pg-dot ${i===LZ.page?'on':''} ${i<LZ.page?'done':''}" data-pg="${i}" data-tip="${p.tag}"></button>`).join('');

  let bodyHtml = '';
  if(page.k === 'task'){
    bodyHtml = `
      <div class="pg-tag yours">${page.tag}</div>
      <div class="pg-task">${l.task.prompt}</div>
      ${l.task.type==='choice' ? `<div class="lz-choice">${l.task.options.map(o=>`<button data-opt="${o}">${o}</button>`).join('')}</div>` : ''}
      ${l.task.type==='number' ? `<div class="lz-num"><input type="number" id="lzNum" step="any" placeholder="${l.task.placeholder||'your answer'}" autocomplete="off"><span class="lz-unit">${l.task.unit||''}</span></div>` : ''}
      <div class="lz-actions">
        <button class="lz-btn" id="lzCheck">CHECK IT</button>
        <button class="lz-btn ghost" id="lzShow">SHOW ME</button>
      </div>
      <div class="lz-feedback" id="lzFb"></div>`;
  } else {
    bodyHtml = `
      <div class="pg-tag ${page.k}">${page.tag}</div>
      <div class="pg-body ${page.k==='idea'?'big':''}">${page.body}</div>
      ${page.k==='recap' && l.unlocks ? `<div class="pg-next-up">${l.unlocks}</div>` : ''}`;
  }

  wrap.innerHTML = `
    <button class="lz-back" id="lzBack">← All lessons</button>
    <div class="lz-detail">
      <div class="lz-teach rise">
        <div class="step">${stage.name} · LESSON ${LZ.idx+1} OF ${LESSONS.length}</div>
        <h2>${l.title}</h2>
        <div class="pg-dots">${dots}<span class="pg-count">${LZ.page+1}/${LZ.pages.length}</span></div>
        ${(typeof ftaFullLessonLink==='function') ? ftaFullLessonLink(l.id) : ''}
        <div class="pg-card" id="pgCard">${bodyHtml}</div>
        <div class="pg-nav">
          <button class="pg-btn ghost" id="pgBack" ${LZ.page===0?'disabled':''}>← Back</button>
          ${last
            ? `<button class="pg-btn" id="pgDone">${nextL?'NEXT LESSON →':'FINISH →'}</button>${nextL?'<button class="pg-btn ghost" id="pgAll">ALL LESSONS</button>':''}`
            : `<button class="pg-btn" id="pgNext">Next →</button>`}
        </div>
      </div>
      <div class="lz-right rise" style="animation-delay:.08s">
        <div class="lz-hero-diagram">
          <div class="lz-panel-tag">THE PICTURE</div>
          ${lessonDiagram(l.id)}
        </div>
        ${page.k==='task' && taskUsesChart(l) ? `<div class="lz-chart-wrap">
          <div class="lz-panel-tag ${taskIsMark(l.task.type)?'yours':''}">${taskIsMark(l.task.type)?'MARK IT HERE':'READ THE CHART'}</div>
          <div class="lz-canvas-box"><canvas id="lzCanvas"></canvas></div>
        </div>` : ''}
      </div>
    </div>`;

  document.getElementById('lzBack').onclick = renderLessonList;
  const bk = document.getElementById('pgBack'); if(bk) bk.onclick = ()=> gotoPage(LZ.page-1);
  const nx = document.getElementById('pgNext'); if(nx) nx.onclick = ()=> gotoPage(LZ.page+1);
  const dn = document.getElementById('pgDone'); if(dn) dn.onclick = ()=>{
    if(LESSONS[LZ.idx+1]) openLesson(LZ.idx+1); else renderLessonList();
  };
  const al = document.getElementById('pgAll'); if(al) al.onclick = renderLessonList;
  wrap.querySelectorAll('.pg-dot').forEach(b=> b.onclick = ()=> gotoPage(parseInt(b.dataset.pg)));

  applyDiagramStep(page.step);

  if(page.k === 'task'){
    document.getElementById('lzCheck').onclick = checkLesson;
    document.getElementById('lzShow').onclick = ()=>{
      LZ.revealed = true; LZ.solved = true; drawLessonChart();
      feedback(false, 'Here it is', l.explain(LZ.win)+' Have a look, then tap Next.');
      renderTaskActions();
    };
    wrap.querySelectorAll('[data-opt]').forEach(b=> b.onclick = ()=>{
      wrap.querySelectorAll('[data-opt]').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); LZ.choice = b.dataset.opt;
    });
    const cv = document.getElementById('lzCanvas');
    if(cv && taskIsMark(l.task.type)){
      cv.addEventListener('pointerdown', onLessonDown);
      cv.addEventListener('pointermove', onLessonMove);
      cv.addEventListener('pointerup', onLessonUp);
      cv.addEventListener('pointercancel', onLessonUp);
    }
    setTimeout(drawLessonChart, 30);
  }
}
/* show only the layers this page has earned; the rest stay invisible but keep
   their space, so nothing jumps around as the picture fills in */
function applyDiagramStep(step){
  const dg = document.querySelector('.lz-hero-diagram');
  if(!dg) return;
  let max = 0;
  dg.querySelectorAll('.dg-l').forEach(g=> max = Math.max(max, +g.dataset.step));
  dg.querySelectorAll('.dg-l').forEach(g=>{
    const on = (+g.dataset.step) <= step;
    g.classList.toggle('off', !on);
    // the layer that just appeared gets a little arrival
    g.classList.toggle('just', on && (+g.dataset.step) === step && step > 0);
  });
  const tag = dg.querySelector('.lz-panel-tag');
  if(tag) tag.textContent = step >= max ? 'THE PICTURE' : `THE PICTURE · BUILDING (${Math.min(step,max)}/${max})`;
}

function showNextAfterTask(){
  const nav = document.querySelector('.pg-nav');
  if(nav && !document.getElementById('pgNext')){
    nav.insertAdjacentHTML('beforeend', '<button class="pg-btn" id="pgNext">Next →</button>');
    document.getElementById('pgNext').onclick = ()=> gotoPage(LZ.page+1);
  }
}
/* the question is answered — but the lesson isn't over. drop CHECK IT / SHOW ME
   and let Next → carry them through the recap. NEXT LESSON / ALL LESSONS live on
   the recap page, so we never imply the lesson is done partway through it. */
function renderTaskActions(){
  const acts = document.querySelector('.lz-actions');
  if(acts) acts.remove();
  showNextAfterTask();
}
document.addEventListener('keydown', (e)=>{
  const lz = document.getElementById('lessons');
  if(!lz || lz.style.display==='none' || !LZ.pages) return;
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input' || tag==='textarea') return;
  if(e.key==='ArrowRight') gotoPage(LZ.page+1);
  if(e.key==='ArrowLeft') gotoPage(LZ.page-1);
});

/* ---- zone tool: the same interaction as the terminal's zone tool. Drag empty
   space to draw a box, grab an edge to resize, grab the middle to slide it in
   both axes. A single click used to drop an invisible 1px line, which is why
   marking a gap never felt like it worked. ---- */
function lessonHitZone(x, y){
  const z = LZ.mark, f = LZ.frame;
  if(!z || !f || z.top == null) return null;
  const yT = f.yAt(z.top), yB = f.yAt(z.bottom);
  const x1 = f.xAt(Math.min(z.i1,z.i2)), x2 = f.xAt(Math.max(z.i1,z.i2));
  const inX = x >= x1-10 && x <= x2+10;
  if(inX && Math.abs(y-yT) <= 6) return 'top';
  if(inX && Math.abs(y-yB) <= 6) return 'bottom';
  if(inX && y > Math.min(yT,yB) && y < Math.max(yT,yB)) return 'move';
  return null;
}
function lessonXY(e){
  const canvas = e.currentTarget, r = canvas.getBoundingClientRect(), f = LZ.frame;
  const x = e.clientX-r.left, y = e.clientY-r.top;
  return {
    x, y,
    idx: Math.max(0, Math.min(f.n-1, Math.floor((x-f.mL)/(f.cw/f.n)))),
    price: f.lo + ((f.mT+f.ch-y)/f.ch)*(f.hi-f.lo),
  };
}
function onLessonDown(e){
  if(!LZ.frame) return;
  const canvas = e.currentTarget;
  const {x, y, idx, price} = lessonXY(e);
  const t = LESSONS[LZ.idx].task.type;
  if(t==='zone'){
    const hit = lessonHitZone(x,y);
    if(hit) LZ.drag = {mode:hit, startPrice:price, startIdx:idx, orig:{...LZ.mark}};
    else {
      LZ.mark = {i1:idx, i2:idx, top:price, bottom:price};
      LZ.drag = {mode:'new', startPrice:price, startIdx:idx};
    }
  } else if(t==='pick-candle'){
    LZ.mark = {idx};
  } else if(t==='pick-price'){
    // click a specific price ON a specific candle — tests that you can read one
    LZ.mark = {idx, price};
  } else if(t==='multi-pick'){
    // click several candles; clicking again removes it
    const hit = LZ.picks.indexOf(idx);
    if(hit>=0) LZ.picks.splice(hit,1); else LZ.picks.push(idx);
    LZ.mark = {picks:[...LZ.picks]};
  } else if(t==='hline'){
    LZ.mark = {price}; LZ.drag = {mode:'hline'};
  } else if(t==='trendline'){
    const pts = (LZ.mark && LZ.mark.pts) || [];
    if(pts.length>=2) pts.length = 0;
    pts.push({idx, price});
    LZ.mark = {pts};
  }
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  drawLessonChart();
}
function onLessonMove(e){
  if(!LZ.frame) return;
  const canvas = e.currentTarget;
  const {x, y, idx, price} = lessonXY(e);
  if(!LZ.drag){
    const hit = LESSONS[LZ.idx].task.type==='zone' ? lessonHitZone(x,y) : null;
    canvas.style.cursor = (hit==='top'||hit==='bottom') ? 'ns-resize' : hit==='move' ? 'move' : 'crosshair';
    return;
  }
  const g = LZ.drag, f = LZ.frame;
  if(g.mode==='hline') LZ.mark = {price};
  else if(g.mode==='new') LZ.mark = {i1:g.startIdx, i2:idx, top:Math.max(g.startPrice,price), bottom:Math.min(g.startPrice,price)};
  else if(g.mode==='top') LZ.mark.top = Math.max(price, LZ.mark.bottom + (f.hi-f.lo)*0.002);
  else if(g.mode==='bottom') LZ.mark.bottom = Math.min(price, LZ.mark.top - (f.hi-f.lo)*0.002);
  else if(g.mode==='move'){
    const dp = price - g.startPrice, di = idx - g.startIdx;
    LZ.mark.top = g.orig.top + dp; LZ.mark.bottom = g.orig.bottom + dp;
    LZ.mark.i1 = g.orig.i1 + di;   LZ.mark.i2 = g.orig.i2 + di;
  }
  drawLessonChart();
}
function onLessonUp(e){
  const g = LZ.drag;
  LZ.drag = null;
  try{ e.currentTarget.releasePointerCapture(e.pointerId); }catch(err){}
  // a tap without a drag still leaves you a usable box to adjust
  if(g && g.mode==='new' && LZ.mark && LZ.frame && Math.abs(LZ.mark.top-LZ.mark.bottom) < (LZ.frame.hi-LZ.frame.lo)*0.004){
    const h = (LZ.frame.hi-LZ.frame.lo)*0.03;
    LZ.mark.top += h; LZ.mark.bottom -= h;
    LZ.mark.i2 = Math.min(LZ.frame.n-1, LZ.mark.i1 + 8);
  }
  drawLessonChart();
}

function feedback(good, title, body){
  const fb = document.getElementById('lzFb');
  fb.className = 'lz-feedback '+(good?'good':'bad');
  fb.innerHTML = `<b>${title}</b>${body}`;
}
function checkLesson(){
  const l = LESSONS[LZ.idx], w = LZ.win, t = l.task.type;
  let pass = false, why = '';
  if(t==='number'){
    const el = document.getElementById('lzNum');
    const v = parseFloat(el && el.value);
    if(!isFinite(v)){ feedback(false,'Type a number','Work it out and put the number in the box.'); return; }
    pass = Math.abs(v - w.answer) <= w.tol;
    if(!pass) why = `You said ${v}. ${v > w.answer ? 'Too big' : 'Too small'} — ${w.hint}`;
  } else if(t==='choice'){
    if(!LZ.choice){ feedback(false,'Pick one','Choose an answer first.'); return; }
    pass = LZ.choice === w.answer;
    why = pass ? '' : `Not quite — look at where the ▲ swing lows sit relative to each other, and the ▼ swing highs.`;
  } else if(!LZ.mark){
    feedback(false,'Mark it first','Click on the chart to place your answer.'); return;
  } else if(t==='pick-price'){
    const want = w.cs[w.targetIdx][w.field];
    const onBar = Math.abs(LZ.mark.idx - w.targetIdx) <= 0;
    const onPrice = Math.abs(LZ.mark.price - want) <= w.tol;
    pass = onBar && onPrice;
    const names = {o:'opened', h:'reached at its highest', l:'reached at its lowest', c:'closed'};
    if(!onBar) why = 'Wrong candle — count again. The one you want is highlighted in the question.';
    else if(!onPrice){
      const above = LZ.mark.price > want;
      why = `Right candle, wrong price. You clicked ${LZ.mark.price.toFixed(2)}; it ${names[w.field]} at a price ${above?'lower':'higher'} than that. `
          + (w.field==='o' ? 'The open is the <b>flat edge of the body</b> at the start — for a green candle that is the <b>bottom</b> of the body.'
          : w.field==='c' ? 'The close is the flat edge at the end — for a green candle the <b>top</b> of the body.'
          : w.field==='h' ? 'The high is the <b>very tip of the top wick</b>, not the top of the body.'
          : 'The low is the <b>very tip of the bottom wick</b>, not the bottom of the body.');
    }
  } else if(t==='multi-pick'){
    const picks = (LZ.mark.picks||[]).slice().sort((a,b)=>a-b);
    const want = w.answers.slice().sort((a,b)=>a-b);
    pass = picks.length===want.length && picks.every((v,i)=>v===want[i]);
    if(!pass){
      const hits = picks.filter(p=>want.includes(p)).length;
      const extra = picks.filter(p=>!want.includes(p)).length;
      if(picks.length===0) why = 'Click the candles themselves — one click marks it, clicking again unmarks it.';
      else if(hits===want.length && extra) why = `You found all ${want.length}, but marked ${extra} extra. A swing ${w.dir==='high'?'high':'low'} needs <b>${w.k} candles on each side</b> that are ${w.dir==='high'?'lower':'higher'} — check the ones in the middle of a move.`;
      else why = `You have ${hits} of ${want.length}. Look for a candle whose ${w.dir==='high'?'high is higher':'low is lower'} than the ${w.k} candles on <b>both</b> sides of it.`;
    }
  } else if(t==='pick-candle'){
    pass = LZ.mark.idx === w.answerIdx;
    why = pass ? '' : 'Not that one. Look for the biggest <b>body</b> — open to close — not the tallest bar overall.';
  } else if(t==='hline'){
    pass = Math.abs(LZ.mark.price - w.answer) <= w.tol;
    why = pass ? '' : `You're ${Math.abs(LZ.mark.price-w.answer).toFixed(2)} away. Look for where price turned around <b>more than once</b> at the same height.`;
  } else if(t==='zone'){
    const m = LZ.mark;
    if(m.top == null){ feedback(false,'Draw the box','Click and hold on the chart, then drag a box over the gap.'); return; }
    const gapH = w.zone.top - w.zone.bottom;
    const overlap = Math.min(m.top, w.zone.top) - Math.max(m.bottom, w.zone.bottom);
    const covers = overlap / gapH;                 // how much of the gap you caught
    const bloat = (m.top - m.bottom) / gapH;       // how much slop you added
    const xOK = Math.max(m.i1,m.i2) >= w.zone.i-3 && Math.min(m.i1,m.i2) <= w.zone.i+10;
    pass = covers >= 0.6 && bloat <= 3.2 && xOK;
    if(!pass){
      if(covers <= 0)       why = "Your box misses the gap. Look for three candles where the <b>first one's high sits below the third one's low</b> — the untouched slice between them is the gap.";
      else if(covers < 0.6) why = `You caught ${(covers*100).toFixed(0)}% of it. Drag the top and bottom edges out to cover the whole empty slice.`;
      else if(!xOK)         why = "Right height, wrong place. Grab the middle handle and slide the box onto the three candles that made the gap.";
      else                  why = `Your box is ${bloat.toFixed(1)}x taller than the gap. Tighten the edges — a gap is only the untraded part.`;
    }
  } else if(t==='trendline'){
    const pts = LZ.mark.pts||[];
    if(pts.length<2){ feedback(false,'Two points','Click a second swing low to finish the line.'); return; }
    const near = (pt, i)=> Math.abs(pt.idx-i) <= 3 && Math.abs(pt.price - w.cs[i].l) <= w.tol;
    const [p,q] = pts.slice().sort((a,b)=>a.idx-b.idx);
    pass = near(p, w.answerA) && near(q, w.answerB);
    why = pass ? '' : 'Close, but connect the <b>swing lows</b> marked ▲ — the dips that held, not the candles in between.';
  }
  if(pass){
    LZ.revealed = true; LZ.solved = true; drawLessonChart();
    completeLesson(l.id);
    const next = LZ.idx+1 < LESSONS.length;
    const core = LESSONS.filter(x=> x.stage!==8);
    const finished = core.every(x=> lessonDone(x.id)) && !CERT_SHOWN;
    feedback(true, 'That\'s it. ✓', l.explain(w) + (next ? ' Lesson '+(LZ.idx+2)+' just unlocked.' : ' That\'s the whole course.'));
    if(finished) finishCourse();
    renderTaskActions();
    if(!finished) fireConfetti(1100);   // a small burst per lesson; finishCourse() handles the finale
  } else {
    feedback(false, 'Not yet', why + ' Try again — or hit SHOW ME.');
  }
}

function homeSubline(){

  return `${date} · <span class="live">●</span> simulated market, live · ${tail}`;

/* a smooth SVG path through a series of points (Catmull-Rom -> bezier) */
function smoothPath(pts){
  if(pts.length < 2) return '';
  let dstr = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    const c1x = p1[0] + (p2[0]-p0[0])/6, c1y = p1[1] + (p2[1]-p0[1])/6;
    const c2x = p2[0] - (p3[0]-p1[0])/6, c2y = p2[1] - (p3[1]-p1[1])/6;
    dstr += `C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return dstr;
}
function sparkline(symTick, w=56, h=20){
  const cs = getCandles(symTick, '15m').slice(-40);
  if(cs.length < 2) return '';
  let lo=Infinity, hi=-Infinity;
  cs.forEach(c=>{ lo=Math.min(lo,c.c); hi=Math.max(hi,c.c); });
  const span = (hi-lo) || 1;
  const pts = cs.map((c,i)=>[ (i/(cs.length-1))*w, h - ((c.c-lo)/span)*(h-3) - 1.5 ]);
  const up = cs[cs.length-1].c >= cs[0].c;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}"><path d="${smoothPath(pts)}" fill="none"
    stroke="${up?THEME.up:THEME.down}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/></svg>`;
}
function marketRow(symTick){
  const sym = SYM_MAP[symTick];
  if(!sym) return '';
  const chg = pctChange(symTick);
  return `<div class="row" data-open="${symTick}" data-tip="Open ${sym.n} in the terminal">
    <span class="t">${symTick}</span>
    <span class="n">${sym.n}</span>
    ${sparkline(symTick)}
    <span class="px">${fmtPrice(livePrice[symTick], sym.dec)}</span>
    <span class="ch ${chg>=0?'up':'down'}">${pctStr(chg)}</span>
  </div>`;
}
function heroChart(){
  const sym = SYM_MAP['SPX'];
  const cs = getCandles('SPX','5m').slice(-78);
  const W = 1000, H = 210;
  let lo=Infinity, hi=-Infinity;
  cs.forEach(c=>{ lo=Math.min(lo,c.l); hi=Math.max(hi,c.h); });
  const span=(hi-lo)||1;
  const pts = cs.map((c,i)=>[ (i/(cs.length-1))*W, H-10 - ((c.c-lo)/span)*(H-30) ]);
  const line = smoothPath(pts);
  const area = line + `L${W},${H} L0,${H} Z`;
  const chg = pctChange('SPX');
  const col = chg>=0 ? THEME.up : THEME.down;
  const times = [0, 0.25, 0.5, 0.75, 1].map(f=>{
    const c = cs[Math.min(cs.length-1, Math.round(f*(cs.length-1)))];
    return new Date(c.t).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});
  });
  return `
    <div class="hero-head">
      <span class="hero-badge">500</span>
      <div>
        <div class="hero-name">S&P 500 <span class="hero-tag">SPX</span> <span class="hero-tag">SIMULATED</span></div>
        <div class="hero-px" id="heroPx">${fmtPrice(livePrice['SPX'], 2)}
          <span class="hero-chg ${chg>=0?'up':'down'}">${pctStr(chg)}</span></div>
      </div>
      <span class="hero-dot" style="margin-left:auto;"></span>
    </div>
    <svg class="hero-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${col}" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="${col}" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${area}" fill="url(#hg)" style="opacity:0;animation:rise .9s .35s forwards;"/>
      <path class="line" d="${line}" stroke="${col}" pathLength="1"
        style="stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s cubic-bezier(.4,0,.2,1) forwards;"/>
    </svg>
    <div class="hero-x">${times.map(t=>`<span>${t}</span>`).join('')}</div>
  `;
}
function topMovers(){
  const pool = SYMBOLS.filter(s=> ['Stocks','Crypto','ETFs'].includes(s.cat)).slice(0, 120);
  const scored = pool.map(s=>({t:s.t, c:pctChange(s.t)})).sort((a,b)=> b.c-a.c);
  return scored.slice(0,4).concat(scored.slice(-3).reverse());
}

/* ================= AI TRADING COACH =================
   A Claude-powered mentor wired into the terminal. It sees the live (simulated)
   chart, your positions and your account, and coaches on structure + risk.

// HelpBot works on its own out of the box: a built-in "brain" (helpbotReply)
// reads the live game and answers in kid-simple language — no server needed.
// Want the smarter Claude model instead? Stand up a tiny proxy that holds your
// Anthropic key, set AI_ENDPOINT to it, and flip AI_USE_API to true.
let AI_USE_API = false;
const AI_ENDPOINT = "https://api.anthropic.com/v1/messages";
const AI_MODEL = "claude-sonnet-4-6";
const AI_SYSTEM = `You are HelpBot, a friendly helper inside a pretend stock-trading game for kids. All the money and prices here are make-believe — a safe place to learn and practice, so nobody can lose real money.

Talk like a kind, patient friend explaining things to a curious 10-year-old:
- Use short sentences and easy words. Skip confusing trader words. If you really need one, explain it in a few simple words right away (like "a stop is a safety net that sells for you if the price drops too much").
- Keep answers SHORT — usually 2 to 4 short sentences. Never write a big wall of text.
- Be warm and encouraging. Mistakes are okay here — that is how we learn.
- Gently teach the safe habit: only risk a little at a time, and always have a "safety net" (a stop) so a wrong guess does not hurt much.
- You can peek at their chart and their pretend money in the LIVE GAME INFO below. Use it to give simple, specific help.
- Never promise what will happen next — nobody can know the future. Say "it might" or "it could".
- You may make one word **bold** if it is the most important thing. A tiny friendly emoji now and then is fine. 🙂`;

let AI_MSGS = [];      // conversation turns {role, content}
let AI_BUSY = false;

function buildAIContext(){
  const sym = currentSym(); const t = STATE.symbol; const tf = STATE.tf;
  const candles = getCandles(t, tf);
  const last = candles[candles.length-1];
  const price = livePrice[t] ?? last.c;
  const chg = pctChange(t);
  const atr = atr14(t, tf);
  const recent = candles.slice(-24).map(c=>`${fmtPrice(c.o,sym.dec)},${fmtPrice(c.h,sym.dec)},${fmtPrice(c.l,sym.dec)},${fmtPrice(c.c,sym.dec)}`).join(' | ');
  let fvgTxt = 'none detected';
  try{
    const zones = (getFVGZones(t, tf)||[]).filter(z=>!z.filled && !z.dead).slice(-4);
    if(zones.length) fvgTxt = zones.map(z=>`${z.type}${z.inverted?'(inverted)':''} ${fmtPrice(z.bottom,sym.dec)}–${fmtPrice(z.top,sym.dec)}`).join('; ');
  }catch(e){}
  const st = computeStats();
  const pos = ACCOUNT.positions.map(p=>{
    const d = SYM_MAP[p.symbol].dec;
    return `${p.side.toUpperCase()} ${p.qty} ${p.symbol} @ ${fmtPrice(p.entryPrice,d)} · unreal ${fmtMoney(unrealizedPnl(p),true)}${p.stopLoss?` · stop ${fmtPrice(p.stopLoss,d)}`:' · NO STOP SET'}${p.takeProfit?` · target ${fmtPrice(p.takeProfit,d)}`:''}`;
  }).join('  |  ') || 'flat — no open positions';
  return `LIVE GAME INFO
INSTRUMENT: ${t} — ${sym.n} (${sym.cat})
TIMEFRAME: ${tf}
LAST PRICE: ${fmtPrice(price,sym.dec)} (${chg>=0?'+':''}${chg.toFixed(2)}% this session)
ATR(14) on ${tf}: ${fmtPrice(atr,sym.dec)}  ← typical candle range, use it to size stops
RECENT CANDLES (open,high,low,close, oldest→newest): ${recent}
UNFILLED FAIR-VALUE GAPS: ${fvgTxt}
OPEN POSITION(S): ${pos}
ACCOUNT: equity ${fmtMoney(st.equity)} · cash ${fmtMoney(ACCOUNT.balance)} · realized ${fmtMoney(st.realized,true)} · win rate ${st.closedCount?st.winRate.toFixed(0)+'%':'n/a'} over ${st.closedCount} closed trades`;
}

function aiEscape(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function aiFormat(s){
  // light markdown: **bold** and simple line breaks; everything else escaped
  return aiEscape(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
}
function renderAIMsgs(){
  const body = document.getElementById('aiBody'); if(!body) return;
  if(!AI_MSGS.length && !AI_BUSY){
    body.innerHTML = `<div class="ai-empty"><img src="${HB_LOGO}" class="ai-logo" alt="HelpBot"><div class="ai-hi">Hi, I'm HelpBot! 👋</div><div class="ai-hitext">Let me know what you need help with — I'm here for you.<br><br>You can ask me anything about your game. There are no silly questions! 🙂</div></div>`;
    return;
  }
  const botAv = `<div class="who"><img src="${HB_ROBOT}" alt="HelpBot"></div>`;
  body.innerHTML = AI_MSGS.map(m=>`
    <div class="ai-msg ${m.role==='user'?'user':'bot'}">
      ${m.role==='user' ? `<div class="who">YOU</div>` : botAv}
      <div class="bub">${aiFormat(m.content)}</div>
    </div>`).join('') + (AI_BUSY ? `
    <div class="ai-msg bot">${botAv}<div class="bub"><div class="ai-typing"><i></i><i></i><i></i></div></div></div>` : '');
  body.scrollTop = body.scrollHeight;
}
function updateAICtx(){
  const el = document.getElementById('aiCtx'); if(!el) return;
  const sym = currentSym(); const t = STATE.symbol;
  const price = livePrice[t] ?? getCandles(t,STATE.tf).slice(-1)[0].c;
  const chg = pctChange(t);
  const openN = ACCOUNT.positions.length;
  el.innerHTML = `<span class="cchip"><b>${t}</b> ${fmtPrice(price,sym.dec)}</span>
    <span class="cchip">${STATE.tf}</span>
    <span class="cchip ${chg>=0?'':'down'}"><b>${chg>=0?'+':''}${chg.toFixed(2)}%</b></span>
    <span class="cchip">${openN} open</span>`;
}

/* structured snapshot of the game right now, for the built-in HelpBot brain */
function liveInfo(){
  const sym=currentSym(); const t=STATE.symbol; const tf=STATE.tf;
  const candles=getCandles(t,tf); const last=candles[candles.length-1];
  const price=(livePrice[t]!=null?livePrice[t]:last.c); const chg=pctChange(t);
  const n=candles.length; const past=candles[Math.max(0,n-12)].c;
  const drift=past? ((price-past)/past)*100 : 0;
  let trend='moving sideways'; if(drift>0.15) trend='drifting up'; else if(drift<-0.15) trend='drifting down';
  const pos=ACCOUNT.positions.find(p=>p.symbol===t) || ACCOUNT.positions[0] || null;
  return {sym,t,tf,price,chg,trend,drift,pos,dec:sym.dec};
}
/* the built-in, always-on HelpBot — kid-simple, reads the live game, no API needed */
function helpbotReply(text){
  const q=(text||'').toLowerCase();
  const L=liveInfo(); const P=fmtPrice(L.price,L.dec);
  const posLine=()=>{
    if(!L.pos) return "You don't have a trade open right now, so nothing is at risk — nice and safe. 👍";
    const u=unrealizedPnl(L.pos); const win=u>=0;
    const safe = L.pos.stopLoss ? "and you set a **safety net** — awesome! 🛟"
      : "but there's **no safety net** yet. Want to add one so a wrong guess can't hurt much?";
    return `Your ${L.pos.symbol} trade is ${win?`up ${fmtMoney(u)} 🎉`:`down ${fmtMoney(Math.abs(u))}`} right now, ${safe}`;
  };
  if(/^\s*(hi|hey|hello|yo|hiya|howdy)\b/.test(q))
    return `Hi! I'm HelpBot 🙂 You're looking at **${L.t}** at ${P}, and it's ${L.trend}. What would you like help with?`;
  if(q.includes('confus')||q.includes("don't get")||q.includes('dont get')||q.includes('brand new')||q.includes('what am i looking')||q.includes('explain what')||q.includes("i'm new")||q.includes('im new'))
    return `No worries — this is a **pretend-money game** to practice, so you can't lose real money. 🙂 The big chart shows the **price** of ${L.t} going up and down over time. Each little candle is one bit of time: green means the price went up, red means it went down. Right now it's ${P}. Take your time!`;
  if(q.includes('happen')||q.includes('chart')||q.includes('going on')||q.includes('read'))
    return `Right now **${L.t}** is ${P} and it's been ${L.trend} lately (${L.chg>=0?'+':''}${L.chg.toFixed(2)}% today). ${L.trend==='moving sideways'?'That means buyers and sellers are pretty even — no clear direction yet.':`So lately more people have been ${L.drift>0?'buying':'selling'}.`} It can always change, though! 🙂`;
  if(q.includes('buy')||q.includes('wait')||q.includes('good time')||q.includes('should i'))
    return `Good question! The truth is nobody knows for sure what the price will do next — not even me. 🙂 Right now ${L.t} is ${L.trend}. The smart move is to use only a **little** pretend money and set a **safety net** first. Then if you guess wrong, it only costs a little. Practicing is what matters, not being right every time! 💪`;
  if(q.includes('sell'))
    return `Selling means closing your trade and taking your pretend money back. If your trade is up, selling locks in the win; if it's down, it stops it from getting worse. ${posLine()}`;
  if(q.includes('safe')||q.includes('stop')||q.includes('risk')||q.includes('lose')||q.includes('protect'))
    return `Smart thinking! 🛟 The safest habit: risk only a **little** each time, and always set a **stop** — that's a safety net that sells for you if the price drops too much, so a wrong guess can't hurt much. ${posLine()}`;
  if(q.includes('my trade')||q.includes('position')||q.includes('winning')||q.includes('losing')||q.includes('am i up')||q.includes('am i down')||q.includes('doing'))
    return posLine();
  if(q.includes('thank')) return "You're welcome! I'm always right here if you need me. 🙂";
  if(q.includes('what can you')||q.includes('who are you')||q.includes('your name'))
    return "I'm **HelpBot**, your friendly helper! 🤖 I can tell you what's happening on your chart, help you decide, and keep your pretend money safe. Ask me anything!";
  return `I'm here to help! 🙂 Right now you're looking at **${L.t}** at ${P} (${L.trend}). Just tell me what's on your mind — you can ask me what's happening, whether it's a good time to buy, how to stay safe, or anything else you're wondering about.`;
}
async function aiSend(text){
  text = (text||'').trim();
  if(!text || AI_BUSY) return;
  AI_MSGS.push({role:'user', content:text});
  AI_BUSY = true; renderAIMsgs();
  const ta = document.getElementById('aiInput'); if(ta) ta.value='';
  let reply = null;
  if(AI_USE_API){                       // optional: smarter Claude model via your own proxy
    try{
      const res = await fetch(AI_ENDPOINT, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          model: AI_MODEL, max_tokens: 1000,
          system: AI_SYSTEM + '\n\n' + buildAIContext(),
          messages: AI_MSGS.map(m=>({role:m.role, content:m.content}))
        })
      });
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      reply = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim() || null;
    }catch(err){ reply = null; }   // fall through to the built-in brain
  }
  if(!reply){
    await new Promise(r=> setTimeout(r, 340 + Math.random()*380));  // tiny think pause
    reply = helpbotReply(text);
  }
  AI_MSGS.push({role:'assistant', content:reply});
  AI_BUSY = false; renderAIMsgs();
}

  function drawLiveChart(){
    var cv = el('ftaLiveCanvas'); if(!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    cv.width = Math.max(200, rect.width * dpr); cv.height = 240 * dpr;
    var ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
    var W = rect.width, H = 240;
    ctx.clearRect(0,0,W,H);
    var bars = LIVE.bars;
    if(!bars || bars.length < 2){
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-dim') || '#888';
      ctx.font = '13px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('No chart data', W/2, H/2);
      return;
    }
    var closes = bars.map(function(b){ return b.c; });
    var lo = Math.min.apply(null, closes), hi = Math.max.apply(null, closes);
    var pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
    var css = getComputedStyle(document.documentElement);
    var line = (css.getPropertyValue('--amber') || '#B45309').trim();
    var last = closes[closes.length-1], first = closes[0];
    var up = last >= first;
    var xAt = function(i){ return (i/(closes.length-1)) * (W-8) + 4; };
    var yAt = function(v){ return H - 12 - ((v-lo)/(hi-lo)) * (H-24); };
    ctx.beginPath();
    closes.forEach(function(c,i){ var x=xAt(i), y=yAt(c); i? ctx.lineTo(x,y): ctx.moveTo(x,y); });
    ctx.strokeStyle = line; ctx.lineWidth = 1.8; ctx.stroke();
    // fill under
    ctx.lineTo(xAt(closes.length-1), H-12); ctx.lineTo(xAt(0), H-12); ctx.closePath();
    ctx.fillStyle = (up ? 'rgba(0,180,90,0.10)' : 'rgba(220,60,50,0.10)'); ctx.fill();
  }

      LIVE.pos.entry = (LIVE.pos.entry*LIVE.pos.qty + px*qty)/tot;
      LIVE.pos.qty = tot;

  }
  function liveClose(){

    wrap.className = 'ftaMode'; wrap.id = 'ftaModeToggle';
    wrap.innerHTML =
      '<button data-mode="synthetic" class="on" data-tip-title="SYNTHETIC" data-tip="A safe, made-up market that never sleeps — practice any time.">Synthetic</button>' +
      '<button data-mode="live" data-tip-title="LIVE MARKET" data-tip="Real tickers on delayed (~15 min) data. Practice reading the real market.">Live Market</button>';
    bar.appendChild(wrap);
    wrap.querySelector('[data-mode="synthetic"]').onclick = function(){ setLive(false); };
    wrap.querySelector('[data-mode="live"]').onclick = function(){ setLive(true); };
  }

  // Called from the embed boot path once the app has booted.
  window.ftaInitEmbed = function(){
    try{
      buildLiveOverlay();
      injectModeToggle();
      window.addEventListener('resize', function(){ if(LIVE.on) drawLiveChart(); });
    }catch(e){ /* never break the terminal over an add-on */ }
  };
})();
</script>
</body>
</html>
