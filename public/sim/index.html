<title>SIMBOT — Learn. Practice. Profit.</title>
<style>
:root{
  --bg:#0a0c0f;
  --panel:#111419;
  --panel2:#0d1015;
  --line:#1e232b;
  --line-soft:#171b21;
  --text:#e8ebef;
  --text-dim:#7b8494;
  --text-dimmer:#4b5361;
  --amber:#ffb000;
  --amber-dim:#8a6100;
  --green:#00d964;
  --green-dim:#0a3d24;
  --red:#ff3b30;
  --red-dim:#3a0f0c;
  --blue:#4d9dff;
  --violet:#a78bfa;
  --teal:#3ee6d8;
  --mono: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--mono);
  font-size:13px;
  height:100%;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--amber-dim);color:var(--amber);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:var(--panel2);}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-dimmer);}

button{font-family:var(--mono);cursor:pointer;}
input,select{font-family:var(--mono);}

.app{
  display:grid;
  grid-template-rows:44px 1fr auto 34px;
  height:100vh;
  width:100vw;
}

/* ---------- TOP BAR ---------- */
.topbar{
  display:flex;
  align-items:center;
  gap:0;
  background:var(--panel);
  border-bottom:1px solid var(--line);
  padding:0 14px;
  height:44px;
  flex-shrink:0;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
}
.topbar::-webkit-scrollbar{height:0;}
.topbar > *{flex-shrink:0;}
.brand{
  font-weight:700;
  letter-spacing:0.5px;
  font-size:13px;
  color:var(--text);
  display:flex;
  align-items:center;
  gap:6px;
  padding-right:16px;
  border-right:1px solid var(--line);
  margin-right:16px;
  white-space:nowrap;
}
.brand .accent{color:var(--amber);}
.brand-logo{
  width:30px;height:30px;flex-shrink:0;object-fit:contain;
  filter:drop-shadow(0 0 5px rgba(77,157,255,0.35));
}
.brand-txt{display:flex;flex-direction:column;line-height:1.15;gap:1px;}
.brand-name{font-size:13px;font-weight:700;letter-spacing:0.5px;}
.brand-tag{
  font-size:8px;font-weight:500;letter-spacing:0.9px;color:var(--text-dimmer);
  text-transform:uppercase;
}
.sim-tag{
  font-size:8px;font-weight:700;letter-spacing:1px;
  color:var(--green);border:1px solid var(--green-dim);
  background:rgba(0,217,100,0.07);
  border-radius:3px;padding:2px 4px;line-height:1;
}
.bar-timer{
  display:flex;align-items:center;gap:5px;
  font-size:10px;color:var(--text-dim);letter-spacing:0.5px;
  border:1px solid var(--line);border-radius:3px;padding:3px 7px;margin-right:10px;
  white-space:nowrap;
}
.bar-timer b{color:var(--amber);font-variant-numeric:tabular-nums;font-weight:600;}
.bar-timer.closing b{color:var(--green);}

/* ---------- SETTINGS PANEL ---------- */

.symbol-picker{position:relative;margin-right:14px;}
.symbol-btn{
  background:var(--panel2);
  border:1px solid var(--line);
  color:var(--text);
  padding:6px 10px;
  border-radius:3px;
  font-size:12.5px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:8px;
  min-width:150px;
  justify-content:space-between;
}
.symbol-btn:hover{border-color:var(--amber-dim);}
.symbol-btn .cat-tag{font-size:9px;color:var(--text-dimmer);font-weight:400;}

.symbol-dropdown{
  position:fixed;
  width:340px;
  max-height:420px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:4px;
  box-shadow:0 12px 32px rgba(0,0,0,0.6);
  display:none;
  z-index:100;
  flex-direction:column;
}
.symbol-dropdown.open{display:flex;}
.symbol-search{
  padding:8px;border-bottom:1px solid var(--line);
}
.symbol-search input{
  width:100%;background:var(--panel2);border:1px solid var(--line);
  color:var(--text);padding:7px 8px;border-radius:3px;font-size:12px;outline:none;
}
.symbol-search input:focus{border-color:var(--amber-dim);}
.symbol-list{overflow-y:auto;flex:1;padding:4px;}
.symbol-group-label{
  font-size:9.5px;color:var(--text-dimmer);letter-spacing:1px;padding:8px 8px 4px;font-weight:700;
}
.symbol-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 8px;border-radius:3px;cursor:pointer;
}
.symbol-row:hover{background:var(--panel2);}
.symbol-row .s-left{display:flex;flex-direction:column;gap:1px;}
.symbol-row .s-tick{font-weight:700;font-size:12px;}
.symbol-row .s-name{font-size:10px;color:var(--text-dim);}
.symbol-row .s-right{display:flex;flex-direction:column;align-items:flex-end;gap:1px;}
.symbol-row .s-price{font-size:11.5px;}
.symbol-row .s-chg{font-size:10px;}

.price-block{display:flex;align-items:baseline;gap:10px;margin-right:16px;}
.price-block .px{font-size:18px;font-weight:700;}
.price-block .chg{font-size:12px;font-weight:600;padding:2px 6px;border-radius:3px;}

.tf-group{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px;margin-right:10px;}
.tf-btn{
  background:transparent;border:none;color:var(--text-dim);padding:5px 8px;font-size:11px;border-radius:3px;font-weight:600;
}
.tf-btn:hover{color:var(--text);}
.tf-btn.active{background:var(--amber-dim);color:var(--amber);}

.chart-type-group{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px;margin-right:auto;}
.ct-btn{background:transparent;border:none;color:var(--text-dim);padding:5px 9px;font-size:11px;border-radius:3px;font-weight:600;}
.ct-btn:hover{color:var(--text);}
.ct-btn.active{background:var(--line);color:var(--amber);}

.top-right{display:flex;align-items:center;gap:10px;}
.balance-chip{cursor:pointer;
  display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;
}
.balance-chip .lbl{font-size:8.5px;color:var(--text-dimmer);letter-spacing:0.5px;}
.balance-chip .val{font-size:13px;font-weight:700;color:var(--amber);}
.balance-chip:hover{border-color:var(--amber);}
.balance-chip .lbl{white-space:nowrap;}
.reset-btn{
  background:var(--panel2);border:1px solid var(--line);color:var(--text-dim);
  padding:6px 10px;border-radius:3px;font-size:10.5px;font-weight:600;
}
.reset-btn.danger{
  display:flex;align-items:center;gap:5px;
  background:rgba(255,59,48,0.10);border:1px solid var(--red);color:var(--red);
  font-weight:800;letter-spacing:0.6px;padding:6px 11px;
}
.reset-btn.danger svg{width:12px;height:12px;}
.reset-btn.danger:hover{background:var(--red);color:#fff;}
.reset-btn:hover{border-color:var(--red);color:var(--red);}

/* ---------- MAIN LAYOUT ---------- */
.main{
  display:grid;
  grid-template-columns:42px 230px 1fr 0px;
  overflow:hidden;
  min-height:0;
  transition:grid-template-columns 0.16s ease;
}
.main.wl-hidden{grid-template-columns:42px 22px 1fr 0px;}
.main.ticket-open{grid-template-columns:42px 230px 1fr 300px;}
.main.ticket-open.wl-hidden{grid-template-columns:42px 22px 1fr 300px;}
.right-col{overflow:hidden;}
.hud-chip.on{border-color:var(--amber);color:var(--amber);}
.lvl-quick{display:flex;flex-direction:column;gap:4px;margin:-4px 0 10px;}
.lq-row{display:flex;align-items:center;gap:4px;}
.lq-lbl{font-size:8px;font-weight:800;letter-spacing:0.6px;color:var(--text-dimmer);width:38px;cursor:help;}
.lq-row button{
  flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text-dim);
  font-size:9.5px;font-weight:600;padding:4px 0;border-radius:3px;
}
.lq-row button:hover{border-color:var(--amber-dim);color:var(--amber);}
.lq-row button.lq-clear{flex:0 0 34px;color:var(--text-dimmer);}
.lq-note{font-size:9px;color:var(--text-dimmer);line-height:1.4;min-height:11px;}
.ticket-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;border-bottom:1px solid var(--line-soft);flex-shrink:0;
}
.ticket-head span{font-size:10px;letter-spacing:1px;color:var(--text-dimmer);font-weight:700;}
.ticket-head button{background:transparent;border:none;color:var(--text-dim);font-size:13px;}
.ticket-head button:hover{color:var(--red);}

/* ---------- DRAWING TOOLBAR (left rail) ---------- */
.draw-toolbar{
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;min-height:0;overflow-y:auto;
}
.draw-btn{
  width:32px;height:32px;background:transparent;border:1px solid transparent;border-radius:4px;
  color:var(--text-dim);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;
}
.draw-btn svg{width:16px;height:16px;}
.draw-btn:hover{background:var(--panel2);color:var(--text);}
.draw-btn.active{background:var(--amber-dim);color:var(--amber);border-color:var(--amber-dim);}
.draw-btn.toggled{color:var(--amber);}
.draw-sep{width:24px;height:1px;background:var(--line);margin:5px 0;flex-shrink:0;}
.draw-btn .tip{
  position:absolute;left:38px;top:50%;transform:translateY(-50%);
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  padding:4px 8px;border-radius:3px;font-size:10.5px;white-space:nowrap;
  display:none;z-index:200;box-shadow:0 6px 18px rgba(0,0,0,0.5);pointer-events:none;
}
.draw-btn:hover .tip{display:block;}

/* ---------- TOPBAR ICON BUTTONS ---------- */
.icon-group{display:flex;align-items:center;gap:2px;margin-right:10px;padding-right:10px;border-right:1px solid var(--line);}
.icon-btn{
  width:30px;height:30px;background:transparent;border:1px solid transparent;border-radius:4px;
  color:var(--text-dim);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;
}
.icon-btn svg{width:15px;height:15px;}
.icon-btn:hover{background:var(--panel2);color:var(--text);}
.icon-btn.active{color:var(--amber);background:var(--amber-dim);}
.icon-btn[disabled]{opacity:0.35;pointer-events:none;}
.icon-btn .badge{
  position:absolute;top:1px;right:1px;background:var(--amber);color:#1a1200;font-size:8px;font-weight:800;
  border-radius:50%;width:13px;height:13px;display:flex;align-items:center;justify-content:center;
}

.dropdown-panel{
  /* fixed, not absolute: the top bar scrolls horizontally (overflow-y:hidden),
     which would otherwise clip these panels out of existence */
  position:fixed;width:280px;max-height:380px;background:var(--panel);
  border:1px solid var(--line);border-radius:4px;box-shadow:0 12px 32px rgba(0,0,0,0.6);
  display:none;flex-direction:column;z-index:300;overflow:hidden;
}
.dropdown-panel.open{display:flex;}
.dropdown-panel .dp-head{padding:9px 10px;border-bottom:1px solid var(--line-soft);font-size:10px;letter-spacing:1px;color:var(--text-dimmer);font-weight:700;}
.dropdown-panel .dp-body{flex:1;overflow-y:auto;padding:6px;}
.dropdown-panel .dp-form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line-soft);}
.dropdown-panel .dp-form input,.dropdown-panel .dp-form select{
  background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:6px;border-radius:3px;font-size:11px;flex:1;outline:none;
}
.dropdown-panel .dp-form button{background:var(--amber-dim);color:var(--amber);border:none;padding:6px 10px;border-radius:3px;font-size:11px;font-weight:700;}
.alert-row{display:flex;justify-content:space-between;align-items:center;padding:6px 6px;border-radius:3px;font-size:11px;}
.alert-row:hover{background:var(--panel2);}
.alert-row .ar-x{background:none;border:none;color:var(--text-dimmer);font-size:13px;padding:0 4px;}
.alert-row .ar-x:hover{color:var(--red);}
.layout-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;}
.layout-opt{border:1px solid var(--line);border-radius:4px;padding:10px 4px;display:flex;align-items:center;justify-content:center;background:var(--panel2);color:var(--text-dim);}
.layout-opt:hover{border-color:var(--amber-dim);color:var(--amber);}
.layout-opt svg{width:30px;height:22px;}

.replay-bar{
  display:none;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-top:1px solid var(--line);flex-shrink:0;
}
.replay-bar.active{display:flex;}
.replay-bar button{background:var(--panel2);border:1px solid var(--line);color:var(--amber);width:26px;height:26px;border-radius:3px;display:flex;align-items:center;justify-content:center;}
.replay-bar button:hover{border-color:var(--amber-dim);}
.replay-bar input[type=range]{flex:1;accent-color:var(--amber);}
.replay-bar .rb-label{font-size:10px;color:var(--text-dimmer);letter-spacing:0.5px;white-space:nowrap;}
.replay-bar .rb-wide{width:auto;padding:0 9px;gap:5px;font-size:10.5px;font-weight:600;color:var(--text);}
.replay-bar .rb-div{width:1px;height:16px;background:var(--line);}
.replay-bar .rb-speeds{display:flex;gap:2px;}
.replay-bar .rb-speed{
  width:auto;padding:0 7px;height:22px;font-size:10px;font-weight:700;color:var(--text-dim);
  background:transparent;border:1px solid transparent;
}
.replay-bar .rb-speed.active{background:var(--amber-dim);color:var(--amber);border-color:var(--amber-dim);}
.replay-bar .rb-tf{font-size:10px;font-weight:700;color:var(--text-dim);padding:0 4px;}
.replay-bar .rb-x{color:var(--text-dim);font-size:13px;}
.replay-bar .rb-x:hover{color:var(--red);border-color:var(--red-dim);}
.replay-bar .rb-select-hint{
  display:flex;align-items:center;gap:7px;font-size:11px;color:var(--amber);
  letter-spacing:0.3px;flex:1;
}
/* ---------- FLOATING TRADE HUD ---------- */
.trade-hud{
  /* the FVG / reset zoom / TIME / PRICE row owns the top strip — sit under it */
  position:absolute;top:42px;left:10px;z-index:45;
  display:flex;flex-direction:column;gap:5px;align-items:flex-start;
  -webkit-user-select:none;user-select:none;
}
.hud-row{display:flex;align-items:center;gap:7px;}
.hud-btn{
  min-width:76px;border-radius:5px;padding:5px 9px 4px;
  display:flex;flex-direction:column;align-items:center;line-height:1.15;
  background:rgba(13,16,21,0.92);backdrop-filter:blur(3px);
}
.hud-btn .px{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}
.hud-btn .lb{font-size:8.5px;font-weight:800;letter-spacing:1.2px;margin-top:1px;}
.hud-sell{border:1.5px solid var(--red);color:var(--red);}
.hud-sell:hover{background:var(--red-dim);}
.hud-buy{border:1.5px solid var(--blue);color:var(--blue);}
.hud-buy:hover{background:rgba(77,157,255,0.16);}
.hud-spread{
  font-size:11px;color:var(--text-dim);font-variant-numeric:tabular-nums;
  min-width:34px;text-align:center;
}
.hud-row2{display:flex;align-items:center;gap:5px;}
.hud-chip{
  background:rgba(13,16,21,0.92);border:1px solid var(--line);border-radius:4px;
  color:var(--text-dim);font-size:10.5px;padding:3px 7px;display:flex;align-items:center;gap:5px;
  backdrop-filter:blur(3px);
}
.hud-chip:hover{border-color:var(--amber-dim);color:var(--text);}
.hud-chip b{color:var(--text);font-weight:700;}
.hud-chip .caret{font-size:8px;opacity:0.7;}
.hud-chip.bp b{color:var(--amber);}
.hud-qty-pop{
  position:absolute;top:96px;left:10px;z-index:60;display:none;
  background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:7px;
  box-shadow:0 12px 30px rgba(0,0,0,0.6);width:172px;
}
.hud-qty-pop.open{display:block;}
.hud-qty-pop .qp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:6px;}
.hud-qty-pop .qp-grid button{
  background:var(--panel2);border:1px solid var(--line);color:var(--text-dim);
  font-size:10.5px;font-weight:600;padding:5px 0;border-radius:3px;
}
.hud-qty-pop .qp-grid button:hover{border-color:var(--amber-dim);color:var(--amber);}
.hud-qty-pop input{
  width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:3px;padding:5px 7px;font-size:11px;font-family:var(--mono);outline:none;
}
.hud-qty-pop .qp-note{font-size:9px;color:var(--text-dimmer);margin-top:5px;line-height:1.4;}
/* ---------- LESSON BOT ---------- */
.hn-div{width:1px;height:22px;background:var(--line);flex-shrink:0;}
.hn-lesson{
  /* deliberately identical to .hn-brand: same face, same 14px, same 800 weight,
     same letter-spacing. Only the colour tells them apart. */
  display:flex;align-items:center;gap:8px;background:none;border:none;
  color:var(--text);font-size:14px;font-weight:800;letter-spacing:0.5px;
  padding:4px 8px;border-radius:6px;transition:background .15s, transform .15s;
}
.lz-logo{width:26px;height:26px;object-fit:contain;flex-shrink:0;
  filter:drop-shadow(0 0 6px rgba(167,139,250,0.45));}
.hn-lesson .lb{color:var(--teal);}
.hn-lesson:hover{background:rgba(167,139,250,0.12);transform:translateY(-1px);}
.hn-lesson.on{background:rgba(167,139,250,0.16);}
.hn-prog{
  font-size:9px;font-weight:800;letter-spacing:0.4px;color:var(--violet);
  background:rgba(167,139,250,0.16);border:1px solid rgba(167,139,250,0.35);
  border-radius:9px;padding:2px 6px;
}
.lessons{position:fixed;inset:0;z-index:520;overflow-y:auto;background:var(--bg);display:none;font-family:var(--mono);}
.lessons .hn-lesson{color:var(--violet);}
.lz-wrap{max-width:1120px;margin:0 auto;padding:34px 22px 80px;position:relative;z-index:1;}
.lz-glow{
  position:fixed;top:-240px;left:50%;transform:translateX(-50%);width:820px;height:560px;
  pointer-events:none;background:radial-gradient(circle, rgba(167,139,250,0.18) 0%, transparent 65%);
  filter:blur(30px);animation:glowdrift 20s ease-in-out infinite;
}
.lz-hero-logo{
  width:72px;height:72px;object-fit:contain;margin-bottom:10px;display:block;
  filter:drop-shadow(0 0 16px rgba(167,139,250,0.5));
  animation:bob 4.5s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.lz-head h1{font-size:26px;font-weight:800;letter-spacing:-0.4px;}
.lz-head h1 .v{color:var(--violet);}
.lz-head p{font-size:12px;color:var(--text-dim);margin-top:6px;line-height:1.6;max-width:640px;}
.lz-bar{height:5px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);margin:16px 0 4px;overflow:hidden;}
.lz-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),#d8c8ff);width:0;transition:width .7s cubic-bezier(.2,.7,.3,1);}
.lz-bar-txt{font-size:10px;color:var(--text-dimmer);letter-spacing:0.5px;margin-bottom:24px;}
.lz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:13px;}
.lz-card{
  /* a <button> with no colour falls back to the browser's default ButtonText —
     which is black. On a dark panel that reads as a smudge. Say it explicitly. */
  background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:15px;
  color:var(--text);font-family:var(--mono);
  text-align:left;position:relative;overflow:hidden;transition:transform .18s, border-color .18s;
}
.lz-card:not(.locked):hover{transform:translateY(-3px);border-color:rgba(167,139,250,0.5);}
.lz-card.locked{opacity:0.45;cursor:not-allowed;}
.lz-card.done{border-color:var(--green-dim);}
.lz-n{
  width:26px;height:26px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--text-dim);
  margin-bottom:9px;
}
.lz-card.done .lz-n{background:var(--green-dim);border-color:var(--green-dim);color:var(--green);}
.lz-card.now .lz-n{background:rgba(167,139,250,0.18);border-color:var(--violet);color:var(--violet);}
.lz-card h4{font-size:12.5px;font-weight:700;margin-bottom:5px;color:var(--text);}
.lz-card p{font-size:10.5px;color:var(--text-dimmer);line-height:1.5;}
.lz-tag{
  position:absolute;top:13px;right:13px;font-size:8px;font-weight:800;letter-spacing:0.6px;
  padding:3px 6px;border-radius:4px;
}
.lz-tag.done{background:var(--green-dim);color:var(--green);}
.lz-tag.now{background:rgba(167,139,250,0.18);color:var(--violet);}
.lz-tag.locked{background:var(--panel2);color:var(--text-dimmer);}

.cert-modal{
  width:min(1080px, 94vw);background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:14px;box-shadow:0 30px 90px rgba(0,0,0,0.75);
  animation:certIn .5s cubic-bezier(.2,.7,.3,1);
}
@keyframes certIn{from{opacity:0;transform:translateY(20px) scale(.96);}}
.cert-modal canvas{display:block;width:100%;border-radius:7px;}
.cert-actions{display:flex;gap:8px;justify-content:center;margin-top:13px;}
.cert-note{text-align:center;font-size:10px;color:var(--text-dimmer);margin-top:8px;}
.lz-detail{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:18px;align-items:start;}
.lz-right{display:flex;flex-direction:column;gap:14px;}
.lz-hero-diagram{
  background:var(--panel);border:1px solid rgba(167,139,250,0.45);border-radius:11px;
  padding:14px;position:relative;
  box-shadow:0 0 34px rgba(167,139,250,0.09);
}
.lz-hero-diagram .lz-diagram{background:transparent;border:none;padding:0;margin:0;}
.lz-hero-diagram .dg-cap{font-size:11px;color:var(--text-dim);}
.lz-panel-tag{
  font-size:8px;letter-spacing:1.2px;font-weight:800;color:var(--violet);
  background:rgba(167,139,250,0.14);border:1px solid rgba(167,139,250,0.3);
  border-radius:4px;padding:3px 7px;display:inline-block;margin-bottom:10px;
}
.lz-panel-tag.yours{color:var(--amber);background:var(--amber-dim);border-color:var(--amber-dim);}
@media(max-width:900px){.lz-detail{grid-template-columns:1fr;}}
.lz-back{background:none;border:none;color:var(--text-dim);font-size:11px;margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.lz-back:hover{color:var(--violet);}
.lz-teach{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:18px;}
.lz-teach .step{font-size:9px;letter-spacing:1px;color:var(--violet);font-weight:800;}
.pg-dots{display:flex;align-items:center;gap:5px;margin:14px 0 12px;}
.pg-dot{
  width:22px;height:5px;border-radius:3px;background:var(--line);border:none;padding:0;
  transition:background .2s, transform .2s;
}
.pg-dot.done{background:rgba(167,139,250,0.45);}
.pg-dot.on{background:var(--violet);transform:scaleY(1.6);}
.pg-dot:hover{background:var(--violet);}
.pg-count{margin-left:auto;font-size:9px;color:var(--text-dimmer);font-weight:700;letter-spacing:0.5px;}
.pg-card{
  min-height:196px;display:flex;flex-direction:column;
  animation:pgIn .28s cubic-bezier(.2,.7,.3,1);
}
@keyframes pgIn{from{opacity:0;transform:translateX(14px);}}
.pg-tag{
  font-size:8.5px;letter-spacing:1.2px;font-weight:800;margin-bottom:10px;
  color:var(--violet);align-self:flex-start;
  background:rgba(167,139,250,0.13);border:1px solid rgba(167,139,250,0.3);
  border-radius:4px;padding:3px 8px;
}
.pg-tag.watch{color:var(--blue);background:rgba(77,157,255,0.1);border-color:rgba(77,157,255,0.3);}
.pg-tag.mistake{color:var(--red);background:rgba(255,59,48,0.09);border-color:rgba(255,59,48,0.28);}
.pg-tag.recap{color:var(--green);background:var(--green-dim);border-color:var(--green-dim);}
.pg-tag.yours{color:var(--amber);background:var(--amber-dim);border-color:var(--amber-dim);}
.pg-body{font-size:14px;line-height:1.85;color:var(--text-dim);}
.pg-body.big{font-size:16px;line-height:1.75;color:var(--text);font-weight:600;}
.pg-body b{color:var(--text);font-weight:700;}
.pg-body .em{color:var(--violet);font-weight:700;}
.pg-task{font-size:14px;line-height:1.7;color:var(--text);}
.pg-task b{color:var(--amber);}
.pg-next-up{
  margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft);
  font-size:11.5px;color:var(--violet);font-weight:600;
}
.pg-nav{display:flex;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line-soft);}
.pg-btn{
  flex:1;background:var(--violet);color:#fff;border:none;border-radius:7px;
  padding:12px 14px;font-size:12.5px;font-weight:800;letter-spacing:0.4px;
  transition:filter .15s, transform .12s;
}
.pg-btn:hover{filter:brightness(1.12);transform:translateY(-1px);}
.pg-btn.ghost{flex:0 0 92px;background:transparent;border:1px solid var(--line);color:var(--text-dim);}
.pg-btn.ghost:hover{border-color:var(--violet);color:var(--violet);transform:none;}
.pg-btn:disabled{opacity:0.3;pointer-events:none;}
.lz-hook{
  font-size:13px;line-height:1.6;color:var(--text);font-weight:600;
  border-left:2px solid var(--amber);padding:2px 0 2px 11px;margin:0 0 14px;
}
.lz-watch{
  background:rgba(77,157,255,0.07);border:1px solid rgba(77,157,255,0.28);
  border-radius:8px;padding:11px 12px;margin:12px 0 4px;
}
.lz-watch .wl-tag{font-size:8px;letter-spacing:1.1px;color:var(--blue);font-weight:800;margin-bottom:5px;}
.lz-watch .wl-body{font-size:11px;line-height:1.7;color:var(--text-dim);}
.lz-watch .wl-body b{color:var(--text);}
.lz-mistake{
  background:rgba(255,59,48,0.07);border:1px solid rgba(255,59,48,0.25);
  border-radius:8px;padding:11px 12px;margin-top:14px;font-size:11px;line-height:1.65;color:var(--text-dim);
}
.lz-mistake .mk-tag{font-size:8px;letter-spacing:1.1px;color:var(--red);font-weight:800;margin-bottom:5px;}
.lz-mistake b{color:var(--text);}
.lz-recap{
  margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft);
  font-size:11.5px;line-height:1.6;color:var(--text);
}
.lz-recap b{display:block;font-size:8px;letter-spacing:1.1px;color:var(--text-dimmer);margin-bottom:4px;}
.lz-unlocks{margin-top:8px;font-size:10.5px;color:var(--violet);font-weight:600;}
.lz-num{display:flex;align-items:center;gap:8px;margin-top:9px;}
.lz-num input{
  flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:5px;padding:9px 10px;font-size:14px;font-family:var(--mono);font-weight:700;outline:none;
}
.lz-num input:focus{border-color:var(--violet);}
.lz-unit{font-size:11px;color:var(--text-dimmer);font-weight:700;}
.lz-stage{
  grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:18px 0 2px;
}
.lz-stage:first-child{margin-top:0;}
.lz-stage .sn{
  font-size:9px;letter-spacing:1.2px;font-weight:800;color:var(--violet);
  background:rgba(167,139,250,0.13);border:1px solid rgba(167,139,250,0.3);
  border-radius:5px;padding:4px 9px;white-space:nowrap;
}
.lz-stage .sd{font-size:10px;color:var(--text-dimmer);}
.lz-stage .sl{flex:1;height:1px;background:var(--line-soft);}
.lz-stage.optional .sn{color:var(--text-dim);background:var(--panel2);border-color:var(--line);}
.lz-diagram{
  background:#0f1218;border:1px solid var(--line);border-radius:9px;
  padding:12px 10px 9px;margin:0 0 14px;
}
.lz-diagram svg{width:100%;height:auto;display:block;}
.dg-l{transition:opacity .45s ease, transform .45s cubic-bezier(.2,.8,.3,1);transform-origin:center;}
.dg-l.off{opacity:0;pointer-events:none;}
.dg-l.just{animation:dgPop .5s cubic-bezier(.2,.8,.3,1);}
@keyframes dgPop{from{opacity:0;transform:scale(0.94);}to{opacity:1;transform:none;}}
.dg-cap{
  font-size:10px;color:var(--text-dimmer);line-height:1.55;text-align:center;
  margin-top:9px;padding-top:8px;border-top:1px solid var(--line-soft);
}
.lz-teach h2{font-size:18px;font-weight:800;margin:6px 0 12px;letter-spacing:-0.3px;}
.lz-teach p{font-size:11.5px;color:var(--text-dim);line-height:1.75;margin-bottom:10px;}
.lz-teach p b{color:var(--text);}
.lz-teach .em{color:#c4b0ff;font-weight:700;}
.lz-task{
  background:rgba(167,139,250,0.09);border:1px solid rgba(167,139,250,0.35);
  border-radius:8px;padding:12px;margin-top:14px;
}
.lz-task .tl{font-size:8.5px;letter-spacing:1px;color:var(--violet);font-weight:800;margin-bottom:5px;}
.lz-task .tp{font-size:11.5px;color:var(--text);line-height:1.6;}
.lz-actions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap;}
.lz-btn{
  /* white letters on a deep violet — the pale violet with near-black text read as
     a black smudge at this size */
  background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;border:none;border-radius:6px;
  padding:9px 14px;font-size:11px;font-weight:800;letter-spacing:0.5px;
  box-shadow:0 2px 10px rgba(124,58,237,0.3);
}
.lz-btn:hover{filter:brightness(1.14);box-shadow:0 4px 16px rgba(124,58,237,0.45);}
.lz-btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text-dim);}
.lz-btn.ghost:hover{border-color:var(--violet);color:var(--violet);}
.lz-btn:disabled{opacity:0.4;}
.lz-feedback{margin-top:11px;font-size:11px;line-height:1.6;border-radius:7px;padding:10px 11px;display:none;}
.lz-feedback.good{display:block;background:var(--green-dim);border:1px solid var(--green-dim);color:var(--green);}
.lz-feedback.bad{display:block;background:var(--red-dim);border:1px solid var(--red-dim);color:var(--red);}
.lz-feedback b{display:block;margin-bottom:3px;}
.lz-chart-wrap{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px;position:relative;}
/* The canvas measures its parent to size itself. When the parent's height was
   decided by the canvas, every redraw added the padding again and the chart grew
   a little with each click. The box is a fixed height now and the canvas fills
   it absolutely, so measuring the parent can't feed back into it. */
.confetti-cv{position:fixed;inset:0;z-index:9999;pointer-events:none;}
.cert-modal{
  background:var(--panel);border:1px solid var(--violet);border-radius:12px;padding:16px;
  width:min(880px, 94vw);box-shadow:0 30px 80px rgba(0,0,0,0.7);
  animation:certIn .5s cubic-bezier(.2,.8,.3,1);
}
@keyframes certIn{from{opacity:0;transform:scale(.9) translateY(18px);}}
.cert-modal canvas{width:100%;height:auto;border-radius:7px;display:block;}
.cert-actions{display:flex;gap:8px;justify-content:center;margin-top:14px;}
.cert-note{text-align:center;font-size:9.5px;color:var(--text-dimmer);margin-top:9px;}
.lz-canvas-box{position:relative;height:280px;width:100%;}
.lz-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none;-webkit-user-select:none;user-select:none;}
@media(max-width:900px){.lz-canvas-box{height:250px;}}
.lz-hint{font-size:9.5px;color:var(--text-dimmer);margin-top:8px;text-align:center;}
.lz-choice{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;}
.lz-choice button{
  flex:1;min-width:110px;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  font-family:var(--mono);
  border-radius:7px;padding:10px;font-size:11.5px;font-weight:600;
}
.lz-choice button:hover{border-color:var(--violet);}
.lz-choice button.sel{border-color:var(--violet);background:rgba(167,139,250,0.14);}

/* ================= HOME ================= */
.home{
  position:fixed;inset:0;z-index:500;overflow-y:auto;background:var(--bg);
  font-family:var(--mono);
}
.home-glow{
  position:fixed;top:-260px;left:50%;transform:translateX(-50%);
  width:900px;height:620px;pointer-events:none;z-index:0;
  background:radial-gradient(circle, rgba(77,157,255,0.16) 0%, rgba(255,176,0,0.06) 42%, transparent 68%);
  filter:blur(28px);animation:glowdrift 18s ease-in-out infinite;
}
@keyframes glowdrift{
  0%,100%{transform:translateX(-50%) translateY(0) scale(1);opacity:0.85;}
  50%{transform:translateX(-46%) translateY(24px) scale(1.08);opacity:1;}
}
.hn{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;
  padding:0 22px;height:58px;
  background:rgba(10,12,15,0.82);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.hn-brand{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--text);font-size:14px;font-weight:800;letter-spacing:0.5px;}
.hn-brand img{width:26px;height:26px;object-fit:contain;}
.hn-brand .accent{color:var(--amber);}
.hn-search{
  display:flex;align-items:center;gap:8px;flex:0 1 320px;
  background:var(--panel2);border:1px solid var(--line);border-radius:20px;
  padding:7px 12px;color:var(--text-dimmer);font-size:11.5px;transition:border-color .15s, background .15s;
}
.hn-search:hover{border-color:var(--amber-dim);background:var(--panel);}
.hn-search svg{width:13px;height:13px;}
.hn-search kbd{margin-left:auto;background:var(--line);border-radius:3px;padding:1px 5px;font-size:9px;font-family:var(--mono);}
.hn-links{display:flex;gap:2px;margin-left:6px;}
.hn-link{
  background:none;border:none;color:var(--text-dim);font-size:12px;font-weight:600;
  padding:7px 11px;border-radius:5px;position:relative;
}
.hn-link:hover{color:var(--text);background:var(--panel2);}
.hn-link.active{color:var(--text);}
.hn-link.active::after{
  content:'';position:absolute;left:11px;right:11px;bottom:1px;height:2px;
  background:var(--amber);border-radius:2px;
}
.hn-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.hn-acct{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:4px 11px 4px 4px;color:var(--text-dim);font-size:11px;}
.hn-acct:hover{border-color:var(--amber-dim);color:var(--text);}
.hn-acct .av{width:20px;height:20px;border-radius:50%;background:var(--amber-dim);color:var(--amber);font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.hn-cta{
  background:var(--amber);color:#0a0c0f;border:none;border-radius:18px;
  padding:8px 15px;font-size:11.5px;font-weight:800;letter-spacing:0.4px;
  display:flex;align-items:center;gap:6px;transition:transform .12s, box-shadow .12s;
}
.hn-cta span{transition:transform .18s;}
.hn-cta:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,176,0,0.3);}
.hn-cta:hover span{transform:translateX(3px);}

.hm{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:36px 22px 80px;}
.rise{opacity:0;transform:translateY(14px);animation:rise .6s cubic-bezier(.2,.7,.3,1) forwards;}
@keyframes rise{to{opacity:1;transform:none;}}
@keyframes draw{to{stroke-dashoffset:0;}}

.greet h1{font-size:30px;font-weight:800;letter-spacing:-0.5px;line-height:1.25;}
.greet h1 .nm{
  background:linear-gradient(90deg, var(--amber), #ffd479);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.greet .sub{margin-top:7px;font-size:12px;color:var(--text-dim);letter-spacing:0.2px;}
.greet .sub .live{color:var(--green);}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0 30px;}
.chip{
  background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:10px 14px;min-width:132px;transition:transform .15s, border-color .15s;
}
.chip:hover{transform:translateY(-2px);border-color:var(--amber-dim);}
.chip .cl{font-size:8.5px;letter-spacing:0.9px;color:var(--text-dimmer);font-weight:700;}
.chip .cv{font-size:17px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums;}
.chip .cs{font-size:9.5px;color:var(--text-dimmer);margin-top:2px;}

.hero{
  background:linear-gradient(180deg, var(--panel) 0%, rgba(13,16,21,0.6) 100%);
  border:1px solid var(--line);border-radius:14px;padding:20px 20px 8px;margin-bottom:14px;
  position:relative;overflow:hidden;
}
.hero-head{display:flex;align-items:center;gap:13px;margin-bottom:2px;}
.hero-badge{
  width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--amber),#e0851a);
  color:#0a0c0f;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.hero-name{font-size:15px;font-weight:700;}
.hero-tag{font-size:9px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px 6px;color:var(--text-dim);margin-left:7px;font-weight:700;}
.hero-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 var(--green);animation:pulse 2s infinite;}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(0,217,100,0.5);}
  70%{box-shadow:0 0 0 7px rgba(0,217,100,0);}
  100%{box-shadow:0 0 0 0 rgba(0,217,100,0);}
}
.hero-px{font-size:34px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;margin-top:6px;}
.hero-chg{font-size:13px;font-weight:700;margin-left:9px;}
.hero-chart{width:100%;height:210px;display:block;margin-top:6px;}
.hero-chart .line{fill:none;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;}
.hero-x{display:flex;justify-content:space-between;font-size:9px;color:var(--text-dimmer);padding:2px 4px 10px;}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:14px;}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px;
  transition:transform .18s cubic-bezier(.2,.7,.3,1), border-color .18s;
}
.card:hover{transform:translateY(-3px);border-color:var(--line-soft);}
.card h3{font-size:9.5px;letter-spacing:1.1px;color:var(--text-dimmer);font-weight:800;margin-bottom:11px;display:flex;justify-content:space-between;align-items:center;}
.card h3 .more{color:var(--amber);font-weight:700;letter-spacing:0.3px;font-size:9px;cursor:pointer;}
.row{
  display:flex;align-items:center;gap:9px;padding:7px 6px;border-radius:6px;cursor:pointer;
  transition:background .12s;
}
.row:hover{background:var(--panel2);}
.row .t{font-size:11.5px;font-weight:700;width:62px;flex-shrink:0;}
.row .n{font-size:9.5px;color:var(--text-dimmer);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .spark{width:56px;height:20px;flex-shrink:0;}
.row .px{font-size:11px;font-variant-numeric:tabular-nums;width:66px;text-align:right;}
.row .ch{font-size:10.5px;font-weight:700;width:56px;text-align:right;font-variant-numeric:tabular-nums;}
.empty-card{font-size:10.5px;color:var(--text-dimmer);line-height:1.6;padding:10px 4px;}
.cal-mini{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:4px;}
.cal-mini i{
  aspect-ratio:1;border-radius:2px;background:var(--panel2);border:1px solid var(--line-soft);
  animation:pop .3s backwards;
}
@keyframes pop{from{transform:scale(0.4);opacity:0;}}
.cal-mini i.w{background:var(--green-dim);border-color:var(--green-dim);}
.cal-mini i.l{background:var(--red-dim);border-color:var(--red-dim);}
.learn{display:flex;flex-direction:column;gap:8px;}
.learn button{
  text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:7px;
  padding:10px 11px;color:var(--text-dim);font-size:11px;line-height:1.45;
  font-family:var(--mono);transition:border-color .15s, transform .15s;
}
.learn button:hover{border-color:var(--amber-dim);color:var(--text);transform:translateX(3px);}
.learn button b{color:var(--amber);display:block;font-size:10.5px;margin-bottom:2px;letter-spacing:0.3px;}
@media (max-width:820px){
  /* the nav scrolls sideways instead of dropping links */
  .hn{gap:10px;overflow-x:auto;scrollbar-width:none;}
  .hn::-webkit-scrollbar{height:0;}
  .hn > *{flex-shrink:0;}
  .hn-search{flex:0 0 auto;width:44px;padding:7px;justify-content:center;}
  .hn-search span,.hn-search kbd{display:none;}
  .hn-right{margin-left:0;}
  .hn-links{order:5;}
  .greet h1{font-size:22px;}
  .hero-px{font-size:26px;}
  .hero-chart{height:170px;}
  .grid{grid-template-columns:1fr;}
  .chips{gap:7px;}
  .lz-grid{grid-template-columns:1fr;}
  .lz-hero-logo{width:56px;height:56px;}
  .lz-head h1{font-size:20px;}
  .lz-teach{padding:15px;}
  .lz-btn{flex:1;padding:11px 10px;}      /* thumb-sized */
  .lz-actions{gap:6px;}
  .auth-card{padding:22px 18px 16px;}
}
/* a real phone: the lesson chart still has to be tappable and legible */
@media (max-width:560px){
  .lz-canvas-box{height:260px;}
  .lz-choice button{min-width:0;}
  .cal-mini i{border-radius:1px;}
}
.chart-wrap.replay-picking canvas{cursor:crosshair;}

/* ---------- SIGN IN ---------- */
.auth-overlay{
  position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 40%, #12161d 0%, var(--bg) 70%);
  padding:20px;overflow-y:auto;
}
.auth-card{
  width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:26px 24px 20px;box-shadow:0 24px 70px rgba(0,0,0,0.65);
  display:flex;flex-direction:column;align-items:center;
}
.auth-logo{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 0 12px rgba(77,157,255,0.3));}
.auth-brand{font-size:20px;font-weight:700;letter-spacing:1px;margin-top:8px;}
.auth-brand .accent{color:var(--amber);}
.auth-tag{font-size:9px;letter-spacing:1.6px;color:var(--text-dimmer);text-transform:uppercase;margin-top:3px;}
.auth-tabs{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:2px;margin:20px 0 16px;width:100%;}
.auth-tab{flex:1;background:transparent;border:none;color:var(--text-dim);font-size:11.5px;font-weight:700;padding:7px 0;border-radius:3px;}
.auth-tab.active{background:var(--amber-dim);color:var(--amber);}
.auth-form{width:100%;display:flex;flex-direction:column;}
.auth-lbl{font-size:8.5px;letter-spacing:0.9px;color:var(--text-dimmer);font-weight:700;margin-bottom:4px;}
.auth-form input{
  width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:4px;padding:9px 10px;font-size:12px;font-family:var(--mono);outline:none;margin-bottom:12px;
}
.auth-form input:focus{border-color:var(--amber-dim);}
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:34px;}
.pw-eye{
  position:absolute;right:1px;top:1px;height:34px;width:32px;
  background:transparent;border:none;color:var(--text-dimmer);
  display:flex;align-items:center;justify-content:center;border-radius:0 4px 4px 0;
}
.pw-eye:hover{color:var(--amber);}
.pw-eye.on{color:var(--amber);}
.pw-eye svg{width:15px;height:15px;}
.auth-err{font-size:10.5px;color:var(--red);min-height:14px;margin-bottom:6px;line-height:1.4;}
.auth-go{
  background:var(--amber);color:#0a0c0f;border:none;border-radius:4px;padding:10px 0;
  font-size:11.5px;font-weight:800;letter-spacing:1px;width:100%;
}
.auth-go:hover{filter:brightness(1.08);}
.auth-go:disabled{opacity:0.6;}
.auth-guest{background:transparent;border:none;color:var(--text-dim);font-size:10.5px;margin-top:12px;text-decoration:underline;}
.auth-guest:hover{color:var(--amber);}
.auth-note{font-size:9px;color:var(--text-dimmer);line-height:1.5;margin-top:14px;text-align:center;}
.acct-chip{
  display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);
  border-radius:4px;padding:4px 8px;margin-right:8px;max-width:150px;
}
.acct-chip .av{
  width:17px;height:17px;border-radius:50%;background:var(--amber-dim);color:var(--amber);
  font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.acct-chip .em{font-size:10px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.acct-chip:hover{border-color:var(--amber-dim);}

/* ---------- SELECTED-DRAWING TOOLBAR ---------- */
.draw-tb{
  position:absolute;display:none;align-items:center;gap:6px;z-index:70;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:5px 7px;box-shadow:0 10px 26px rgba(0,0,0,0.6);
}
.draw-tb .tb-grip{color:var(--text-dimmer);font-size:11px;cursor:default;letter-spacing:-1px;}
.draw-tb .tb-div{width:1px;height:16px;background:var(--line);}
.draw-tb .tb-swatches{display:flex;gap:3px;}
.draw-tb .tb-sw{
  width:15px;height:15px;border-radius:3px;border:1px solid rgba(255,255,255,0.15);padding:0;
}
.draw-tb .tb-sw.on{outline:2px solid var(--amber);outline-offset:1px;}
.draw-tb .tb-widths{display:flex;gap:2px;}
.draw-tb .tb-w{
  width:20px;height:18px;border-radius:3px;border:1px solid transparent;background:transparent;
  display:flex;align-items:center;justify-content:center;
}
.draw-tb .tb-w i{display:block;width:12px;background:var(--text-dim);border-radius:1px;}
.draw-tb .tb-w.on{background:var(--amber-dim);border-color:var(--amber-dim);}
.draw-tb .tb-w.on i{background:var(--amber);}
.draw-tb .tb-del{
  background:transparent;border:none;color:var(--text-dim);width:20px;height:18px;
  display:flex;align-items:center;justify-content:center;
}
.draw-tb .tb-del svg{width:13px;height:13px;}
.draw-tb .tb-del:hover{color:var(--red);}

.news-row{padding:8px 6px;border-bottom:1px solid var(--line-soft);}
.news-row .n-time{font-size:9px;color:var(--text-dimmer);margin-bottom:3px;}
.news-row .n-title{font-size:11.5px;font-weight:700;line-height:1.35;margin-bottom:2px;}
.news-row .n-snip{font-size:10.5px;color:var(--text-dim);line-height:1.4;}

/* ---------- WATCHLIST ---------- */
.watchlist{
  background:var(--panel);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  min-height:0;
  position:relative;
}
.main.wl-hidden .watchlist > *{display:none;}
.main.wl-hidden .watchlist .wl-reveal{display:flex;}

/* the slim tab that hides / shows the instrument list */
.wl-toggle{
  background:transparent;border:1px solid var(--line);color:var(--text-dim);
  border-radius:3px;width:20px;height:18px;display:flex;align-items:center;
  justify-content:center;font-size:11px;line-height:1;flex-shrink:0;
}
.wl-toggle:hover{border-color:var(--amber-dim);color:var(--amber);}
.wl-reveal{
  display:none;position:absolute;inset:0;
  flex-direction:column;align-items:center;gap:10px;padding-top:10px;
  cursor:pointer;
}
.wl-reveal:hover{background:var(--panel2);}
.wl-reveal .arrow{color:var(--text-dim);font-size:11px;}
.wl-reveal .vtxt{
  writing-mode:vertical-rl;text-orientation:mixed;
  font-size:9px;letter-spacing:1.5px;color:var(--text-dimmer);font-weight:700;
}
.panel-head{
  padding:10px 12px 8px;
  font-size:10px;letter-spacing:1.2px;color:var(--text-dimmer);font-weight:700;
  border-bottom:1px solid var(--line-soft);
  display:flex;justify-content:space-between;align-items:center;
}
.watch-scroll{overflow-y:auto;flex:1;padding:4px 6px;}
.watch-cat{font-size:9px;color:var(--text-dimmer);letter-spacing:1px;padding:10px 6px 4px;font-weight:700;}
.watch-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 6px;border-radius:3px;cursor:pointer;border-left:2px solid transparent;
}
.watch-item:hover{background:var(--panel2);}
.watch-item.active{background:var(--panel2);border-left-color:var(--amber);}
.watch-item .w-tick{font-size:11.5px;font-weight:700;}
.watch-item .w-sub{display:flex;flex-direction:column;align-items:flex-end;}
.watch-item .w-px{font-size:11px;}
.watch-item .w-chg{font-size:9.5px;}

/* ---------- CENTER: CHART + INDICATORS STRIP + ORDER PANEL ---------- */
.center{
  display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--line);
}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 4px;}
.set-row .sr-lbl{font-size:11px;color:var(--text-dim);}
.set-row input[type=color]{
  width:46px;height:24px;padding:0;border:1px solid var(--line);border-radius:3px;
  background:var(--panel2);cursor:pointer;
}
.set-div{height:1px;background:var(--line-soft);margin:5px 0;}
.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:3px 0;}
.preset-btn{
  display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);
  color:var(--text-dim);border-radius:3px;padding:6px 7px;font-size:10px;font-weight:600;
}
.preset-btn:hover{border-color:var(--amber-dim);color:var(--text);}
.preset-btn .sw{display:flex;gap:2px;}
.preset-btn .sw i{width:7px;height:11px;border-radius:1px;display:block;}
.set-note{font-size:9.5px;color:var(--text-dimmer);line-height:1.4;padding:4px;}
.wl-tabs{display:flex;gap:2px;padding:6px 6px 0;flex-shrink:0;}
.wl-tab{
  flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text-dim);
  font-size:9px;font-weight:700;letter-spacing:0.6px;padding:5px 0;border-radius:3px;
}
.wl-tab.active{background:var(--amber-dim);color:var(--amber);border-color:var(--amber-dim);}
.wl-name{cursor:pointer;display:flex;align-items:center;gap:5px;}
.wl-name:hover{color:var(--amber);}
.wl-name .wl-pencil{font-size:9px;opacity:0.6;}
.wl-empty{padding:18px 12px;font-size:10.5px;color:var(--text-dimmer);line-height:1.6;text-align:center;}
.wl-empty b{color:var(--amber);}
.watch-item{position:relative;}
.wl-add,.wl-rm{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;border-radius:3px;border:1px solid var(--line);
  background:var(--panel);color:var(--text-dim);font-size:11px;line-height:1;
  display:none;align-items:center;justify-content:center;padding:0;
}
.watch-item:hover .wl-add,.watch-item:hover .wl-rm{display:flex;}
.wl-add.has{display:flex;border-color:transparent;background:transparent;color:var(--green);}
.wl-add:hover{border-color:var(--green);color:var(--green);}
.wl-rm:hover{border-color:var(--red);color:var(--red);}
.watch-item:hover .w-sub{padding-right:20px;}
.watch-search{padding:6px;border-bottom:1px solid var(--line-soft);flex-shrink:0;}
.watch-search input{
  width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  padding:5px 7px;border-radius:3px;font-size:11px;outline:none;font-family:var(--mono);
}
.watch-search input:focus{border-color:var(--amber-dim);}
.chart-grid{
  flex:1;min-height:0;min-width:0;display:grid;gap:1px;background:var(--line);
}
.chart-grid.layout-1{grid-template-columns:1fr;grid-template-rows:1fr;}
.chart-grid.layout-2{grid-template-columns:1fr 1fr;grid-template-rows:1fr;}
.chart-grid.layout-3{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr;}
.chart-grid.layout-4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;}
.chart-wrap{
  min-height:0;min-width:0;position:relative;background:var(--panel2);
  -webkit-user-select:none;user-select:none;
}
.mini-pane{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel2);}
.mp-head{
  display:flex;align-items:center;gap:4px;padding:4px 5px;background:var(--panel);
  border-bottom:1px solid var(--line-soft);flex-shrink:0;
}
.mp-head select{
  background:var(--panel2);border:1px solid var(--line);color:var(--text);
  font-size:10px;border-radius:3px;padding:3px 4px;outline:none;
}
.mp-head select:focus{border-color:var(--amber-dim);}
.mp-chg{font-size:10px;font-weight:600;margin-left:auto;}
.mp-main-btn{
  background:var(--panel2);border:1px solid var(--line);color:var(--text-dim);
  font-size:8.5px;font-weight:700;letter-spacing:0.4px;border-radius:3px;padding:3px 5px;
}
.mp-main-btn:hover{border-color:var(--amber-dim);color:var(--amber);}
.mp-body{flex:1;min-height:0;position:relative;overflow:hidden;}
.mp-label{z-index:40;}
.mp-body canvas{display:block;width:100%;height:100%;}
#chartCanvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;}
.chart-crosshair-label{
  position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);
  padding:8px 9px;font-size:10.5px;border-radius:4px;display:none;color:var(--text);
  width:236px;box-shadow:0 10px 28px rgba(0,0,0,0.6);z-index:60;line-height:1.5;
}
.cl-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
.cl-head b{font-size:11px;}
.cl-pill{font-size:9px;font-weight:700;letter-spacing:0.5px;padding:2px 5px;border-radius:3px;}
.cl-grid{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:2px 6px;font-size:10px;}
.cl-grid span{color:var(--text-dimmer);}
.cl-grid b{font-weight:600;color:var(--text);text-align:right;}
.cl-note{margin-top:7px;padding-top:6px;border-top:1px solid var(--line-soft);color:var(--text-dim);font-size:9.5px;}

/* ---------- HOVER EXPLAINER TOOLTIPS ---------- */
#tipBubble{
  position:fixed;z-index:9999;pointer-events:none;display:none;max-width:250px;
  background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--amber);
  color:var(--text);font-family:var(--mono);font-size:10.5px;line-height:1.5;
  padding:7px 9px;border-radius:4px;box-shadow:0 10px 28px rgba(0,0,0,0.6);
}
#tipBubble .tb-t{display:block;color:var(--amber);font-weight:700;font-size:9.5px;letter-spacing:0.6px;margin-bottom:3px;}
.overlay-toggles{
  position:absolute;top:8px;left:10px;display:flex;gap:6px;flex-wrap:nowrap;max-width:calc(100% - 90px);
  pointer-events:none;overflow:hidden;
}
.ov-btn{
  background:rgba(17,20,25,0.85);border:1px solid var(--line);color:var(--text-dim);
  padding:3px 7px;font-size:10px;border-radius:3px;font-weight:600;backdrop-filter:blur(2px);
  pointer-events:auto;
}
.ov-btn.on{color:var(--amber);border-color:var(--amber-dim);}

.indicator-strip{
  display:flex;
  border-top:1px solid var(--line);
  background:var(--panel);
  overflow-x:auto;
  flex-shrink:0;
}
.ind-cell{
  padding:6px 12px;border-right:1px solid var(--line-soft);white-space:nowrap;
}
.ind-cell .il{font-size:8.5px;color:var(--text-dimmer);letter-spacing:0.5px;}
.ind-cell .iv{font-size:11.5px;font-weight:600;}

/* ---------- ORDER TICKET (right column, upper) ---------- */
.right-col{display:flex;flex-direction:column;min-height:0;background:var(--panel);}
.order-panel{border-bottom:1px solid var(--line);flex-shrink:0;}
.side-tabs{display:flex;}
.side-tab{
  flex:1;padding:10px;border:none;font-size:12px;font-weight:700;letter-spacing:0.5px;background:var(--panel2);color:var(--text-dim);
}
.side-tab.buy.active{background:var(--green-dim);color:var(--green);}
.side-tab.sell.active{background:var(--red-dim);color:var(--red);}

.order-body{padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
.field label{font-size:9.5px;color:var(--text-dimmer);letter-spacing:0.5px;display:block;margin-bottom:3px;}
.field input,.field select{
  width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  padding:7px 8px;border-radius:3px;font-size:12px;outline:none;
}
.field input:focus,.field select:focus{border-color:var(--amber-dim);}
.field-row{display:flex;gap:8px;}
.field-row .field{flex:1;}
.qty-quick{display:flex;gap:4px;margin-top:4px;}
.qty-quick button{
  flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text-dim);
  padding:4px 0;font-size:9.5px;border-radius:3px;
}
.qty-quick button:hover{border-color:var(--text-dim);color:var(--text);}

.est-row{
  display:flex;justify-content:space-between;font-size:11.5px;padding:8px 0;border-top:1px dashed var(--line);margin-top:2px;
}
.est-row .lbl{color:var(--text-dim);}
.est-row .val{font-weight:700;}

.submit-btn{
  width:100%;padding:10px;border:none;border-radius:3px;font-size:12.5px;font-weight:700;letter-spacing:0.5px;margin-top:2px;
}
.submit-btn.buy{background:var(--green);color:#00190a;}
.submit-btn.buy:hover{background:#00f070;}
.submit-btn.sell{background:var(--red);color:#eef3ff;}
.submit-btn.sell:hover{background:#4c7ff0;}

.account-strip{
  display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft);border-bottom:1px solid var(--line);flex-shrink:0;
}

/* ---------- FULL-WIDTH ACCOUNT PANEL (bottom) ---------- */
.bottom-panel{
  display:flex;flex-direction:column;min-height:0;height:236px;
  background:var(--panel);border-top:1px solid var(--line);
  transition:height 0.16s ease;
}
.bottom-panel.collapsed{height:32px;}
.bottom-panel.collapsed .bp-metrics,.bottom-panel.collapsed .bottom-content{display:none;}
.bp-metrics{
  display:flex;gap:0;background:var(--panel);border-bottom:1px solid var(--line-soft);
  flex-shrink:0;overflow-x:auto;scrollbar-width:none;
}
.bp-metrics::-webkit-scrollbar{height:0;}
.bp-cell{padding:7px 16px 8px;border-right:1px solid var(--line-soft);white-space:nowrap;flex-shrink:0;}
.bp-cell.clickable{cursor:pointer;}
.bp-cell.clickable:hover{background:var(--panel2);}
.bp-cell.clickable:hover .bl{color:var(--amber);}
.bp-cell .bl{font-size:8.5px;color:var(--text-dimmer);letter-spacing:0.6px;font-weight:600;}
.bp-cell .bv{font-size:14px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums;}
.bp-head{display:flex;align-items:center;flex-shrink:0;border-bottom:1px solid var(--line);}
.bp-head .bottom-tabs{border-bottom:none;flex:1;}
.bt-tab .cnt{
  display:inline-block;margin-left:5px;padding:1px 4px;border-radius:8px;
  background:var(--line);color:var(--text-dim);font-size:9px;font-weight:700;
}
.bt-tab.active .cnt{background:var(--amber-dim);color:var(--amber);}
.bp-collapse{
  background:transparent;border:1px solid var(--line);color:var(--text-dim);
  border-radius:3px;width:22px;height:19px;margin-right:10px;font-size:11px;line-height:1;
}
.bp-collapse:hover{border-color:var(--amber-dim);color:var(--amber);}

/* ---------- DATA TABLES ---------- */
.dt{width:100%;min-width:640px;border-collapse:collapse;font-size:11px;}
.dt th{
  text-align:right;font-weight:600;color:var(--text-dimmer);font-size:9px;letter-spacing:0.6px;
  padding:6px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap;position:sticky;top:0;
  background:var(--panel);z-index:2;
}
.dt th:first-child,.dt td:first-child{text-align:left;}
.dt th.l,.dt td.l{text-align:left;}
.dt td{
  padding:7px 10px;text-align:right;border-bottom:1px solid var(--line-soft);
  white-space:nowrap;font-variant-numeric:tabular-nums;
}
.dt tbody tr:hover{background:var(--panel2);}
.dt .sym-chip{
  display:inline-block;background:var(--panel2);border:1px solid var(--line);
  border-radius:3px;padding:2px 6px;font-weight:700;font-size:10.5px;
}
.dt .side-l{color:var(--green);font-weight:700;}
.dt .side-s{color:var(--red);font-weight:700;}
.dt .row-act{
  background:transparent;border:none;color:var(--text-dimmer);font-size:12px;padding:2px 5px;border-radius:3px;
}
.dt .row-act:hover{color:var(--amber);background:var(--panel);}
.dt .row-act.x:hover{color:var(--red);}
.dt .muted{color:var(--text-dimmer);}

/* ---------- P&L CALENDAR ---------- */
.cal-wrap{padding:4px 2px 10px;}
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.cal-nav{
  background:var(--panel2);border:1px solid var(--line);color:var(--text);
  width:24px;height:22px;border-radius:3px;font-size:12px;line-height:1;
}
.cal-nav:hover{border-color:var(--amber-dim);color:var(--amber);}
.cal-title{font-size:12px;font-weight:700;letter-spacing:0.5px;min-width:135px;}
.cal-sum{display:flex;gap:14px;margin-left:auto;flex-wrap:wrap;}
.cal-sum .cs{display:flex;flex-direction:column;gap:1px;}
.cal-sum .csl{font-size:8px;color:var(--text-dimmer);letter-spacing:0.6px;font-weight:600;}
.cal-sum .csv{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-dow{
  font-size:8.5px;color:var(--text-dimmer);letter-spacing:0.8px;font-weight:700;
  text-align:center;padding:2px 0 4px;
}
.cal-day{
  border:1px solid var(--line-soft);border-radius:3px;background:var(--panel2);
  min-height:52px;padding:4px 5px;display:flex;flex-direction:column;gap:2px;
  cursor:default;
}
.cal-day.blank{background:transparent;border-color:transparent;}
.cal-day.empty{opacity:0.45;}
.cal-day.has{cursor:pointer;}
.cal-day.has:hover{border-color:var(--amber-dim);}
.cal-day.today{border-color:var(--amber);}
.cal-day .cd-n{font-size:9px;color:var(--text-dimmer);font-weight:700;}
.cal-day .cd-p{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;}
.cal-day .cd-t{font-size:8.5px;color:var(--text-dimmer);}
.cal-day.win{background:var(--green-dim);border-color:var(--green-dim);}
.cal-day.win .cd-p{color:var(--green);}
.cal-day.loss{background:var(--red-dim);border-color:var(--red-dim);}
.cal-day.loss .cd-p{color:var(--red);}
.cal-note{font-size:9.5px;color:var(--text-dimmer);margin-top:8px;line-height:1.5;}
.cal-daylist{margin-top:10px;border-top:1px solid var(--line-soft);padding-top:8px;}
.cal-daylist h4{font-size:10px;letter-spacing:0.8px;color:var(--text-dim);margin-bottom:5px;}
.acc-cell{background:var(--panel);padding:8px 12px;}
.acc-cell .al{font-size:8.5px;color:var(--text-dimmer);letter-spacing:0.5px;}
.acc-cell .av{font-size:13px;font-weight:700;margin-top:2px;}

.bottom-tabs-wrap{flex:1;display:flex;flex-direction:column;min-height:0;}
.bottom-tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0;}
.bt-tab{background:transparent;border:none;color:var(--text-dim);padding:8px 10px;font-size:10.5px;font-weight:600;border-bottom:2px solid transparent;}
.bt-tab.active{color:var(--amber);border-bottom-color:var(--amber);}
.bottom-content{flex:1;overflow:auto;padding:6px 8px;min-height:0;-webkit-overflow-scrolling:touch;}
.pos-card{
  border:1px solid var(--line);border-radius:4px;padding:8px 9px;margin-bottom:6px;background:var(--panel2);
}
.pos-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.pos-tick{font-weight:700;font-size:12px;display:flex;align-items:center;gap:6px;}
.pos-side-badge{font-size:8.5px;padding:1px 5px;border-radius:2px;font-weight:700;}
.pos-side-badge.long{background:var(--green-dim);color:var(--green);}
.pos-side-badge.short{background:var(--red-dim);color:var(--red);}
.pos-close{
  background:none;border:1px solid var(--line);color:var(--text-dim);font-size:9px;padding:2px 6px;border-radius:3px;
}
.pos-close:hover{border-color:var(--red);color:var(--red);}
.pos-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:10px;}
.pos-grid .pg-l{color:var(--text-dimmer);font-size:8.5px;}
.pos-grid .pg-v{font-weight:600;}

.hist-row{
  display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px solid var(--line-soft);font-size:10.5px;
}
.hist-row .h-left{display:flex;flex-direction:column;gap:1px;}
.hist-row .h-time{font-size:9px;color:var(--text-dimmer);}
.empty-state{color:var(--text-dimmer);font-size:11px;text-align:center;padding:24px 10px;}

/* ---------- STATUS BAR ---------- */
.statusbar{
  background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;
  padding:0 14px;font-size:10px;color:var(--text-dimmer);gap:16px;
}
.statusbar .sb-item{display:flex;align-items:center;gap:5px;}
.statusbar .sb-dot{width:5px;height:5px;border-radius:50%;background:var(--green);}
.statusbar .flash{color:var(--amber);}

.up{color:var(--green);}
.down{color:var(--red);}
.bg-up{background:var(--green-dim);}
.bg-down{background:var(--red-dim);}

.toast-wrap{position:fixed;top:56px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:1000;}
.toast{
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);
  padding:10px 14px;border-radius:4px;font-size:11.5px;box-shadow:0 8px 24px rgba(0,0,0,0.5);

<!-- ═══════════════════════════════════════════════════════════════════════
     FTA PLATFORM RESKIN — chrome/CSS only. Remaps Simbot's native chrome
     palette (--bg/--panel/--line/--text*/--amber) onto the platform token
     palette (paper/ink/soft/sand/card + gold) for both themes. The candle
     up/down semantics (--green/--red) and the chart engine are UNTOUCHED.
     Driven by <html data-fta-theme="light|dark"> which the embed bootstrap
     sets from ?theme= / postMessage. Standalone (no attr) stays Simbot dark.
     ═══════════════════════════════════════════════════════════════════════ -->
<style id="fta-reskin">
  /* platform typography — system stack so it reads like the host app without
     needing web fonts the iframe cannot load */
  :root[data-fta-theme] html,
  :root[data-fta-theme] body,
  :root[data-fta-theme] button,
  :root[data-fta-theme] input,
  :root[data-fta-theme] select,
  :root[data-fta-theme] textarea {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
  }

  /* LIGHT — warm paper */
  :root[data-fta-theme="light"] {
    --bg:#FBF7EF;          /* paper */
    --panel:#FFFFFF;       /* card */
    --line:#EAE2D0;        /* sand */
    --line-soft:#F1EADB;
    --text:#101828;        /* ink */
    --text-dim:#5B6472;    /* soft */
    --text-dimmer:#98A2B3;
    --amber:#B45309;       /* gold-700 — accessible accent on paper */
    --amber-dim:#FEF3C7;   /* chip-amber */
    --blue:#2563EB;
    --violet:#7C3AED;
    --teal:#0E9E92;
  }
  /* DARK — warm charcoal */
  :root[data-fta-theme="dark"] {
    --bg:#17120B;          /* paper (dark) */
    --panel:#221C14;       /* card (dark) */
    --line:#38322A;        /* sand (dark) */
    --line-soft:#2A251D;
    --text:#F7F2E6;        /* ink (dark) */
    --text-dim:#968D7B;    /* soft (dark) */
    --text-dimmer:#6A6456;
    --amber:#FBBF24;       /* gold-400 */
    --amber-dim:rgba(251,191,36,0.15);
    --blue:#4d9dff;
    --violet:#a78bfa;
    --teal:#3ee6d8;
  }
  /* keep the scripted candle colors token-aligned but semantics intact */
  :root[data-fta-theme] { color-scheme: light dark; }

  /* ── Live Market overlay (added by fta-embed) ── */
  #ftaLive{position:fixed;inset:0;z-index:1400;background:var(--bg);color:var(--text);
    display:none;flex-direction:column;overflow:hidden;}
  #ftaLive.on{display:flex;}
  .ftaLive-head{display:flex;align-items:center;gap:10px;padding:12px 16px;
    border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .ftaLive-head h2{font-size:15px;font-weight:800;margin:0;letter-spacing:.2px;}
  .ftaLive-badge{font-size:10.5px;font-weight:700;text-transform:uppercase;
    letter-spacing:.4px;color:#78350F;background:#FDE68A;padding:3px 8px;border-radius:999px;}
  :root[data-fta-theme="dark"] .ftaLive-badge{color:#FDE68A;background:rgba(251,191,36,.15);}
  .ftaLive-tickers{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;
    border-bottom:1px solid var(--line);}
  .ftaLive-tk{flex:0 0 auto;font-size:12px;font-weight:700;padding:6px 11px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel);color:var(--text-dim);cursor:pointer;
    white-space:nowrap;}
  .ftaLive-tk.on{background:var(--amber-dim);color:var(--amber);border-color:var(--amber);}
  .ftaLive-body{flex:1;min-height:0;display:flex;gap:14px;padding:14px 16px;flex-wrap:wrap;
    overflow:auto;align-content:flex-start;}
  .ftaLive-chartwrap{flex:1 1 380px;min-width:0;}
  .ftaLive-price{font-size:26px;font-weight:800;}
  .ftaLive-chg.up{color:var(--green);} .ftaLive-chg.down{color:var(--red);}
  .ftaLive-canvas{width:100%;height:240px;display:block;border:1px solid var(--line);
    border-radius:10px;background:var(--panel);margin-top:8px;}
  .ftaLive-order{flex:0 0 230px;border:1px solid var(--line);border-radius:12px;
    background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:9px;}
  .ftaLive-order label{font-size:11px;color:var(--text-dim);font-weight:700;text-transform:uppercase;}
  .ftaLive-order input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
    background:var(--bg);color:var(--text);font-size:14px;}
  .ftaLive-btns{display:flex;gap:8px;}
  .ftaLive-btns button{flex:1;padding:9px;border-radius:8px;border:none;font-weight:800;
    font-size:13px;cursor:pointer;color:#fff;}
  .ftaLive-buy{background:var(--green);} .ftaLive-sell{background:var(--red);}
  .ftaLive-pos{font-size:12px;color:var(--text-dim);line-height:1.7;}
  .ftaLive-pos .pnl.up{color:var(--green);} .ftaLive-pos .pnl.down{color:var(--red);}
  .ftaLive-close{margin-top:6px;padding:7px;border-radius:8px;border:1px solid var(--line);
    background:var(--bg);color:var(--text);font-weight:700;font-size:12px;cursor:pointer;width:100%;}
  .ftaLive-note{width:100%;font-size:11px;color:var(--text-dimmer);padding:2px 2px 8px;}
  .ftaMode{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;
    margin-left:8px;vertical-align:middle;}
  .ftaMode button{background:var(--panel);color:var(--text-dim);border:none;font-size:11px;
    font-weight:700;padding:5px 9px;cursor:pointer;}
  .ftaMode button.on{background:var(--amber-dim);color:var(--amber);}
  .ftaLive-x{margin-left:auto;background:none;border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:5px 11px;font-weight:700;cursor:pointer;}
  /* Simbot lesson pages: cross-link back to full platform lesson */
  .fta-fulllesson{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:8px 13px;
    border:1px solid var(--amber);border-radius:9px;color:var(--amber);background:var(--amber-dim);
    font-weight:700;font-size:12.5px;text-decoration:none;}
</style>

<!-- Embed bootstrap: parse ?uid/?theme/?embed BEFORE first paint (no flash),
     expose window.__FTA__ (emitter + config), and keep theme live via postMessage. -->
<script id="fta-embed-boot">
(function(){
  var p = new URLSearchParams(location.search);
  var embed = p.get('embed') === '1' || p.has('uid');
  var uid = p.get('uid') || '';
  var theme = p.get('theme') === 'dark' ? 'dark' : (p.get('theme') === 'light' ? 'light' : null);
  // Apply theme immediately so there is no dark-flash before the platform paints.
  if (theme) document.documentElement.setAttribute('data-fta-theme', theme);
  function emit(event, payload){
    var msg = { type:'fta-simbot', v:1, event:event, payload:payload||{}, ts:Date.now() };
    try{ window.__ftaSimbotLog = window.__ftaSimbotLog || []; window.__ftaSimbotLog.push(msg); }catch(e){}
    try{ if(window.parent && window.parent!==window) window.parent.postMessage(msg,'*'); }catch(e){}
    return msg;
  }
  window.__FTA__ = {
    embed: embed,
    uid: uid,
    // deep-link base for "Read the full lesson" cross-links (parent origin)
    platformOrigin: p.get('origin') || '',
    emit: emit
  };
  // Live theme updates from the host app.
  window.addEventListener('message', function(e){
    var d = e.data;
    if(d && d.type === 'fta-theme' && (d.theme === 'light' || d.theme === 'dark')){
      document.documentElement.setAttribute('data-fta-theme', d.theme);
    }
  });
  // Tell the host we mounted (host may reply with the current theme).
  try{ if(window.parent && window.parent!==window) window.parent.postMessage({type:'fta-simbot',v:1,event:'ready',payload:{},ts:Date.now()},'*'); }catch(e){}
})();
</script>
