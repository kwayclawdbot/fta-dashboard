/* ---------------- ZOOM / PAN (TradingView-style) ---------------- */
const DEFAULT_VISIBLE_BARS = 150;
const RIGHT_MARGIN_BARS = 80; // blank space you can scroll/pan/zoom into past the most recent candle
function ensureView(len){
  const maxEnd = len + RIGHT_MARGIN_BARS;
  if(!STATE.view || STATE.view.end>maxEnd || STATE.view.start<0 || (STATE.view.end-STATE.view.start)<5 || (STATE.view.end-STATE.view.start)>maxEnd){
    const end = len;
    const start = Math.max(0, len - DEFAULT_VISIBLE_BARS);
    STATE.view = {start, end};
  }
  return STATE.view;
}
function chartGeometry(canvas){
  const rect = canvas.getBoundingClientRect();
  const marginL=8, marginR=64, marginT=10, marginB=22;
  return {rect, marginL, marginR, marginT, marginB, chartW: Math.max(1, rect.width-marginL-marginR), chartH: Math.max(1, rect.height-marginT-marginB)};
}
function panViewBy(dxCandles, candlesLen){
  const view = ensureView(candlesLen);
  const maxEnd = candlesLen + RIGHT_MARGIN_BARS;
  let newStart = view.start - dxCandles;
  let newEnd = view.end - dxCandles;
  if(newStart<0){ newEnd -= newStart; newStart=0; }
  if(newEnd>maxEnd){ newStart -= (newEnd-maxEnd); newEnd=maxEnd; }
  newStart = Math.max(0,newStart);
  STATE.view = {start:newStart, end:Math.min(maxEnd,newEnd)};
}
function zoomViewAt(frac, zoomFactor, candlesLen){
  const view = ensureView(candlesLen);
  const maxEnd = candlesLen + RIGHT_MARGIN_BARS;
  const range = view.end - view.start;
  const centerIdx = view.start + frac*range;
  let newRange = Math.max(8, Math.min(maxEnd, range*zoomFactor));
  let newStart = centerIdx - frac*newRange;
  let newEnd = newStart + newRange;
  if(newStart<0){ newStart=0; newEnd=newRange; }
  if(newEnd>maxEnd){ newEnd=maxEnd; newStart=Math.max(0,newEnd-newRange); }
  STATE.view = {start:newStart, end:newEnd};
}
function isOverPriceAxis(clientX, canvas){
  const {rect, marginL, chartW} = chartGeometry(canvas);
  return (clientX - rect.left) > marginL + chartW;
}
function isOverTimeAxis(clientX, clientY, canvas){
  if(canvas.id!=='chartCanvas') return false; // only the main chart draws a time axis strip
  const {rect, marginL, chartW, marginT, chartH} = chartGeometry(canvas);
  const x = clientX - rect.left, y = clientY - rect.top;
  return y > marginT + chartH && x >= marginL && x <= marginL + chartW;
}
function applyPriceScale(factor){
  STATE.priceScale = Math.max(0.12, Math.min(8, (STATE.priceScale||1) * factor));
}
/* A mouse wheel reports deltas in lines, a trackpad in pixels, and a few devices
   in pages. Normalise them or the same gesture zooms wildly differently. */
function wheelDelta(e){
  const k = e.deltaMode===1 ? 16 : e.deltaMode===2 ? 100 : 1;
  return {dx: e.deltaX*k, dy: e.deltaY*k};
}
function onChartWheel(e){
  e.preventDefault();
  const candles = getCandles(STATE.symbol, STATE.tf);
  const canvas = e.currentTarget;
  const {rect, marginL, chartW} = chartGeometry(canvas);
  const {dx, dy} = wheelDelta(e);
  // scrolling over the price axis (right margin) zooms the price scale — the "side zoom"
  if(isOverPriceAxis(e.clientX, canvas)){
    applyPriceScale(Math.exp(Math.max(-0.35, Math.min(0.35, dy*0.0018))));
    requestRedraw();
    return;
  }
  // trackpad two-finger horizontal swipe pans the chart, just like TradingView
  if(Math.abs(dx) > Math.abs(dy)*1.2){
    const view = ensureView(candles.length);
    const range = view.end - view.start;
    panViewBy(-(dx/chartW)*range, candles.length);
    requestRedraw();
    return;
  }
  const mouseX = e.clientX - rect.left;
  const frac = Math.min(1,Math.max(0,(mouseX-marginL)/chartW));
  // clamp per-event zoom: a fast trackpad flick sends huge deltas and would
  // otherwise teleport the chart instead of gliding
  zoomViewAt(frac, Math.exp(Math.max(-0.35, Math.min(0.35, dy*0.0018))), candles.length);
  requestRedraw();
}

function onPointerDown(e){
  const canvas = e.currentTarget;
  // replay "select bar": the whole chart is a picker until you choose one
  if(canvas.id==='chartCanvas' && STATE.replay.active && STATE.replay.selecting){
    startReplayAt(frameXToIdx(e.clientX, canvas));
    STATE.suppressNextClick = true;
    return;
  }
  // grabbing a position's target/stop/entry/edge beats every other interaction,
  // whatever tool happens to be selected
  if(canvas.id==='chartCanvas' && !STATE.drawLock){
    const posHit = findPositionHandle(e.clientX, e.clientY, canvas);
    if(posHit){
      pushUndo();
      STATE.posDrag = posHit;
      freezeScale();
      try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
      canvas.style.cursor = (posHit.kind==='right'||posHit.kind==='rleft') ? 'ew-resize' : (posHit.kind==='rmid' ? 'move' : 'ns-resize');
      return;
    }
  }
  if(canvas.id==='chartCanvas' && STATE.tool && STATE.tool!=='cursor'){
    handleDrawPointerDown(e);
    return;
  }
  if(canvas.id==='chartCanvas' && STATE.tool==='cursor'){
    // click a drawing to select it — colour + delete live in the popup toolbar
    const rct = canvas.getBoundingClientRect();
    const hx = e.clientX-rct.left, hy = e.clientY-rct.top;
    let picked = null;
    for(let i=DRAW_HITS.length-1;i>=0;i--){ if(DRAW_HITS[i].test(hx,hy)){ picked = DRAW_HITS[i]; break; } }
    if(picked){
      if(!STATE.drawLock){
        selectDrawing(picked.d);
        beginDrawingDrag(picked, canvas, e);
        return;
      }
    } else if(STATE.selectedDrawing){
      selectDrawing(null);
    }
    const lineHit = findTradeLineHit(e.clientX, e.clientY, canvas);
    if(lineHit){
      STATE.lineDrag = lineHit;
      freezeScale();
      try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
      canvas.style.cursor = 'ns-resize';
      return;
    }
  }
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(activePointers.size===1){
    if(isOverPriceAxis(e.clientX, canvas)){
      STATE.dragging = true;
      STATE.dragMode = 'priceScale';
      STATE.dragStartY = e.clientY;
      STATE.dragStartPriceScale = STATE.priceScale || 1;
      canvas.style.cursor = 'ns-resize';
    } else if(isOverTimeAxis(e.clientX, e.clientY, canvas)){
      const candles = getCandles(STATE.symbol, STATE.tf);
      const view = ensureView(candles.length);
      STATE.dragging = true;
      STATE.dragMode = 'timeScale';
      STATE.dragStartX = e.clientX;
      STATE.dragStartTimeRange = view.end - view.start;
      STATE.dragStartTimeCenter = (view.start + view.end) / 2;
      canvas.style.cursor = 'ew-resize';
    } else {
      STATE.dragging = true;
      STATE.dragMode = 'pan';
      STATE.dragStartX = e.clientX;
      STATE.dragStartY = e.clientY;
      STATE.dragStartPriceOffsetFrac = STATE.priceOffsetFrac || 0;
      const candles = getCandles(STATE.symbol, STATE.tf);
      STATE.dragStartView = {...ensureView(candles.length)};
      canvas.style.cursor = 'grabbing';
    }
  } else if(activePointers.size===2){
    STATE.dragging = false;
    STATE.dragMode = null;
    const pts = [...activePointers.values()];
    pinchStartDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1;
    const candles = getCandles(STATE.symbol, STATE.tf);
    pinchStartView = {...ensureView(candles.length)};
  }
}
function onPointerMove(e){
  const canvas = e.currentTarget;
  if(STATE.drawDrag){ moveDrawingDrag(e); return; }
  if(STATE.posDrag){
    handlePositionDragMove(e);
    return;
  }
  if(STATE.lineDrag){
    handleLineDragMove(e);
    return;
  }
  if(canvas.id==='chartCanvas' && STATE.tool && STATE.tool!=='cursor'){
    handleDrawPointerMove(e);
    return;
  }
  if(!activePointers.has(e.pointerId)){
    // no button/finger down on this canvas — just update the crosshair (and show the resize cursor over the price axis)
    if(activePointers.size===0){
      const isCursorTool = canvas.id==='chartCanvas' && STATE.tool==='cursor';
      const overPos = canvas.id==='chartCanvas' && findPositionHandle(e.clientX, e.clientY, canvas);
      if(isCursorTool && !overPos && DRAW_HITS.length){
        const rr = canvas.getBoundingClientRect();
        const mx = e.clientX-rr.left, my = e.clientY-rr.top;
        const over = DRAW_HITS.some(hh=> hh.test(mx,my));
        if(over){ canvas.style.cursor = 'move'; return; }
      }
      const overLine = isCursorTool && !overPos && findTradeLineHit(e.clientX, e.clientY, canvas);
      canvas.style.cursor = overPos ? ((overPos.kind==='right'||overPos.kind==='rleft') ? 'ew-resize' : (overPos.kind==='rmid' ? 'move' : 'ns-resize'))
        : overLine ? 'ns-resize'
        : (isOverPriceAxis(e.clientX, canvas) ? 'ns-resize' : (isOverTimeAxis(e.clientX, e.clientY, canvas) ? 'ew-resize' : 'crosshair'));
    }
    onChartHover(e);
    return;
  }
  activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const candles = getCandles(STATE.symbol, STATE.tf);
  const maxEnd = candles.length + RIGHT_MARGIN_BARS;
  if(activePointers.size===2 && pinchStartDist){
    const pts = [...activePointers.values()];
    const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1;
    const scale = pinchStartDist/dist; // fingers spreading apart -> scale<1 -> zoom in
    const range0 = pinchStartView.end - pinchStartView.start;
    const midX = (pts[0].x+pts[1].x)/2;
    const {rect, marginL, chartW} = chartGeometry(canvas);
    const frac = Math.min(1,Math.max(0,(midX-rect.left-marginL)/chartW));
    const centerIdx = pinchStartView.start + frac*range0;
    let newRange = Math.max(8, Math.min(maxEnd, range0*scale));
    let newStart = centerIdx - frac*newRange;
    let newEnd = newStart + newRange;
    if(newStart<0){ newStart=0; newEnd=newRange; }
    if(newEnd>maxEnd){ newEnd=maxEnd; newStart=Math.max(0,newEnd-newRange); }
    STATE.view = {start:newStart, end:newEnd};
    requestRedraw();
    return;
  }
  if(STATE.dragging && activePointers.size===1 && STATE.dragMode==='priceScale'){
    const dy = e.clientY - STATE.dragStartY;
    STATE.priceScale = Math.max(0.12, Math.min(8, STATE.dragStartPriceScale * Math.exp(dy/160)));
    requestRedraw();
    return;
  }
  if(STATE.dragging && activePointers.size===1 && STATE.dragMode==='timeScale'){
    const dx = e.clientX - STATE.dragStartX;
    // dragging right stretches the axis apart (scrunches more bars into view, zoom out);
    // dragging left pulls it in (zoom in) — same feel as the price-axis drag above.
    const newRange = Math.max(8, Math.min(maxEnd, STATE.dragStartTimeRange * Math.exp(dx/160)));
    let newStart = STATE.dragStartTimeCenter - newRange/2;
    let newEnd = STATE.dragStartTimeCenter + newRange/2;
    if(newStart<0){ newEnd -= newStart; newStart=0; }
    if(newEnd>maxEnd){ newStart -= (newEnd-maxEnd); newEnd=maxEnd; }
    newStart = Math.max(0,newStart);
    STATE.view = {start:newStart, end:Math.min(maxEnd,newEnd)};
    requestRedraw();
    return;
  }
  if(STATE.dragging && activePointers.size===1 && STATE.dragMode==='pan'){
    const {chartW, chartH} = chartGeometry(canvas);
    const range = STATE.dragStartView.end - STATE.dragStartView.start;
    const dxCandles = ((e.clientX - STATE.dragStartX)/chartW) * range;
    const view0 = STATE.dragStartView;
    let newStart = view0.start - dxCandles;
    let newEnd = view0.end - dxCandles;
    if(newStart<0){ newEnd -= newStart; newStart=0; }
    if(newEnd>maxEnd){ newStart -= (newEnd-maxEnd); newEnd=maxEnd; }
    newStart = Math.max(0,newStart);
    STATE.view = {start:newStart, end:newEnd};
    // vertical component of the same drag pans the price window up/down
    const dyFrac = (e.clientY - STATE.dragStartY)/chartH;
    STATE.priceOffsetFrac = Math.max(-10, Math.min(10, STATE.dragStartPriceOffsetFrac + dyFrac));
    requestRedraw();
  }
}
function onPointerUp(e){
  const canvas = e.currentTarget;
  if(STATE.drawDrag){ endDrawingDrag(canvas, e); return; }
  if(STATE.posDrag){
    STATE.posDrag = null;
    STATE.suppressNextClick = true;
    thawScale();
    touchDrawings();
    try{ canvas.releasePointerCapture(e.pointerId); }catch(err){}
    canvas.style.cursor = 'crosshair';
    drawMainChart();
    return;
  }
  if(STATE.lineDrag){
    handleLineDragUp(e);
    return;
  }
  if(canvas.id==='chartCanvas' && STATE.drawPlacing){
    handleDrawPointerUp(e);
    return;
  }
  activePointers.delete(e.pointerId);
  try{ canvas.releasePointerCapture(e.pointerId); }catch(err){}
  pinchStartDist = null; pinchStartView = null;
  if(activePointers.size===0){
    STATE.dragging = false;
    STATE.dragMode = null;
    canvas.style.cursor = isOverPriceAxis(e.clientX, canvas) ? 'ns-resize' : (isOverTimeAxis(e.clientX, e.clientY, canvas) ? 'ew-resize' : 'crosshair');
  } else if(activePointers.size===1){
    // eased from a pinch back down to one finger — resume as a pan from here
    const [[,pt]] = activePointers;
    STATE.dragging = true;
    STATE.dragMode = 'pan';
    STATE.dragStartX = pt.x;
    const candles = getCandles(STATE.symbol, STATE.tf);
    STATE.dragStartView = {...ensureView(candles.length)};
  }
}


function onChartHover(e){
  if(STATE.dragging) return;
  const canvas = document.getElementById('chartCanvas');
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  let candles = getCandles(STATE.symbol, STATE.tf);
  if(STATE.replay.active && STATE.replay.idx!=null) candles = candles.slice(0, STATE.replay.idx+1);
  const view = ensureView(candles.length);
  const marginR = 64, marginL = 8;
  const chartW = rect.width - marginL - marginR;
  const range = view.end - view.start;
  const barW = chartW/range;
  let idx = Math.floor(view.start + (x-marginL)/barW);
  idx = Math.max(0, Math.min(candles.length-1, idx));
  STATE.chartHoverIdx = idx;
  STATE.hoverOnCandle = isCursorOnCandle(x, y, idx, candles);
  requestRedraw();
}

/* true only when the pointer is actually touching the candle it's nearest to —
   inside the body, or on the thin wick — not just floating somewhere in its column */
function isCursorOnCandle(x, y, idx, candles){
  const F = CHART_FRAME;
  const c = candles[idx];
  if(!F || !c || !(F.hi > F.lo)) return false;
  const yAt = v => F.marginT + F.chartH - ((v - F.lo)/(F.hi - F.lo))*F.chartH;
  const barW = F.chartW/(F.viewEnd - F.viewStart);
  const cx = F.marginL + (idx - F.viewStart + 0.5)*barW;
  if(STATE.chartType==='line' || STATE.chartType==='area'){
    return Math.abs(x - cx) <= Math.max(3, barW/2) && Math.abs(y - yAt(c.c)) <= 8;
  }
  const halfBody = Math.max(1.5, (F.bodyW||3)/2);
  const bodyTop = Math.min(yAt(c.o), yAt(c.c));
  const bodyBot = Math.max(yAt(c.o), yAt(c.c));
  const onBody = Math.abs(x - cx) <= halfBody + 1.5 && y >= bodyTop - 1.5 && y <= bodyBot + 1.5;
  const onWick = Math.abs(x - cx) <= 3 && y >= yAt(c.h) - 2 && y <= yAt(c.l) + 2;
  return onBody || onWick;
}

// the indicator subpanel (volume / RSI / MACD / stochastic / ATR) was removed —
// this stays as a no-op so existing redraw calls keep working.
function drawSubpanel(){}

/* ---------------- MULTI-CHART LAYOUTS ----------------
   Layouts 2/3/4 put real, live, interactive charts beside the main one. Each pane
   has its own symbol, timeframe, zoom/pan and hover explainer, and any pane can be
   promoted into the main window (where drawings and the order ticket live). */
function defaultPaneSym(i){
  const others = SYMBOLS.filter(s=> s.t!==STATE.symbol);
  return others[(i*29) % others.length].t;
}
function applyLayout(n){
  STATE.layout = n;
  while(STATE.panes.length < n-1){
    STATE.panes.push({symbol: defaultPaneSym(STATE.panes.length), tf: STATE.tf, view:null, hoverIdx:null, hoverOn:false, frame:null});
  }
  STATE.panes.length = Math.max(0, n-1);
  buildPanes();
  drawMainChart();
  drawPanes();
}
function buildPanes(){
  const grid = document.getElementById('chartGrid');
  if(!grid) return;
  grid.className = 'chart-grid layout-'+STATE.layout;
  grid.querySelectorAll('.mini-pane').forEach(el=> el.remove());
  STATE.panes.forEach((pane, i)=>{
    const wrap = document.createElement('div');
    wrap.className = 'mini-pane';
    wrap.dataset.pane = i;
    const symOpts = CATS.map(cat=> `<optgroup label="${cat}">`+
      SYMBOLS.filter(x=>x.cat===cat).map(x=>`<option value="${x.t}" ${x.t===pane.symbol?'selected':''}>${x.t}</option>`).join('')+
      `</optgroup>`).join('');
    const tfOpts = TIMEFRAMES.map(t=>`<option value="${t.k}" ${t.k===pane.tf?'selected':''}>${t.label}</option>`).join('');
    wrap.innerHTML = `
      <div class="mp-head">
        <select class="mp-sym" data-tip="Pick what this chart is showing — all ${SYMBOLS.length} instruments are here too.">${symOpts}</select>
        <select class="mp-tf" data-tip="Timeframe for this chart only. The main chart keeps its own.">${tfOpts}</select>
        <span class="mp-chg"></span>
        <button class="mp-main-btn" data-tip="Swap this chart into the main window so you can draw on it and trade it.">MAKE MAIN</button>
      </div>
      <div class="mp-body">
        <canvas></canvas>
        <div class="chart-crosshair-label mp-label"></div>
      </div>
    `;
    grid.appendChild(wrap);
    wrap.querySelector('.mp-sym').onchange = (e)=>{ pane.symbol = e.target.value; pane.view=null; drawPanes(); };
    wrap.querySelector('.mp-tf').onchange = (e)=>{ pane.tf = e.target.value; pane.view=null; drawPanes(); };
    wrap.querySelector('.mp-main-btn').onclick = ()=>{
      const oldSym = STATE.symbol, oldTf = STATE.tf;
      STATE.symbol = pane.symbol; STATE.tf = pane.tf;
      pane.symbol = oldSym; pane.tf = oldTf; pane.view = null;
      STATE.view = null; STATE.priceScale = 1; STATE.priceOffsetFrac = 0;
      buildPanes(); refreshAll(); drawPanes();
      toast('LAYOUT', STATE.symbol+' is now the main chart — drawings and the order ticket follow it.', 'buy');
    };
    wirePaneInteraction(wrap.querySelector('canvas'), pane, wrap);
  });
}

/* each pane zooms, pans and explains candles just like the main chart */
function wirePaneInteraction(canvas, pane, wrap){
  const label = wrap.querySelector('.mp-label');
  let dragging = false, lastX = 0;
  const paneView = ()=>{
    const len = getCandles(pane.symbol, pane.tf).length;
    if(!pane.view || pane.view.end>len+RIGHT_MARGIN_BARS || pane.view.start<0 || (pane.view.end-pane.view.start)<5){
      pane.view = {start: Math.max(0, len-70), end: len};
    }
    return pane.view;
  };
  canvas.addEventListener('wheel', (e)=>{
    e.preventDefault();
    const len = getCandles(pane.symbol, pane.tf).length;
    const v = paneView();
    const rect = canvas.getBoundingClientRect();
    const frac = Math.max(0, Math.min(1, (e.clientX-rect.left-6)/Math.max(1, rect.width-58)));
    const range = v.end - v.start;
    const factor = e.deltaY > 0 ? 1.15 : 1/1.15;
    let newRange = Math.max(10, Math.min(len+RIGHT_MARGIN_BARS, range*factor));
    const center = v.start + frac*range;
    let start = center - frac*newRange, end = start + newRange;
    if(start < 0){ start = 0; end = newRange; }
    if(end > len+RIGHT_MARGIN_BARS){ end = len+RIGHT_MARGIN_BARS; start = Math.max(0, end-newRange); }
    pane.view = {start, end};
    requestPaneRedraw();
  }, {passive:false});
  canvas.addEventListener('pointerdown', (e)=>{
    dragging = true; lastX = e.clientX;
    canvas.setPointerCapture(e.pointerId);
    canvas.style.cursor = 'grabbing';
  });
  canvas.addEventListener('pointermove', (e)=>{
    const rect = canvas.getBoundingClientRect();
    if(dragging){
      const v = paneView();
      const range = v.end - v.start;
      const barW = Math.max(0.5, (rect.width-58)/range);
      const dx = (e.clientX - lastX)/barW;
      lastX = e.clientX;
      const len = getCandles(pane.symbol, pane.tf).length;
      let start = v.start - dx, end = v.end - dx;
      if(start < 0){ end -= start; start = 0; }
      if(end > len+RIGHT_MARGIN_BARS){ start -= (end-(len+RIGHT_MARGIN_BARS)); end = len+RIGHT_MARGIN_BARS; }
      pane.view = {start: Math.max(0,start), end};
      label.style.display='none';
      requestPaneRedraw();
      return;
    }
    const x = e.clientX-rect.left, y = e.clientY-rect.top;
    const F = pane.frame;
    if(!F){ return; }
    const candles = getCandles(pane.symbol, pane.tf);
    const barW = F.chartW/(F.viewEnd-F.viewStart);
    let idx = Math.floor(F.viewStart + (x-F.marginL)/barW);
    idx = Math.max(0, Math.min(candles.length-1, idx));
    const c = candles[idx];
    const yAt = v=> F.marginT + F.chartH - ((v-F.lo)/(F.hi-F.lo))*F.chartH;
    const cx = F.marginL + (idx-F.viewStart+0.5)*barW;
    const halfBody = Math.max(1.5, F.bodyW/2);
    const bodyTop = Math.min(yAt(c.o), yAt(c.c)), bodyBot = Math.max(yAt(c.o), yAt(c.c));
    const onBody = Math.abs(x-cx) <= halfBody+1.5 && y >= bodyTop-1.5 && y <= bodyBot+1.5;
    const onWick = Math.abs(x-cx) <= 3 && y >= yAt(c.h)-2 && y <= yAt(c.l)+2;
    const on = onBody || onWick;
    pane.hoverIdx = idx; pane.hoverOn = on;
    if(on){
      const saveTf = STATE.tf; STATE.tf = pane.tf;           // explainer speaks in the pane's timeframe
      label.innerHTML = candleExplainer(c, idx, candles, SYM_MAP[pane.symbol]);
      STATE.tf = saveTf;
      label.style.display = 'block';
      label.style.left = Math.min(Math.max(x+14, 4), Math.max(4, rect.width-244))+'px';
      label.style.top = Math.min(Math.max(y-30, 4), Math.max(4, rect.height-180))+'px';
    } else {
      label.style.display = 'none';
    }
    requestPaneRedraw();
  });
  const stop = (e)=>{ dragging=false; canvas.style.cursor='crosshair'; try{canvas.releasePointerCapture(e.pointerId);}catch(_){} };
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointercancel', stop);
  canvas.addEventListener('pointerleave', ()=>{ pane.hoverIdx=null; pane.hoverOn=false; label.style.display='none'; requestPaneRedraw(); });
  canvas.addEventListener('dblclick', ()=>{ pane.view=null; requestPaneRedraw(); });
  canvas.style.cursor='crosshair';
}

let _panesQueued = false;
function requestPaneRedraw(){
  if(_panesQueued) return;
  _panesQueued = true;
  (window.requestAnimationFrame || ((f)=>setTimeout(f,16)))(()=>{ _panesQueued=false; drawPanes(); });
}
function drawPanes(){
  document.querySelectorAll('.mini-pane').forEach(wrap=>{
    const pane = STATE.panes[parseInt(wrap.dataset.pane)];
    if(!pane) return;
    drawPaneChart(wrap.querySelector('canvas'), pane);
    const chg = pctChange(pane.symbol);
    const chgEl = wrap.querySelector('.mp-chg');
    chgEl.textContent = fmtPrice(livePrice[pane.symbol], SYM_MAP[pane.symbol].dec)+'  '+pctStr(chg);
    chgEl.style.color = chg>=0 ? THEME.up : THEME.down;
  });
}

function drawPaneChart(canvas, pane){
  if(!canvas) return;
  const {ctx, w, h} = sizeCanvas(canvas);
  ctx.clearRect(0,0,w,h);
  const sym = SYM_MAP[pane.symbol];
  const candles = getCandles(pane.symbol, pane.tf);
  const marginR = 52, marginL = 6, marginT = 8, marginB = 16;
  const chartW = w-marginL-marginR, chartH = h-marginT-marginB;
  if(chartW<=0 || chartH<=0) return;

  if(!pane.view || pane.view.end>candles.length+RIGHT_MARGIN_BARS || pane.view.start<0 || (pane.view.end-pane.view.start)<5){
    pane.view = {start: Math.max(0, candles.length-70), end: candles.length};
  }
  const viewStart = pane.view.start, viewEnd = pane.view.end;
  const visLo = Math.max(0, Math.floor(viewStart)), visHi = Math.min(candles.length-1, Math.ceil(viewEnd));
  let lo=Infinity, hi=-Infinity;
  for(let i=visLo;i<=visHi;i++){ lo=Math.min(lo,candles[i].l); hi=Math.max(hi,candles[i].h); }
  if(!(hi>lo)){ hi=lo*1.001; lo=lo*0.999; }
  const pad=(hi-lo)*0.08; lo-=pad; hi+=pad;
  const yAt = v=> marginT + chartH - ((v-lo)/(hi-lo))*chartH;
  const xAt = i=> marginL + (i-viewStart+0.5)*(chartW/(viewEnd-viewStart));
  const bodyW = Math.max(1.2, (chartW/(viewEnd-viewStart))*0.62);
  pane.frame = {marginL, marginT, chartW, chartH, viewStart, viewEnd, lo, hi, bodyW};

  ctx.font='9px IBM Plex Mono, monospace'; ctx.textBaseline='middle';
  ctx.strokeStyle='rgba(255,255,255,0.045)'; ctx.lineWidth=1;
  for(let g=0; g<=3; g++){
    const y = marginT + (chartH/3)*g;
    ctx.beginPath(); ctx.moveTo(marginL,y); ctx.lineTo(marginL+chartW,y); ctx.stroke();
    ctx.fillStyle='#4b5361'; ctx.textAlign='left';
    ctx.fillText(fmtPrice(hi-((hi-lo)/3)*g, sym.dec), marginL+chartW+5, y);
  }
  // watermark
  ctx.fillStyle='rgba(255,255,255,0.07)'; ctx.font='bold 15px IBM Plex Mono, monospace';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(pane.symbol+' · '+pane.tf, marginL+6, marginT+4);
  ctx.textBaseline='middle'; ctx.font='9px IBM Plex Mono, monospace';

  ctx.save();
  ctx.beginPath(); ctx.rect(marginL, marginT, chartW, chartH); ctx.clip();
  for(let i=visLo;i<=visHi;i++){
    const c = candles[i], up = c.c>=c.o, x = xAt(i);
    ctx.strokeStyle = wickColor(up);
    ctx.beginPath(); ctx.moveTo(x, yAt(c.h)); ctx.lineTo(x, yAt(c.l)); ctx.stroke();
    const yo=yAt(c.o), yc=yAt(c.c);
    const top=Math.min(yo,yc), bh=Math.max(1, Math.abs(yc-yo));
    ctx.fillStyle = ctx.strokeStyle = up?upColor():downColor();
    ctx.fillRect(x-bodyW/2, top, bodyW, bh);
  }
  // hover crosshair
  if(pane.hoverIdx!=null && candles[pane.hoverIdx]){
    const x = xAt(pane.hoverIdx);
    ctx.setLineDash([2,3]); ctx.strokeStyle='rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.moveTo(x,marginT); ctx.lineTo(x,marginT+chartH); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();

  // time axis
  ctx.fillStyle='#4b5361'; ctx.textAlign='center'; ctx.textBaseline='top';
  const step = Math.max(1, Math.round((viewEnd-viewStart)/5));
  for(let i=Math.ceil(visLo/step)*step; i<=visHi; i+=step){
    ctx.fillText(dateLabel(candles[i].t, pane.tf), xAt(i), marginT+chartH+3);
  }
  ctx.textBaseline='middle';

  // last price
  const last = candles[candles.length-1];
  const up = last.c >= last.o;
  const ly = yAt(livePrice[pane.symbol] ?? last.c);
  if(ly>marginT && ly<marginT+chartH){
    ctx.setLineDash([2,3]); ctx.strokeStyle = up?upColor():downColor();
    ctx.beginPath(); ctx.moveTo(marginL,ly); ctx.lineTo(marginL+chartW,ly); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = up?upColor():downColor();
    ctx.fillRect(marginL+chartW, ly-7, marginR, 14);
    ctx.fillStyle='#08090b'; ctx.textAlign='left';
    ctx.fillText(fmtPrice(livePrice[pane.symbol] ?? last.c, sym.dec), marginL+chartW+4, ly);
  }
}

/* ---------------- CANDLE HOVER EXPLAINER ----------------
   Hovering a candle should teach, not just dump numbers. */
function candleExplainer(c, i, candles, sym){
  const up = c.c >= c.o;
  const tfLbl = TIMEFRAMES.find(t=>t.k===STATE.tf).label;
  const isLast = i === candles.length-1;
  const chg = ((c.c-c.o)/c.o)*100;
  const body = Math.abs(c.c-c.o);
  const range = Math.max(c.h-c.l, 1e-12);
  const bodyPct = body/range;
  const upWick = c.h - Math.max(c.o,c.c);
  const dnWick = Math.min(c.o,c.c) - c.l;
  const col = up ? THEME.up : THEME.down;

  let note;
  if(bodyPct < 0.18){
    note = `Tiny body, long wicks — buyers and sellers fought to a draw and price ended about where it started. Indecision.`;
  } else if(bodyPct > 0.75){
    note = up ? `Almost all body, barely any wick — buyers were in control from open to close. Strong ${tfLbl} candle.`
              : `Almost all body, barely any wick — sellers were in control from open to close. Strong ${tfLbl} candle.`;
  } else if(dnWick > body*1.6 && up){
    note = `Long lower wick: price got pushed down, then buyers stepped in and dragged it back up before the close.`;
  } else if(upWick > body*1.6 && !up){
    note = `Long upper wick: price pushed up, then sellers slapped it back down before the close. Buyers tried and failed.`;
  } else {
    note = up ? `Closed above where it opened, so buyers won this ${tfLbl}. The wicks are the highest and lowest prices reached along the way.`
              : `Closed below where it opened, so sellers won this ${tfLbl}. The wicks are the highest and lowest prices reached along the way.`;
  }
  if(isLast) note = `This candle is still open — it keeps moving until the countdown hits zero, then it locks in. ` + note;

  const when = new Date(c.t).toLocaleString('en-US',{hour12:false, month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
  return `
    <div class="cl-head">
      <b>${tfLbl} candle</b>
      <span class="cl-pill" style="background:${hexToRgba(col,0.16)};color:${col};">${up?'BULLISH':'BEARISH'} ${pctStr(chg)}</span>
    </div>

/* ---------------- ACCOUNT / POSITIONS / ORDERS / HISTORY ---------------- */
function unrealizedPnl(pos){
  const price = livePrice[pos.symbol];
  return pos.side==='long' ? pos.qty*(price-pos.entryPrice) : pos.qty*(pos.entryPrice-price);
}
function positionValue(pos){
  return pos.qty*pos.entryPrice + unrealizedPnl(pos);
}
function computeStats(){
  const closedTrades = ACCOUNT.history.filter(h=>h.pnl!=null);
  const wins = closedTrades.filter(h=>h.pnl>0).length;
  const winRate = closedTrades.length ? (wins/closedTrades.length*100) : 0;
  const realized = closedTrades.reduce((a,h)=>a+h.pnl,0);
  const unrealized = ACCOUNT.positions.reduce((a,p)=>a+unrealizedPnl(p),0);
  const marginUsed = ACCOUNT.positions.reduce((a,p)=>a+p.qty*p.entryPrice,0);
  const equity = ACCOUNT.balance + ACCOUNT.positions.reduce((a,p)=>a+positionValue(p),0);
  const marginPct = equity>0 ? (marginUsed/equity*100) : 0;
  return {winRate, wins, realized, unrealized, dayPnl: realized+unrealized,
          marginPct, marginUsed, equity, closedCount:closedTrades.length};
}
function renderAccountStrip(){
  const st = computeStats();
  const cells = [
    ['ACCOUNT BALANCE ✎', fmtMoney(ACCOUNT.balance), 'edit', 'Cash not tied up in a trade. Opening a position moves money out of here. Click to change your balance.'],
    ['EQUITY', fmtMoney(st.equity), '', 'What the account is worth right now: your cash plus everything your open trades are currently worth. This is the number that matters.'],
    ['REALIZED P&L', fmtMoney(st.realized, true), st.realized>=0?'up':'down', 'Profit and loss you have actually banked by closing trades. Locked in — it cannot change.'],
    ['UNREALIZED P&L', fmtMoney(st.unrealized, true), st.unrealized>=0?'up':'down', 'Profit and loss on trades still open. It is not yours until you close — it can vanish.'],
    ['BUYING POWER ✎', fmtMoney(ACCOUNT.balance), 'edit', 'How much you can still put into new trades. Money tied up in open positions is not counted here. Click to change your balance.'],
    ['IN POSITIONS', fmtMoney(st.marginUsed), '', 'Money currently committed to open trades.'],
    ['WIN RATE', st.closedCount? st.winRate.toFixed(1)+'%' : '—', '', st.closedCount? `${st.wins} winners out of ${st.closedCount} closed trades. A high win rate means nothing if the losers are bigger than the winners.` : 'Shows up once you have closed your first trade.'],
    ['TRADES CLOSED', String(st.closedCount), '', 'How many round trips you have finished.'],
  ];
  const el = document.getElementById('bpMetrics');
  if(el){
    el.innerHTML = cells.map(([l,v,cls,tip])=>
      `<div class="bp-cell ${cls==='edit'?'clickable':''}" ${cls==='edit'?'data-edit-bal="1"':''} data-tip-title="${l.replace(' ✎','')}" data-tip="${tip.replace(/"/g,'&quot;')}"><div class="bl">${l}</div><div class="bv ${cls==='edit'?'':cls}">${v}</div></div>`
    ).join('');
    el.querySelectorAll('[data-edit-bal]').forEach(c=> c.onclick = openBalanceModal);
  }
  updateTabCounts();
}

function fmtDuration(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  if(s < 60) return s+'s';
  if(s < 3600) return Math.floor(s/60)+'m';
  if(s < 86400) return Math.floor(s/3600)+'h '+Math.floor((s%3600)/60)+'m';
  return Math.floor(s/86400)+'d '+Math.floor((s%86400)/3600)+'h';
}

/* ---------------- P&L CALENDAR ----------------
   Realised P&L per day, month by month. Days you didn't trade stay empty —
   that's the point: you can see your actual footprint. */
function dayKey(ts){
  const d = new Date(ts);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function buildDailyPnl(){
  const map = {}; // dayKey -> {pnl, trades, wins}
  ACCOUNT.history.forEach(h=>{
    if(h.pnl==null) return;
    const k = dayKey(h.time);
    if(!map[k]) map[k] = {pnl:0, trades:0, wins:0};
    map[k].pnl += h.pnl;
    map[k].trades++;
    if(h.pnl>0) map[k].wins++;
  });
  return map;
}
function renderPnlCalendar(){
  const el = document.getElementById('bottomContent');
  const daily = buildDailyPnl();
  if(!STATE.calMonth) STATE.calMonth = new Date(simNow()).toISOString().slice(0,7);
  const [yy, mm] = STATE.calMonth.split('-').map(Number);
  const first = new Date(yy, mm-1, 1);
  const daysInMonth = new Date(yy, mm, 0).getDate();
  const startDow = first.getDay();
  const monthName = first.toLocaleString('en-US',{month:'long', year:'numeric'});

  let mPnl=0, mTrades=0, mWins=0, best=null, worst=null, daysTraded=0;
  for(let d=1; d<=daysInMonth; d++){
    const k = yy+'-'+String(mm).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const e = daily[k];
    if(!e) continue;
    daysTraded++; mPnl+=e.pnl; mTrades+=e.trades; mWins+=e.wins;
    if(best===null || e.pnl>daily[best].pnl) best=k;
    if(worst===null || e.pnl<daily[worst].pnl) worst=k;
  }
  const todayKey = dayKey(simNow());

  const dows = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  let cells = dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<startDow;i++) cells += '<div class="cal-day blank"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const k = yy+'-'+String(mm).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const e = daily[k];
    const cls = e ? (e.pnl>=0?'has win':'has loss') : 'empty';
    cells += `<div class="cal-day ${cls} ${k===todayKey?'today':''}" ${e?`data-day="${k}"`:''}
        ${e?`data-tip="${e.trades} trade${e.trades>1?'s':''} closed · ${e.wins} winner${e.wins===1?'':'s'} · click to see them"`:''}>
      <span class="cd-n">${d}</span>
      ${e?`<span class="cd-p">${fmtMoney(e.pnl,true)}</span><span class="cd-t">${e.trades} trade${e.trades>1?'s':''}</span>`:''}
    </div>`;
  }

  const sum = (l,v,cls)=>`<div class="cs"><span class="csl">${l}</span><span class="csv ${cls||''}">${v}</span></div>`;
  el.innerHTML = `<div class="cal-wrap">
    <div class="cal-head">
      <button class="cal-nav" id="calPrev" data-tip="Previous month">‹</button>
      <span class="cal-title">${monthName}</span>
      <button class="cal-nav" id="calNext" data-tip="Next month">›</button>
      <button class="cal-nav" id="calToday" style="width:auto;padding:0 8px;font-size:9px;font-weight:700;" data-tip="Jump back to this month">TODAY</button>
      <div class="cal-sum">
        ${sum('MONTH P&L', fmtMoney(mPnl,true), mPnl>=0?'up':'down')}
        ${sum('TRADES', String(mTrades))}
        ${sum('WIN RATE', mTrades? (mWins/mTrades*100).toFixed(0)+'%':'—')}
        ${sum('DAYS TRADED', String(daysTraded))}
        ${sum('BEST DAY', best? fmtMoney(daily[best].pnl,true):'—','up')}
        ${sum('WORST DAY', worst? fmtMoney(daily[worst].pnl,true):'—', worst && daily[worst].pnl<0?'down':'')}
      </div>
    </div>
    <div class="cal-grid">${cells}</div>
    ${daysTraded===0 ? `<div class="cal-note">No closed trades in ${monthName}. Every day you close a trade fills in here — green for a profitable day, red for a losing one. Empty squares are days you didn't trade, and there's nothing wrong with those.</div>` : ''}
    <div id="calDayList"></div>
  </div>`;

  const shift = (n)=>{
    const dt = new Date(yy, mm-1+n, 1);
    STATE.calMonth = dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');
    renderPnlCalendar();
  };
  document.getElementById('calPrev').onclick = ()=> shift(-1);
  document.getElementById('calNext').onclick = ()=> shift(1);
  document.getElementById('calToday').onclick = ()=>{ STATE.calMonth = new Date(simNow()).toISOString().slice(0,7); renderPnlCalendar(); };
  el.querySelectorAll('[data-day]').forEach(c=>{
    c.onclick = ()=> renderCalendarDay(c.dataset.day);
  });
  if(STATE.calDay && daily[STATE.calDay]) renderCalendarDay(STATE.calDay, true);
}

  const wrap = document.getElementById('calDayList');

  const total = trades.reduce((a,h)=>a+h.pnl,0);
  const d = new Date(key+'T12:00:00');

    <table class="dt">

        <td class="l muted">${h.reason}</td>
        <td class="${h.pnl>=0?'up':'down'}">${fmtMoney(h.pnl,true)}</td>

/* ---------------- TRADE ENGINE ---------------- */
function openPosition(symbol, side, qty, price, stopLoss, takeProfit){
  const cost = qty*price;
  if(cost > ACCOUNT.balance+1e-6){ toast(symbol,'Insufficient buying power for this order.','sell'); return false; }
  ACCOUNT.balance -= cost;
  ACCOUNT.positions.push({id:posIdSeq++, symbol, side, qty, entryPrice:price, stopLoss:stopLoss||null, takeProfit:takeProfit||null, openTime:simNow()});
  logHistory({symbol, side: side==='long'?'BUY':'SELL', qty, price, pnl:null, type:'OPEN', reason:`Opened ${side}`});
  return true;
}
function closePosition(pos, qty, price, reason){
  qty = Math.min(qty, pos.qty);
  let pnl;
  if(pos.side==='long'){ pnl = qty*(price-pos.entryPrice); ACCOUNT.balance += qty*price; }
  else { pnl = qty*(pos.entryPrice-price); ACCOUNT.balance += qty*pos.entryPrice + pnl; }
  pos.qty -= qty;
  logHistory({symbol:pos.symbol, side: pos.side==='long'?'SELL':'BUY', qty, price, pnl, type:'CLOSE', reason});
  if(pos.qty<=1e-7){ ACCOUNT.positions = ACCOUNT.positions.filter(p=>p!==pos); }
  // Platform XP bridge: first profitable closed trade worth >= 1R (once ever,
  // per platform user). R needs a defined stop; unstopped wins don't qualify.
  if(pnl > 0 && pos.stopLoss && window.__FTA__ && window.__FTA__.emit){
    var _risk = Math.abs(pos.entryPrice - pos.stopLoss) * qty;
    if(_risk > 0 && (pnl / _risk) >= 1){
      var _seenR = false;
      try{ _seenR = localStorage.getItem(ns('ftaFirstR')) === '1'; }catch(e){}
      if(!_seenR){
        try{ localStorage.setItem(ns('ftaFirstR'), '1'); }catch(e){}
        window.__FTA__.emit('first_profitable_r', {
          symbol: pos.symbol, r: Math.round((pnl / _risk) * 100) / 100, pnl: Math.round(pnl * 100) / 100
        });
      }
    }
  }
  return pnl;
}
function executeTrade(symbol, side, qty, price, stopLoss, takeProfit){
  qty = Math.round(qty*1e6)/1e6;
  if(qty<=0) return;
  const pos = ACCOUNT.positions.find(p=>p.symbol===symbol);
  const wantSide = side==='buy' ? 'long':'short';
  if(pos && pos.side!==wantSide){
    if(qty<=pos.qty+1e-9){
      const pnl = closePosition(pos, qty, price, 'Order filled');
      toast(symbol, `${side==='buy'?'Bought':'Sold'} ${qty} @ ${fmtPrice(price,SYM_MAP[symbol].dec)}`, side);
    } else {
      const remainder = qty - pos.qty;
      closePosition(pos, pos.qty, price, 'Order filled (flip)');
      openPosition(symbol, wantSide, remainder, price, stopLoss, takeProfit);
      toast(symbol, `Position flipped to ${wantSide} — ${remainder} @ ${fmtPrice(price,SYM_MAP[symbol].dec)}`, side);
    }
  } else if(pos && pos.side===wantSide){
    const cost = qty*price;
    if(cost>ACCOUNT.balance+1e-6){ toast(symbol,'Insufficient buying power for this order.','sell'); return; }
    ACCOUNT.balance -= cost;
    const newQty = pos.qty+qty;
    pos.entryPrice = (pos.entryPrice*pos.qty + price*qty)/newQty;
    pos.qty = newQty;
    if(stopLoss) pos.stopLoss = stopLoss;
    if(takeProfit) pos.takeProfit = takeProfit;
    logHistory({symbol, side: side==='buy'?'BUY':'SELL', qty, price, pnl:null, type:'ADD', reason:'Added to position'});
    toast(symbol, `Added ${qty} @ ${fmtPrice(price,SYM_MAP[symbol].dec)}`, side);
  } else {
    const ok = openPosition(symbol, wantSide, qty, price, stopLoss, takeProfit);
    if(ok) toast(symbol, `${side==='buy'?'Bought':'Sold'} ${qty} @ ${fmtPrice(price,SYM_MAP[symbol].dec)}`, side);
  }
  rerenderTradingPanels();
}

function checkPendingOrders(){
  if(ACCOUNT.pendingOrders.length===0) return;
  const stillPending = [];
  ACCOUNT.pendingOrders.forEach(o=>{
    const price = livePrice[o.symbol];
    let triggered=false, execPrice=price;
    if(o.type==='limit'){
      if(o.side==='buy' && price<=o.limitPrice){ triggered=true; execPrice=Math.min(price,o.limitPrice); }
      if(o.side==='sell' && price>=o.limitPrice){ triggered=true; execPrice=Math.max(price,o.limitPrice); }
    } else if(o.type==='stop'){
      if(o.side==='buy' && price>=o.stopPrice){ triggered=true; execPrice=price; }
      if(o.side==='sell' && price<=o.stopPrice){ triggered=true; execPrice=price; }
    } else if(o.type==='stoplimit'){
      if(!o.stopTriggered){
        if(o.side==='buy' && price>=o.stopPrice) o.stopTriggered=true;
        if(o.side==='sell' && price<=o.stopPrice) o.stopTriggered=true;
      }
      if(o.stopTriggered){
        if(o.side==='buy' && price<=o.limitPrice){ triggered=true; execPrice=o.limitPrice; }
        if(o.side==='sell' && price>=o.limitPrice){ triggered=true; execPrice=o.limitPrice; }
      }
    } else if(o.type==='trailing'){
      if(o.side==='sell'){ o.trailBest = Math.max(o.trailBest, price); const trig = o.trailBest*(1-o.trailPct/100); if(price<=trig){ triggered=true; execPrice=price; } }
      else { o.trailBest = Math.min(o.trailBest, price); const trig = o.trailBest*(1+o.trailPct/100); if(price>=trig){ triggered=true; execPrice=price; } }
    }
    if(triggered){
      executeTrade(o.symbol, o.side, o.qty, execPrice, o.stopLoss, o.takeProfit);
    } else {
      stillPending.push(o);
    }
  });
  ACCOUNT.pendingOrders = stillPending;
}

function checkStopLossTakeProfit(){
  const positions = [...ACCOUNT.positions];
  positions.forEach(pos=>{
    const price = livePrice[pos.symbol];
    const sym = SYM_MAP[pos.symbol];
    if(pos.side==='long'){
      if(pos.stopLoss && price<=pos.stopLoss){ const pnl=closePosition(pos,pos.qty,pos.stopLoss,'Stop loss hit'); tradeResultToast(pos.symbol, pnl, 'Stop loss hit', pos.stopLoss, sym.dec); }
      else if(pos.takeProfit && price>=pos.takeProfit){ const pnl=closePosition(pos,pos.qty,pos.takeProfit,'Take profit hit'); tradeResultToast(pos.symbol, pnl, 'Take profit hit', pos.takeProfit, sym.dec); }
    } else {
      if(pos.stopLoss && price>=pos.stopLoss){ const pnl=closePosition(pos,pos.qty,pos.stopLoss,'Stop loss hit'); tradeResultToast(pos.symbol, pnl, 'Stop loss hit', pos.stopLoss, sym.dec); }
      else if(pos.takeProfit && price<=pos.takeProfit){ const pnl=closePosition(pos,pos.qty,pos.takeProfit,'Take profit hit'); tradeResultToast(pos.symbol, pnl, 'Take profit hit', pos.takeProfit, sym.dec); }
    }
  });
}

function tradeResultToast(symbol, pnl, reasonLabel, price, dec){
  const win = pnl >= 0;
  const fun = win
    ? ['YAY! You did it!! 🎉','Nice one! 🚀','Cha-ching! 💰','Booked it! 🙌'][Math.floor(Math.random()*4)]
    : ["Aww, you'll get 'em next time!! 💪","Shake it off — next trade! 🙂","Ouch, small setback. 🫡"][Math.floor(Math.random()*3)];
  const amt = fmtMoney(pnl, true);
  toast(`${symbol} — ${reasonLabel}`, `${fun}  ${amt} @ ${fmtPrice(price,dec)}`, win?'buy':'sell');
  playAlertSound();
}
function toast(title, msg, kind){
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast'+(kind==='buy'?' buy':kind==='sell'?' sell':'');
  t.innerHTML = `<div class="t-title">${title}</div><div class="t-sub">${msg}</div>`;
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity 0.3s'; setTimeout(()=>t.remove(),300); }, 3800);
}

/* pin a floating panel directly under its button (they're position:fixed so the
   top bar's horizontal scroll can't clip them) */
function positionPanel(btn, panel){
  const r = btn.getBoundingClientRect();
  const pw = panel.offsetWidth || 280;
  let left = r.left;
  left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
  panel.style.left = left+'px';
  panel.style.top = (r.bottom + 6)+'px';
}

/* ---------------- HOVER EXPLAINERS ----------------
   Any element with data-tip (or a plain title) gets a plain-English bubble on
   hover. Titles are converted on the fly so nothing has to be registered. */
const TIP_TITLES = {
  '1m':'1-MINUTE','3m':'3-MINUTE','5m':'5-MINUTE','15m':'15-MINUTE','30m':'30-MINUTE',
  '1H':'1-HOUR','1D':'1-DAY','1W':'1-WEEK'
};
function initTooltips(){
  const bub = document.createElement('div');
  bub.id = 'tipBubble';
  document.body.appendChild(bub);
  let cur = null;
  const hide = ()=>{ bub.style.display='none'; cur=null; };
  document.addEventListener('mouseover', (e)=>{
    const el = e.target.closest && e.target.closest('[data-tip],[title]');
    if(!el){ hide(); return; }
    if(el.hasAttribute('title')){ // fold native tooltips into ours
      const t = el.getAttribute('title');
      if(t && !el.dataset.tip) el.dataset.tip = t;
      el.removeAttribute('title');
    }
    if(!el.dataset.tip){ hide(); return; }
    if(cur === el) return;
    cur = el;
    const label = el.dataset.tipTitle ? `<span class="tb-t">${el.dataset.tipTitle}</span>` : '';
    bub.innerHTML = label + el.dataset.tip;
    bub.style.display = 'block';
    const r = el.getBoundingClientRect();
    const bw = bub.offsetWidth, bh = bub.offsetHeight;
    let left = r.left + r.width/2 - bw/2;
    left = Math.max(8, Math.min(left, window.innerWidth - bw - 8));
    let top = r.bottom + 8;
    if(top + bh > window.innerHeight - 8) top = r.top - bh - 8;
    bub.style.left = left+'px';
    bub.style.top = Math.max(8, top)+'px';
  });
  document.addEventListener('mouseout', (e)=>{
    if(cur && (!e.relatedTarget || !cur.contains(e.relatedTarget))) hide();
  });
  document.addEventListener('mousedown', hide);
}

/* plain-English readout of what the stop and target actually mean in money */
function updateLvlNote(){
  const note = document.getElementById('lqNote');
  if(!note) return;
  const sym = currentSym();
  const px = STATE.side==='buy' ? askOf() : bidOf();
  const qty = getHudQty();
  const sl = parseFloat(document.getElementById('slInput').value);
  const tp = parseFloat(document.getElementById('tpInput').value);
  const bits = [];
  if(isFinite(sl)){
    const risk = Math.abs(px-sl);
    bits.push(`risk ${fmtMoney(risk*qty)} (${(risk/px*100).toFixed(2)}%)`);
  }
  if(isFinite(tp)){
    const rew = Math.abs(tp-px);
    bits.push(`reward ${fmtMoney(rew*qty)} (${(rew/px*100).toFixed(2)}%)`);
  }
  if(isFinite(sl) && isFinite(tp)){
    const rr = Math.abs(tp-px)/Math.max(1e-9, Math.abs(px-sl));
    bits.push(`R:R ${rr.toFixed(1)}:1`);
  }
  note.textContent = bits.join('  ·  ');
}

      <button class="hud-btn hud-buy" id="hudBuy" data-tip-title="BUY AT THE ASK" data-tip="Buy now at the ask — one click, no forms. If you are short this closes it.">

      <div class="qp-note" id="hudQtyNote"></div>
    </div>
  `;
  const pop = document.getElementById('hudQtyPop');
  document.getElementById('hudQty').onclick = (e)=>{

      document.getElementById('hudQtyInput').value = getHudQty();

  pop.querySelectorAll('[data-q]').forEach(b=> b.onclick = ()=>{ setHudQty(parseFloat(b.dataset.q)); pop.classList.remove('open'); });

function getHudQty(){ return parseFloat(document.getElementById('qtyInput').value) || 0; }
function setHudQty(q){
  document.getElementById('qtyInput').value = q;

  updateLvlNote();
  drawMainChart();
}
function updateHudQtyNote(){
  const note = document.getElementById('hudQtyNote');
  if(!note) return;
  const q = getHudQty(), sym = currentSym();

  note.textContent = q>0 ? `≈ ${fmtMoney(cost)} of ${sym.t} · ${(cost/Math.max(1,ACCOUNT.balance)*100).toFixed(0)}% of your buying power` : '';

function renderTradeHud(){
  const bidEl = document.getElementById('hudBid');

function hudMarketOrder(side){
  const qty = getHudQty();
  if(qty<=0){ toast(STATE.symbol,'Set a size first — tap the size chip.','sell'); return; }

  if(side==='buy' && qty*price > ACCOUNT.balance){
    toast(STATE.symbol, `Not enough buying power — that costs ${fmtMoney(qty*price)}.`, 'sell');
    return;

  executeTrade(STATE.symbol, side, qty, price, null, null);
  toast(STATE.symbol, `${side==='buy'?'Bought':'Sold'} ${qty} at ${fmtPrice(price,sym.dec)} (${side==='buy'?'ask':'bid'}).`, side==='buy'?'buy':'sell');

  drawMainChart();
}

/* ---------------- REFRESH / INIT / LOOP ---------------- */
function refreshAll(){
  STATE._lastBarCount = getCandles(STATE.symbol, STATE.tf).length;
  renderPriceBlock();
  renderWatchlist();
  renderIndicatorStrip();
  drawMainChart();
  drawSubpanel();
  renderAccountStrip();
  renderBottomContent();
  updateOrderFormVisibility();
  updateEstTotal();
  document.querySelectorAll('.tf-btn').forEach(b=> b.classList.toggle('active', b.textContent===STATE.tf));
  renderStatusBar();
  renderBarTimer();
  renderTradeHud();
  drawPanes();
}

function clockTick(){
  // simulation clock is paused while scrubbing replay history
  if(STATE.replay.active){ SIMCLOCK.lastReal = Date.now(); return; }
  advanceSimClock();
  renderBarTimer();
  updateClock();
}

/* Every second this used to do the lot in one synchronous burst: move 383 prices,
   repaint the chart, rebuild the watchlist rows, rebuild the positions table, and
   re-render five other panels. That burst is a hitch you can feel once a second —
   which is what was left of the chop after the rendering was fixed.
   Now the tick does the cheap, must-happen-now work (prices, stops, alerts) and
   hands the drawing to the frame scheduler. The expensive DOM panels update on a
   slower beat, because nobody can read a table that refreshes 60 times a second. */
function liveTick(){
  if(STATE.replay.active) return; // paused while scrubbing through history
  tickLivePrices(Math.random);
  checkStopLossTakeProfit();
  checkPendingOrders();
  checkPriceAlerts();
  requestRedraw(true);            // chart + panes, coalesced into one frame
  renderPriceBlock();
  renderTradeHud();
  renderBarTimer();
  updateClock();
}

/* the heavy panels, on a 2Hz beat instead of riding every tick */
function slowTick(){
  const home = document.getElementById('home');
  if(home && home.style.display !== 'none'){ renderHomeLive(); return; }
  if(STATE.replay.active) return;
  updateWatchlistPrices();
  renderIndicatorStrip();
  renderAccountStrip();
  if(STATE.bottomTab==='positions' || STATE.bottomTab==='orders') renderBottomContent();
  updateEstTotal();
  { const d = document.getElementById('aiDrawer'); if(d && d.classList.contains('open')) updateAICtx(); }
}

const LESSON_PROGRESS = { done: [] };
function saveLessons(){ try{ localStorage.setItem(ns('lessons'), JSON.stringify(LESSON_PROGRESS)); }catch(e){} }
function loadLessons(){
  try{
    const raw = localStorage.getItem(ns('lessons'));
    if(raw){ const o = JSON.parse(raw); if(Array.isArray(o.done)) LESSON_PROGRESS.done = o.done; }
  }catch(e){}
}
const lessonDone = (id)=> LESSON_PROGRESS.done.includes(id);
function lessonUnlocked(i){
  if(i === 0) return true;
  return lessonDone(LESSONS[i-1].id);
}
function completeLesson(id){
  var _wasNew = !lessonDone(id);
  if(_wasNew){ LESSON_PROGRESS.done.push(id); saveLessons(); }
  updateLessonProgressChips();
  // Platform XP bridge — internal Simbot progress stays internal; we only emit
  // milestones the platform awards XP for (host decides amounts + dedups).
  if(_wasNew && window.__FTA__ && window.__FTA__.emit){
    var _L = LESSONS.find(function(x){ return x.id === id; });
    // milestone: each Simbot lesson completed once -> one platform lesson award
    window.__FTA__.emit('lesson_complete', {
      id: id, title: (_L && _L.title) || id, stage: _L ? _L.stage : null
    });
    // milestone: internal level-up = a whole stage just finished (once per stage)
    if(_L){
      var _stageLessons = LESSONS.filter(function(x){ return x.stage === _L.stage; });
      var _allDone = _stageLessons.every(function(x){ return lessonDone(x.id); });
      if(_allDone){
        window.__FTA__.emit('level_up', {
          stage: _L.stage,
          name: (STAGES[_L.stage] && STAGES[_L.stage].name) || ('Stage ' + _L.stage)
        });
      }
    }
  }
}
function updateLessonProgressChips(){
  const txt = LESSON_PROGRESS.done.length+'/'+LESSONS.length;
  ['hnProg','lzProg'].forEach(id=>{ const el=document.getElementById(id); if(el) el.textContent = txt; });
}

/* ---- dev / admin shortcut ----
   type "/admin" (or /finish, /finishall) into any search box to mark the whole
   course complete, so you don't have to grind every lesson while testing. */
function completeAllLessons(){
  LESSONS.forEach(l=>{ if(!lessonDone(l.id)) LESSON_PROGRESS.done.push(l.id); });
  saveLessons();
  updateLessonProgressChips();
  const lz = document.getElementById('lessons');
  if(lz && lz.style.display!=='none') renderLessonList();   // refresh the ticks if you're on the list
  toast('Admin ✓', `All ${LESSONS.length} lessons marked complete.`);
  if(typeof fireConfetti==='function') fireConfetti(1400);
}
/* /D — fabricate a good-looking recent track record: a week+ of mostly-winning
   closed trades so the P&L calendar and stats look like you've been on a run.
   Pure demo/screenshot sugar; RESET wipes it like any other history. */
function seedDemoHistory(){
  const DAYS = 8, dayMs = 86400000, now = simNow();
  const rnd = Math.random;
  const pick = ()=> SYMBOLS[Math.floor(rnd()*SYMBOLS.length)];
  let added = 0, net = 0;
  for(let d=DAYS; d>=1; d--){
    const base = now - d*dayMs;
    const trades = 2 + Math.floor(rnd()*4);          // 2-5 trades a day
    for(let t=0; t<trades; t++){
      const s = pick();
      const win = rnd() < 0.78;                       // ~78% winners — good, not suspiciously perfect
      const px  = s.base * (1 + (rnd()-0.5)*0.02);
      const qty = Math.max(1, Math.round((400 + rnd()*4000)/px));
      const mag = qty*px*(0.004 + rnd()*0.02);        // 0.4%–2.4% moves
      const pnl = win ? mag : -mag*(0.4+rnd()*0.5);   // losers kept smaller than winners
      net += pnl;
      const time = base + 9*3600000 + Math.floor(rnd()*6*3600000) + t*1000;
      ACCOUNT.history.push({
        id: histIdSeq++, time,
        symbol: s.t, side: rnd()<0.5?'SELL':'BUY',
        qty, price: Math.round(px*100)/100,
        pnl: Math.round(pnl*100)/100, type:'CLOSE', reason:'Closed'
      });
      added++;
    }
  }
  ACCOUNT.history.sort((a,b)=> b.time - a.time);       // newest-first, like logHistory
  ACCOUNT.balance += net;
  saveAccount();
  if(typeof rerenderTradingPanels==='function') rerenderTradingPanels();
  if(typeof renderBottomContent==='function') renderBottomContent();
  if(typeof renderAccount==='function') renderAccount();
  toast('Admin ✓', `Seeded ${added} demo trades over ${DAYS} days · ${fmtMoney(net,true)}`, net>=0?'buy':'sell');

function maybeAdminCode(value){
  const v = (value||'').trim().toLowerCase();
  if(v==='/d' || v==='/demo'){ seedDemoHistory(); return true; }
  if(v==='/reset' || v==='/wipe'){ resetAccount(); return true; }

/* ---- The examples ----
   These used to be windows of the real generated market: 46-60 bars of honest
   noise. Honest, and useless to a beginner — you cannot learn what a body is
   while squinting at sixty of them. Every lesson now uses a hand-built example:
   about a dozen big, clean candles that exist to show one idea and nothing else,
   on round numbers. The answer is no longer "found" in noise, it is built in,
   which means it is never ambiguous and never unfair. */
const C = (o,h,l,c)=>({o,h,l,c,v:0});
function fixture(cs, extra){
  cs.forEach((c,i)=> c.t = Date.now() - (cs.length-i)*900000);
  const hi = Math.max(...cs.map(c=>c.h)), lo = Math.min(...cs.map(c=>c.l));
  return {cs, span: hi-lo, sym:'EXAMPLE', tf:'', ...extra};
}
/* ---------------- LESSON DIAGRAMS ----------------
   A beginner needs the picture before the prose. Every lesson opens with a plain,
   labelled diagram drawn from schematic candles — the same visual language they
   are learning to read. Nothing to interpret: just "this bit is called that". */
const DG = { ink:'#e8ebef', dim:'#7b8494', arrow:'#4d9dff', pad:'#0f1218' };
function dgCandle(x, hi, top, bot, lo, w, col){
  return `
    <line x1="${x}" y1="${hi}" x2="${x}" y2="${top}" stroke="${DG.ink}" stroke-width="3"/>
    <line x1="${x}" y1="${bot}" x2="${x}" y2="${lo}" stroke="${DG.ink}" stroke-width="3"/>
    <rect x="${x-w/2}" y="${top}" width="${w}" height="${bot-top}" fill="${col}" stroke="${DG.ink}" stroke-width="1.5" rx="1.5"/>`;
}
function dgLabel(x, y, text, anchor='middle', size=13, col=DG.ink, weight=700){
  return `<text x="${x}" y="${y}" text-anchor="${anchor}" font-family="IBM Plex Mono, monospace" font-size="${size}" font-weight="${weight}" fill="${col}">${text}</text>`;
}
function dgArrow(x1,y1,x2,y2){
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${DG.arrow}" stroke-width="1.6" marker-end="url(#dgArrowHead)"/>`;
}

/* ---------- drawing the lesson chart ---------- */
function drawLessonChart(){
  const canvas = document.getElementById('lzCanvas');
  if(!canvas || !LZ.win) return;
  const {ctx, w, h} = sizeCanvas(canvas);
  ctx.clearRect(0,0,w,h);
  const cs = LZ.win.cs;
  const mL=14, mR=64, mT=16, mB=22;
  const cw = w-mL-mR, ch = h-mT-mB;
  if(cw<=0||ch<=0) return;
  let lo=Infinity, hi=-Infinity;
  cs.forEach(c=>{ lo=Math.min(lo,c.l); hi=Math.max(hi,c.h); });
  const pad=(hi-lo)*0.12; lo-=pad; hi+=pad;
  const yAt = p=> mT + ch - ((p-lo)/(hi-lo))*ch;
  const xAt = i=> mL + (i+0.5)*(cw/cs.length);
  const bw = Math.max(8, Math.min(46, (cw/cs.length)*0.52));   // fat, diagram-sized candles
  LZ.frame = {mL, mT, cw, ch, lo, hi, n:cs.length, yAt, xAt, bw};

  // round numbers on the axis, because 100 / 101 / 102 is what a beginner can hold
  ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1;
  ctx.font='10px IBM Plex Mono, monospace'; ctx.textBaseline='middle';
  const rawStep = (hi-lo)/5;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const step = [1,2,2.5,5,10].map(m=>m*mag).find(v=> v>=rawStep) || mag*10;
  for(let v = Math.ceil(lo/step)*step; v <= hi; v += step){
    const y = yAt(v);
    ctx.beginPath(); ctx.moveTo(mL,y); ctx.lineTo(mL+cw,y); ctx.stroke();
    ctx.fillStyle='#5b6473'; ctx.textAlign='left';
    ctx.fillText(v.toFixed(v%1?1:0), mL+cw+6, y);
  }
  // the lesson's own answer overlay (only after you've answered)
  const t = LESSONS[LZ.idx].task.type;
  if(LZ.revealed){
    if(t==='hline'){
      const y=yAt(LZ.win.answer);
      ctx.setLineDash([5,4]); ctx.strokeStyle=THEME.up; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(mL,y); ctx.lineTo(mL+cw,y); ctx.stroke(); ctx.setLineDash([]);
      (LZ.win.touches||[]).forEach(i=>{
        ctx.strokeStyle=THEME.up; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.arc(xAt(i), yAt(cs[i].l < LZ.win.answer+ (hi-lo)*0.1 ? cs[i].l : cs[i].h), 7, 0, 7); ctx.stroke();
      });
    }
    if(t==='zone'){
      const z=LZ.win.zone;
      ctx.fillStyle=hexToRgba(LZ.win.type==='bull'?THEME.up:THEME.down, 0.22);
      ctx.fillRect(xAt(z.i-2)-bw, yAt(z.top), (mL+cw)-(xAt(z.i-2)-bw), yAt(z.bottom)-yAt(z.top));
      ctx.strokeStyle=hexToRgba(LZ.win.type==='bull'?THEME.up:THEME.down, 0.8);
      ctx.strokeRect(xAt(z.i-2)-bw, yAt(z.top), (mL+cw)-(xAt(z.i-2)-bw), yAt(z.bottom)-yAt(z.top));
    }
    if(t==='trendline'){
      const a=LZ.win.answerA, b=LZ.win.answerB;
      ctx.strokeStyle=THEME.up; ctx.lineWidth=2; ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(xAt(a), yAt(cs[a].l)); ctx.lineTo(xAt(b), yAt(cs[b].l)); ctx.stroke();
    }
    if(t==='pick-candle'){
      const i=LZ.win.answerIdx;
      ctx.strokeStyle=THEME.up; ctx.lineWidth=2;
      ctx.strokeRect(xAt(i)-bw*1.3, yAt(cs[i].h)-6, bw*2.6, yAt(cs[i].l)-yAt(cs[i].h)+12);
    }
  }
  // swing markers where the lesson wants you looking
  if(LZ.win.marks){
    (LZ.win.marks.lows||[]).forEach(i=>{
      ctx.fillStyle='#a78bfa'; ctx.textAlign='center'; ctx.textBaseline='top';
      ctx.font='13px IBM Plex Mono, monospace';
      ctx.fillText('▲', xAt(i), yAt(cs[i].l)+5);
      ctx.font='10px IBM Plex Mono, monospace';
    });
    (LZ.win.marks.highs||[]).forEach(i=>{
      ctx.fillStyle='#a78bfa'; ctx.textAlign='center'; ctx.textBaseline='bottom';
      ctx.font='13px IBM Plex Mono, monospace';
      ctx.fillText('▼', xAt(i), yAt(cs[i].h)-5);
      ctx.font='10px IBM Plex Mono, monospace';
    });
    ctx.textBaseline='middle';
  }
  // candles
  cs.forEach((c,i)=>{
    const up = c.c>=c.o, x=xAt(i);
    ctx.strokeStyle = up?THEME.up:THEME.down; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(x, yAt(c.h)); ctx.lineTo(x, yAt(c.l)); ctx.stroke();
    const yo=yAt(c.o), yc=yAt(c.c);
    ctx.fillStyle = up?THEME.up:THEME.down;
    ctx.fillRect(x-bw/2, Math.min(yo,yc), bw, Math.max(2, Math.abs(yc-yo)));
    ctx.strokeStyle = 'rgba(232,235,239,0.35)'; ctx.lineWidth=1;
    ctx.strokeRect(x-bw/2, Math.min(yo,yc), bw, Math.max(2, Math.abs(yc-yo)));
  });
  // your answer
  if(LZ.mark){
    if(t==='pick-candle'){
      const i=LZ.mark.idx;
      ctx.strokeStyle='#a78bfa'; ctx.lineWidth=2; ctx.setLineDash([3,2]);
      ctx.strokeRect(xAt(i)-bw*1.3, yAt(cs[i].h)-6, bw*2.6, yAt(cs[i].l)-yAt(cs[i].h)+12);
      ctx.setLineDash([]);
    } else if(t==='pick-price'){
      const x=xAt(LZ.mark.idx), y=yAt(LZ.mark.price);
      ctx.strokeStyle='#a78bfa'; ctx.lineWidth=1.4; ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.moveTo(mL,y); ctx.lineTo(mL+cw,y); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle='#a78bfa';
      ctx.beginPath(); ctx.arc(x,y,5,0,7); ctx.fill();
      ctx.fillRect(mL+cw, y-7, mR, 14);
      ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.fillText(LZ.mark.price.toFixed(2), mL+cw+4, y);
    } else if(t==='multi-pick'){
      (LZ.mark.picks||[]).forEach(i=>{
        if(!cs[i]) return;
        ctx.strokeStyle='#a78bfa'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(xAt(i), yAt(LZ.win.dir==='high'?cs[i].h:cs[i].l), 8, 0, 7); ctx.stroke();
      });
    } else if(t==='zone' && LZ.mark.top!=null){
      const z = LZ.mark;
      const yT=yAt(z.top), yB=yAt(z.bottom);
      const x1=Math.max(mL, xAt(Math.min(z.i1,z.i2))), x2=Math.min(mL+cw, xAt(Math.max(z.i1,z.i2)));
      const bwid = Math.max(8, x2-x1);
      ctx.fillStyle='rgba(167,139,250,0.20)';
      ctx.fillRect(x1, Math.min(yT,yB), bwid, Math.abs(yB-yT));
      ctx.strokeStyle='#a78bfa'; ctx.lineWidth=1.5;
      ctx.strokeRect(x1, Math.min(yT,yB), bwid, Math.abs(yB-yT));
      [yT, yB].forEach(y=>{                       // top / bottom grab bars
        ctx.fillStyle='#a78bfa';
        ctx.fillRect(x1 + bwid/2 - 10, y-2.5, 20, 5);
        ctx.fillStyle='rgba(0,0,0,0.5)';
        for(let g=-4; g<=4; g+=4) ctx.fillRect(x1 + bwid/2 + g - 0.5, y-1.5, 1, 3);
      });
      ctx.fillStyle='#a78bfa';                    // middle = move
      ctx.fillRect(x1 + bwid/2 - 3, (yT+yB)/2 - 6, 6, 12);
      [[z.top,yT],[z.bottom,yB]].forEach(([p,y])=>{
        ctx.fillStyle='#a78bfa'; ctx.fillRect(mL+cw, y-7, mR, 14);
        ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.textBaseline='middle';
        ctx.fillText(p.toFixed(2), mL+cw+4, y);
      });
    } else if(t==='hline'){
      const y=yAt(LZ.mark.price);
      ctx.strokeStyle='#a78bfa'; ctx.lineWidth=1.5; ctx.setLineDash([4,3]);
      ctx.beginPath(); ctx.moveTo(mL,y); ctx.lineTo(mL+cw,y); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle='#a78bfa'; ctx.fillRect(mL+cw, y-7, mR, 14);
      ctx.fillStyle='#fff'; ctx.textAlign='left';
      ctx.fillText(LZ.mark.price.toFixed(2), mL+cw+4, y);
    } else if(t==='trendline'){
      const pts = LZ.mark.pts||[];
      pts.forEach(pt=>{ ctx.fillStyle='#a78bfa'; ctx.beginPath(); ctx.arc(xAt(pt.idx), yAt(pt.price), 4, 0, 7); ctx.fill(); });
      if(pts.length===2){
        ctx.strokeStyle='#a78bfa'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(xAt(pts[0].idx), yAt(pts[0].price)); ctx.lineTo(xAt(pts[1].idx), yAt(pts[1].price)); ctx.stroke();
      }
    }
  }
}

const LZ = { idx:0, win:null, mark:null, revealed:false, frame:null, choice:null, drag:null, picks:[] };

function certificateId(){
  const seed = (SESSION.email||'guest') + '|' + LESSONS.map(l=>l.id).join('');
  const h = hashStr(seed).toString(16).toUpperCase().padStart(8,'0');
  return 'SB-' + h.slice(0,4) + '-' + h.slice(4,8);
}
function loadImg(src){
  return new Promise(res=>{ const i = new Image(); i.onload=()=>res(i); i.onerror=()=>res(null); i.src = src; });
}
async function drawCertificate(canvas){
  const W = 1400, H = 980, dpr = 2;
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.width = '100%';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);

  // ground
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#12141b'); bg.addColorStop(1,'#0a0c0f');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  const glow = ctx.createRadialGradient(W/2, 210, 20, W/2, 210, 620);
  glow.addColorStop(0,'rgba(167,139,250,0.20)'); glow.addColorStop(1,'rgba(167,139,250,0)');
  ctx.fillStyle = glow; ctx.fillRect(0,0,W,H);

  // frame
  ctx.strokeStyle = 'rgba(167,139,250,0.55)'; ctx.lineWidth = 2;
  ctx.strokeRect(30,30,W-60,H-60);
  ctx.strokeStyle = 'rgba(255,176,0,0.35)'; ctx.lineWidth = 1;
  ctx.strokeRect(40,40,W-80,H-80);
  // corner flourishes
  ctx.strokeStyle = 'var(--amber)'; ctx.strokeStyle = '#ffb000'; ctx.lineWidth = 3;
  [[30,30,1,1],[W-30,30,-1,1],[30,H-30,1,-1],[W-30,H-30,-1,-1]].forEach(([x,y,sx,sy])=>{
    ctx.beginPath();
    ctx.moveTo(x+sx*8, y+sy*54); ctx.lineTo(x+sx*8, y+sy*8); ctx.lineTo(x+sx*54, y+sy*8);
    ctx.stroke();
  });

  const [simLogo, lessonLogo] = await Promise.all([
    loadImg(document.querySelector('link[rel="icon"]').href),
    loadImg(LESSON_LOGO),
  ]);
  if(lessonLogo) ctx.drawImage(lessonLogo, W/2-56, 78, 112, 112);

  const mid = W/2;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#7b8494';
  ctx.font = '600 15px IBM Plex Mono, monospace';
  ctx.fillText('S I M B O T   ·   L E S S O N B O T', mid, 224);

  ctx.fillStyle = '#e8ebef';
  ctx.font = '800 46px IBM Plex Mono, monospace';
  ctx.fillText('CERTIFICATE OF COMPLETION', mid, 288);

  ctx.strokeStyle = 'rgba(255,176,0,0.6)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(mid-150, 312); ctx.lineTo(mid+150, 312); ctx.stroke();

  ctx.fillStyle = '#7b8494'; ctx.font = '400 16px IBM Plex Mono, monospace';
  ctx.fillText('This certifies that', mid, 366);

  const name = (SESSION.email ? SESSION.email.split('@')[0].replace(/[._-]/g,' ') : 'Guest Trader')
    .replace(/\b\w/g, c=>c.toUpperCase());
  const grad = ctx.createLinearGradient(mid-300, 0, mid+300, 0);
  grad.addColorStop(0,'#ffb000'); grad.addColorStop(0.5,'#ffd479'); grad.addColorStop(1,'#ffb000');
  ctx.fillStyle = grad;
  ctx.font = '800 62px IBM Plex Mono, monospace';
  ctx.fillText(name, mid, 434);
  ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(mid-280, 456); ctx.lineTo(mid+280, 456); ctx.stroke();

  ctx.fillStyle = '#c9ced8'; ctx.font = '400 17px IBM Plex Mono, monospace';
  const nCore = LESSONS.filter(l=> l.stage!==8).length;
  ctx.fillText('has completed the LessonBot course in technical analysis —', mid, 494);
  ctx.fillText(nCore+' lessons, each one marked out by hand, in order.', mid, 520);

  // the stages, two columns — 19 titles would never fit
  ctx.textAlign = 'left';
  const stageNames = Object.keys(STAGES).filter(k=> k!=='8')
    .map(k=> STAGES[k].name.replace(/^STAGE \d+ · /,''));
  stageNames.forEach((name,i)=>{
    const col = i<4 ? 0 : 1;
    const x = col===0 ? 200 : 740;
    const y = 580 + (i%4)*34;
    ctx.fillStyle = '#00d964';
    ctx.font = '700 15px IBM Plex Mono, monospace';
    ctx.fillText('✓', x, y);
    ctx.fillStyle = '#c9ced8';
    ctx.font = '400 14px IBM Plex Mono, monospace';
    ctx.fillText(name, x+26, y);
  });

  // footer
  const d = new Date(simNow());
  ctx.textAlign = 'left';
  ctx.fillStyle = '#4b5361'; ctx.font = '400 12px IBM Plex Mono, monospace';
  ctx.fillText('ISSUED', 200, 806);
  ctx.fillText('CERTIFICATE ID', 200, 856);
  ctx.fillStyle = '#e8ebef'; ctx.font = '600 15px IBM Plex Mono, monospace';
  ctx.fillText(d.toLocaleDateString('en-US',{month:'long', day:'numeric', year:'numeric'}), 200, 828);
  ctx.fillText(certificateId(), 200, 878);

  ctx.textAlign = 'right';
  if(simLogo) ctx.drawImage(simLogo, W-262, 776, 46, 46);
  ctx.fillStyle = '#e8ebef'; ctx.font = '800 20px IBM Plex Mono, monospace';
  ctx.fillText('SIMBOT', W-200, 810);
  ctx.fillStyle = '#ffb000'; ctx.font = '600 11px IBM Plex Mono, monospace';
  ctx.fillText('LEARN.  PRACTICE.  PROFIT.', W-200, 830);
  ctx.fillStyle = '#4b5361'; ctx.font = '400 11px IBM Plex Mono, monospace';
  ctx.fillText('Simulated market. Real practice.', W-200, 872);
  ctx.textAlign = 'left';
}

/* plain canvas particles — no library */
function fireConfetti(ms=2600){
  const cv = document.createElement('canvas');
  cv.className = 'confetti-cv';
  document.body.appendChild(cv);
  const dpr = window.devicePixelRatio||1;
  const W = window.innerWidth, H = window.innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols = ['#a78bfa','#3ee6d8','#ffb000','#00d964','#4d9dff','#ffffff'];
  const bits = [];
  for(let i=0;i<160;i++){
    bits.push({
      x: W*0.5 + (Math.random()-0.5)*W*0.5, y: -20 - Math.random()*H*0.3,
      vx: (Math.random()-0.5)*3.4, vy: 2 + Math.random()*3.6,
      w: 5 + Math.random()*6, h: 8 + Math.random()*8,
      rot: Math.random()*Math.PI, vr: (Math.random()-0.5)*0.28,
      c: cols[(Math.random()*cols.length)|0], sway: Math.random()*Math.PI*2,
    });
  }
  const t0 = (window.performance||Date).now();
  const frame = (t)=>{
    const age = t - t0;
    ctx.clearRect(0,0,W,H);
    bits.forEach(b=>{
      b.sway += 0.06;
      b.x += b.vx + Math.sin(b.sway)*0.9;
      b.y += b.vy; b.vy += 0.045; b.rot += b.vr;
      ctx.save();
      ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      ctx.globalAlpha = age > ms*0.65 ? Math.max(0, 1-(age-ms*0.65)/(ms*0.35)) : 1;
      ctx.fillStyle = b.c;
      ctx.fillRect(-b.w/2, -b.h/2, b.w, b.h);
      ctx.restore();
    });
    if(age < ms) (window.requestAnimationFrame||((f)=>setTimeout(()=>f(Date.now()),16)))(frame);
    else cv.remove();
  };
  (window.requestAnimationFrame||((f)=>setTimeout(()=>f(Date.now()),16)))(frame);
}

let CERT_SHOWN = false;
