/* ---------------- DRAWING TOOLS: geometry + rendering ---------------- */
let CHART_FRAME = null;
const DRAWING_MARKERS = []; // {x,y,drawing} click-to-delete hit regions, rebuilt each render
const DRAW_HITS = [];       // {d, test(x,y), anchor:{x,y}} — click a drawing to select it

function frameXToIdx(clientX, canvas){
  const f = CHART_FRAME; if(!f) return 0;
  const rect = canvas.getBoundingClientRect();
  const x = clientX - rect.left;
  const frac = (x - f.marginL) / f.chartW;
  return f.viewStart + frac * f.visRange;
}
function frameYToPrice(clientY, canvas){
  const f = CHART_FRAME; if(!f) return 0;
  const rect = canvas.getBoundingClientRect();
  const y = clientY - rect.top;
  const frac = (y - f.marginT) / f.chartH;
  return f.hi - frac * (f.hi - f.lo);
}
function maybeSnap(idx, price){
  if(!STATE.magnet) return {idx, price};
  const candles = getCandles(STATE.symbol, STATE.tf);
  const ci = Math.max(0, Math.min(candles.length-1, Math.round(idx)));
  return {idx: ci, price: candles[ci].c};
}

const TOOL_COLOR = '#2dd4bf'; // teal accent for drawings, distinct from candle up/down colors
const DRAW_PALETTE = ['#2dd4bf','#ffb000','#00d964','#ff3b30','#4d9dff','#a855f7','#e8ebef','#7b8494'];
const dColor = (d)=> d.color || TOOL_COLOR;      // every drawing can carry its own colour
const dWidth = (d, base)=> (d.lineWidth || 1) * base;

/* geometry helpers for "did I click this drawing?" */
function distToSegment(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1;
  const len2 = dx*dx+dy*dy;
  let t = len2 ? ((px-x1)*dx + (py-y1)*dy)/len2 : 0;
  t = Math.max(0, Math.min(1, t));
  const cx = x1+t*dx, cy = y1+t*dy;
  return Math.hypot(px-cx, py-cy);
}

function drawUserDrawings(ctx, xAt, yAt, sym, marginL, marginT, chartW, chartH){
  const list = getDrawings();
  const temp = STATE.drawTemp;
  const all = temp ? [...list, temp] : list;
  all.forEach(d=>{
    const isTemp = d===temp;
    ctx.save();
    if(d.type==='trend'){
      const x1=xAt(d.p1.idx), y1=yAt(d.p1.price), x2=xAt(d.p2.idx), y2=yAt(d.p2.price);
      ctx.strokeStyle = dColor(d); ctx.lineWidth = dWidth(d, 1.6);
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      ctx.fillStyle = dColor(d);
      ctx.beginPath(); ctx.arc(x1,y1,3,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(x2,y2,3,0,7); ctx.fill();
      if(!isTemp){
        DRAW_HITS.push({d, anchor:{x:(x1+x2)/2, y:Math.min(y1,y2)},
          pts:[{key:'p1',x:x1,y:y1},{key:'p2',x:x2,y:y2}],
          test:(px,py)=> distToSegment(px,py,x1,y1,x2,y2) <= 6});
        DRAWING_MARKERS.push({x:x2,y:y2,drawing:d});
      }
    } else if(d.type==='hline'){
      const y = yAt(d.price);
      ctx.setLineDash([5,3]);
      ctx.strokeStyle = dColor(d); ctx.lineWidth=dWidth(d,1.3);
      ctx.beginPath(); ctx.moveTo(marginL,y); ctx.lineTo(marginL+chartW,y); ctx.stroke();
      ctx.setLineDash([]);
      if(!isTemp){
        DRAW_HITS.push({d, anchor:{x:marginL+chartW*0.5, y}, test:(px,py)=> Math.abs(py-y)<=6 && px>=marginL && px<=marginL+chartW});
        DRAWING_MARKERS.push({x:marginL+chartW-10,y,drawing:d});
      }
    } else if(d.type==='rect'){
      // a zone, not a box: it starts where you drew it and runs forever to the right,
      // because a level that mattered on Tuesday still matters on Friday
      const xL = xAt(Math.min(d.p1.idx, d.p2.idx));
      const xR = marginL + chartW;
      const yTop = yAt(Math.max(d.p1.price, d.p2.price));
      const yBot = yAt(Math.min(d.p1.price, d.p2.price));
      const rx = Math.max(marginL, xL), rw = Math.max(0, xR-Math.max(marginL,xL));
      const ry = Math.min(yTop,yBot), rh = Math.max(1, Math.abs(yBot-yTop));
      ctx.fillStyle=hexToRgba(dColor(d),0.14); ctx.fillRect(rx,ry,rw,rh);
      ctx.strokeStyle=dColor(d); ctx.lineWidth=dWidth(d,1.3);
      ctx.beginPath();
      ctx.moveTo(rx, ry); ctx.lineTo(rx+rw, ry);      // top edge
      ctx.moveTo(rx, ry+rh); ctx.lineTo(rx+rw, ry+rh); // bottom edge
      ctx.moveTo(rx, ry); ctx.lineTo(rx, ry+rh);       // left edge
      ctx.stroke();
      // dashed midline
      ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(190,150,255,0.8)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(rx, ry+rh/2); ctx.lineTo(rx+rw, ry+rh/2); ctx.stroke();
      ctx.setLineDash([]);
      if(!isTemp){
        // grab handles on the left edge, like TradingView
        const hx = rx;
        [[hx, ry], [hx, ry+rh]].forEach(([hxx,hyy])=>{
          ctx.beginPath(); ctx.arc(hxx, hyy, 3.5, 0, Math.PI*2);
          ctx.fillStyle='#1a1d24'; ctx.fill();
          ctx.strokeStyle='#4d9dff'; ctx.lineWidth=1.4; ctx.stroke();
        });
        ctx.fillStyle='#1a1d24'; ctx.strokeStyle='#4d9dff'; ctx.lineWidth=1.4;
        ctx.fillRect(hx-3, ry+rh/2-3.5, 6, 7); ctx.strokeRect(hx-3, ry+rh/2-3.5, 6, 7);
        // price tags on the axis for both edges
        const tag=(y,v)=>{
          const t = fmtPrice(v, sym.dec);
          ctx.font='9px IBM Plex Mono, monospace';
          const tw2 = ctx.measureText(t).width+8;
          ctx.fillStyle='#2f6fd0'; ctx.fillRect(marginL+chartW+1, y-7, tw2, 14);
          ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.textBaseline='middle';
          ctx.fillText(t, marginL+chartW+5, y);
          ctx.textBaseline='alphabetic';
        };
        tag(ry, Math.max(d.p1.price,d.p2.price));
        tag(ry+rh, Math.min(d.p1.price,d.p2.price));
        DRAW_HITS.push({d, anchor:{x:rx+40, y:ry}, test:(px,py)=> px>=rx-4 && px<=rx+rw && py>=ry-4 && py<=ry+rh+4});
        // order matters: findPositionHandle scans back to front, so the small
        // move handle must be pushed last or the left edge swallows it
        POS_HANDLES.push({d, kind:'rleft', x:rx, yTop:ry, yBot:ry+rh});
        POS_HANDLES.push({d, kind:'rtop', y:ry, x1:rx, x2:rx+rw});
        POS_HANDLES.push({d, kind:'rbot', y:ry+rh, x1:rx, x2:rx+rw});
        POS_HANDLES.push({d, kind:'rmid', y:ry+rh/2, x1:rx-4, x2:rx+8});
        DRAWING_MARKERS.push({x:rx+8, y:ry-8, drawing:d});
      }
    } else if(d.type==='triangle'){
      const x1=xAt(d.p1.idx), y1=yAt(d.p1.price), x2=xAt(d.p2.idx), y2=yAt(d.p2.price);
      const midX=(x1+x2)/2;
      ctx.beginPath(); ctx.moveTo(midX,y1); ctx.lineTo(x2,y2); ctx.lineTo(x1,y2); ctx.closePath();
      ctx.fillStyle='rgba(255,176,0,0.12)'; ctx.fill();
      ctx.strokeStyle=TOOL_COLOR; ctx.lineWidth=1.4; ctx.stroke();
      if(!isTemp) DRAWING_MARKERS.push({x:x2,y:y2,drawing:d});
    } else if(d.type==='emoji'){
      const x=xAt(d.idx), y=yAt(d.price);
      ctx.font='20px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(d.emoji, x, y);
      ctx.textAlign='left'; ctx.textBaseline='alphabetic';
      if(!isTemp) DRAWING_MARKERS.push({x, y, drawing:d});
    } else if(d.type==='fib'){
      const x1=xAt(d.p1.idx), x2=xAt(d.p2.idx);
      const lx = Math.min(x1,x2), rx = Math.max(x1,x2);
      const levels = [0,0.236,0.382,0.5,0.618,0.786,1];
      const p1 = d.p1.price, p2 = d.p2.price;
      levels.forEach(lv=>{
        const price = p1 + (p2-p1)*lv;
        const y = yAt(price);
        ctx.setLineDash([4,3]);
        ctx.strokeStyle = dColor(d); ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(lx,y); ctx.lineTo(rx,y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = dColor(d); ctx.font='9px IBM Plex Mono, monospace';
        ctx.fillText(`${lv} · ${fmtPrice(price,sym.dec)}`, lx+3, y-3);
      });
      if(!isTemp) DRAW_HITS.push({d, anchor:{x:(lx+rx)/2, y:yAt(p2)},
        pts:[{key:'p1',x:x1,y:yAt(p1)},{key:'p2',x:x2,y:yAt(p2)}],
        test:(px,py)=>{
          if(px<lx-6||px>rx+6) return false;
          return levels.some(lv=> Math.abs(py - yAt(p1+(p2-p1)*lv)) <= 5);
        }});
      if(!isTemp) DRAWING_MARKERS.push({x:rx,y:yAt(p2),drawing:d});
    } else if(d.type==='text'){
      const x=xAt(d.idx), y=yAt(d.price);
      ctx.fillStyle='rgba(17,20,25,0.85)';
      ctx.font='11px IBM Plex Mono, monospace';
      const tw = ctx.measureText(d.text).width;
      ctx.fillRect(x, y-14, tw+8, 16);
      ctx.fillStyle = dColor(d);
      ctx.fillText(d.text, x+4, y-2);
      if(!isTemp){
        DRAW_HITS.push({d, anchor:{x:x+tw/2, y:y-14}, test:(px,py)=> px>=x-2 && px<=x+tw+8 && py>=y-16 && py<=y+4});
        DRAWING_MARKERS.push({x:x+tw+4,y:y-6,drawing:d});
      }
    } else if(d.type==='longpos' || d.type==='shortpos'){
      drawPositionTool(ctx, d, isTemp, xAt, yAt, sym, marginL, chartW);
    } else if(d.type==='ruler'){
      const x1=xAt(d.p1.idx), y1=yAt(d.p1.price), x2=xAt(d.p2.idx), y2=yAt(d.p2.price);
      const priceDiff = d.p2.price-d.p1.price;
      const pct = (priceDiff/d.p1.price)*100;
      const bars = Math.round(d.p2.idx-d.p1.idx);
      ctx.setLineDash([3,2]);
      ctx.strokeStyle = pct>=0?upColor():downColor(); ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      ctx.setLineDash([]);
      const label = `${priceDiff>=0?'+':''}${fmtPrice(priceDiff,sym.dec)}  (${pctStr(pct)})  ${bars} bars`;
      ctx.font='10.5px IBM Plex Mono, monospace';
      const tw = ctx.measureText(label).width;
      const lx = Math.min(x1,x2), ly = Math.min(y1,y2)-8;
      ctx.fillStyle = pct>=0? hexToRgba(THEME.up,0.9) : hexToRgba(THEME.down,0.9);
      ctx.fillRect(lx, ly-13, tw+10, 16);
      ctx.fillStyle = '#0a0c0f';
      ctx.fillText(label, lx+5, ly-5);
      if(!isTemp) DRAW_HITS.push({d, anchor:{x:(x1+x2)/2, y:Math.min(y1,y2)},
        pts:[{key:'p1',x:x1,y:y1},{key:'p2',x:x2,y:y2}],
        test:(px,py)=> distToSegment(px,py,x1,y1,x2,y2)<=6});
    }
    // selected drawings get a soft halo so you can see what you grabbed
    if(!isTemp && STATE.selectedDrawing===d){
      const hit = DRAW_HITS.find(h=>h.d===d);
      if(hit){
        ctx.strokeStyle = 'rgba(77,157,255,0.9)'; ctx.lineWidth=1;
        ctx.setLineDash([3,3]);
        ctx.beginPath(); ctx.arc(hit.anchor.x, hit.anchor.y, 9, 0, Math.PI*2); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
    ctx.restore();
  });
}

/* ---------------- MOVING DRAWINGS ----------------
   Grab a drawing anywhere on its body to slide the whole thing; grab an end
   point to move just that end. Everything is stored in chart space (bar index +
   price), so a drawing stays put when you zoom, pan or switch timeframe. */
function freezeScale(){
  if(CHART_FRAME && isFinite(CHART_FRAME.lo) && isFinite(CHART_FRAME.hi)){
    STATE.scaleFreeze = {lo: CHART_FRAME.lo, hi: CHART_FRAME.hi};
  }
}
function thawScale(){
  STATE.scaleFreeze = null;
  drawMainChart();   // one clean redraw so the scale settles around the new level
}

function beginDrawingDrag(hit, canvas, e){
  const idx = frameXToIdx(e.clientX, canvas);
  const price = frameYToPrice(e.clientY, canvas);
  const rct = canvas.getBoundingClientRect();
  const x = e.clientX-rct.left, y = e.clientY-rct.top;
  let mode = 'move', ptKey = null;
  if(hit.pts){
    for(const pt of hit.pts){
      if(Math.hypot(x-pt.x, y-pt.y) <= 7){ mode = 'point'; ptKey = pt.key; break; }
    }
  }
  pushUndo();
  freezeScale();
  STATE.drawDrag = {
    d: hit.d, mode, ptKey,
    startIdx: idx, startPrice: price,
    orig: JSON.parse(JSON.stringify(hit.d)),
    moved: false,
  };
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  canvas.style.cursor = mode==='point' ? 'grabbing' : 'move';
}
function moveDrawingDrag(e){
  const g = STATE.drawDrag;
  const canvas = document.getElementById('chartCanvas');
  let idx = frameXToIdx(e.clientX, canvas);
  let price = frameYToPrice(e.clientY, canvas);
  ({idx, price} = maybeSnap(idx, price));
  const d = g.d, o = g.orig;
  if(Math.abs(idx-g.startIdx) > 0.02 || Math.abs(price-g.startPrice) > 1e-9) g.moved = true;

  if(g.mode==='point'){
    d[g.ptKey] = {idx, price};
  } else {
    const di = idx - g.startIdx, dp = price - g.startPrice;
    if(o.p1) d.p1 = {idx:o.p1.idx+di, price:o.p1.price+dp};
    if(o.p2) d.p2 = {idx:o.p2.idx+di, price:o.p2.price+dp};
    if(o.entry!=null){                       // long/short position box
      d.entry = o.entry+dp; d.stop = o.stop+dp; d.target = o.target+dp;
      d.idx = o.idx+di;
    } else if(!o.p1){
      if(o.price!=null) d.price = o.price+dp; // horizontal line
      if(o.idx!=null) d.idx = o.idx+di;       // text / emoji
    }
  }
  requestRedraw();
}
function endDrawingDrag(canvas, e){
  const g = STATE.drawDrag;
  STATE.drawDrag = null;
  thawScale();
  try{ canvas.releasePointerCapture(e.pointerId); }catch(err){}
  canvas.style.cursor = 'crosshair';
  if(g && g.moved){ touchDrawings(); STATE.suppressNextClick = true; }
  drawMainChart();
  renderDrawToolbar();
}

/* ---------------- SELECTED DRAWING TOOLBAR ----------------
   Click any drawing and a little bar appears over it: recolour it, set the line
   weight, or bin it. Delete/Backspace works too. */
function selectDrawing(d){
  STATE.selectedDrawing = d;
  renderDrawToolbar();
  drawMainChart();
}
/* cheap: move the toolbar, don't rebuild it (called every drag frame) */
function positionDrawToolbar(){
  const tb = document.getElementById('drawTb');
  const d = STATE.selectedDrawing;
  if(!tb || !d || tb.style.display==='none') return;
  const hit = DRAW_HITS.find(h=>h.d===d);
  const wrap = document.getElementById('chartWrap');
  if(!hit || !wrap) return;
  const ww = wrap.clientWidth, wh = wrap.clientHeight;
  tb.style.left = Math.max(6, Math.min(hit.anchor.x - tb.offsetWidth/2, ww - tb.offsetWidth - 6))+'px';
  tb.style.top = Math.max(6, Math.min(hit.anchor.y - 42, wh - 44))+'px';
}
function renderDrawToolbar(){
  let tb = document.getElementById('drawTb');
  const d = STATE.selectedDrawing;
  if(!d){ if(tb) tb.style.display='none'; return; }
  if(!tb){
    tb = document.createElement('div');
    tb.id = 'drawTb'; tb.className = 'draw-tb';
    document.getElementById('chartWrap').appendChild(tb);
  }
  const isLine = ['trend','hline','fib','ruler'].includes(d.type);
  tb.innerHTML = `
    <span class="tb-grip">⠿</span>
    <div class="tb-swatches">${DRAW_PALETTE.map(c=>
      `<button class="tb-sw ${dColor(d)===c?'on':''}" data-c="${c}" style="background:${c}" data-tip="Recolour this drawing"></button>`).join('')}</div>
    ${isLine ? `<span class="tb-div"></span><div class="tb-widths">${[1,2,3].map(wv=>
      `<button class="tb-w ${(d.lineWidth||1)===wv?'on':''}" data-w="${wv}" data-tip="Line thickness"><i style="height:${wv}px"></i></button>`).join('')}</div>` : ''}
    <span class="tb-div"></span>
    <button class="tb-del" id="tbDel" data-tip="Delete this drawing (or press Delete)">${ICONS.trash}</button>
  `;
  tb.style.display = 'flex';
  const hit = DRAW_HITS.find(h=>h.d===d);
  const wrap = document.getElementById('chartWrap');
  const ww = wrap.clientWidth, wh = wrap.clientHeight;
  const ax = hit ? hit.anchor.x : ww/2, ay = hit ? hit.anchor.y : 40;
  tb.style.left = Math.max(6, Math.min(ax - tb.offsetWidth/2, ww - tb.offsetWidth - 6))+'px';
  tb.style.top = Math.max(6, Math.min(ay - 42, wh - 44))+'px';
  tb.querySelectorAll('.tb-sw').forEach(b=> b.onclick = ()=>{
    d.color = b.dataset.c;
    STATE.drawColor = b.dataset.c;
    touchDrawings();
    renderDrawToolbar(); drawMainChart();
  });
  tb.querySelectorAll('.tb-w').forEach(b=> b.onclick = ()=>{
    d.lineWidth = parseInt(b.dataset.w);
    touchDrawings();
    renderDrawToolbar(); drawMainChart();
  });
  document.getElementById('tbDel').onclick = ()=>{
    pushUndo();
    removeDrawing(d);
    selectDrawing(null);
    toast('DRAWINGS','Drawing deleted.','sell');
  };
}

/* ---------------- LONG / SHORT POSITION TOOL ----------------
   One click drops a complete plan: entry where you clicked, a 0.5% stop and a
   2:1 target already in place. Every level is then draggable — target, stop,
   entry, and the right edge for how far out the plan runs. R:R and the dollar
   risk/reward update as you drag. */
const POS_HANDLES = [];

function currentTicketQty(){
  const el = document.getElementById('qtyInput');
  const q = el ? parseFloat(el.value) : NaN;
  return (isFinite(q) && q>0) ? q : 0;
}
/* A standard-sized box: the default stop is sized off how much this instrument
   actually moves on this timeframe (recent average candle range), then capped so
   the whole plan can never swallow the screen. Drag from there. */
/* How much this instrument actually moves per candle on the timeframe you're
   looking at. Everything that needs a sane distance — stops, targets, the
   position tool — is sized off this instead of a made-up percentage. */
function atr14(symTick, tfKey){
  const candles = getCandles(symTick || STATE.symbol, tfKey || STATE.tf);
  const n = Math.min(14, candles.length);
  if(!n) return 0;
  let tr = 0;
  for(let i=candles.length-n; i<candles.length; i++){
    const c = candles[i], prev = candles[i-1];
    tr += prev ? Math.max(c.h-c.l, Math.abs(c.h-prev.c), Math.abs(c.l-prev.c)) : (c.h-c.l);
  }
  return tr/n;
}
/* one place that decides "how far away is a sensible level right now" */
function suggestRisk(price){
  const span = (CHART_FRAME && CHART_FRAME.hi > CHART_FRAME.lo) ? (CHART_FRAME.hi - CHART_FRAME.lo) : price*0.02;
  return Math.min(Math.max(atr14()*0.8, price*0.0004), span*0.06);
}
function defaultPosRisk(price){
  const atr = atr14() || price*0.002;
  let risk = atr * 1.2;
  const F = CHART_FRAME;
  if(F && F.hi > F.lo){
    // risk + 2R target = 3 x risk, so 11% keeps the whole box to a third of the screen
    risk = Math.min(risk, (F.hi - F.lo) * 0.11);
    risk = Math.max(risk, (F.hi - F.lo) * 0.02);
  }
  return Math.max(risk, price * 0.0002);
}

function posMetrics(d){
  const long = d.type==='longpos';
  const risk = Math.abs(d.entry - d.stop);
  const reward = Math.abs(d.target - d.entry);
  const rr = risk>0 ? reward/risk : 0;
  return {long, risk, reward, rr};
}
function drawPositionTool(ctx, d, isTemp, xAt, yAt, sym, marginL, chartW){
  const {long, risk, reward, rr} = posMetrics(d);
  const x1 = xAt(d.idx), x2 = xAt(d.idx + d.width);
  const w = Math.max(30, x2-x1);
  const yE = yAt(d.entry), yS = yAt(d.stop), yT = yAt(d.target);

  // zones
  ctx.fillStyle = hexToRgba(THEME.up, 0.16);
  ctx.fillRect(x1, Math.min(yE,yT), w, Math.abs(yT-yE));
  ctx.fillStyle = hexToRgba(THEME.down, 0.16);
  ctx.fillRect(x1, Math.min(yE,yS), w, Math.abs(yS-yE));
  ctx.lineWidth = 1;
  ctx.strokeStyle = hexToRgba(THEME.up, 0.75);
  ctx.strokeRect(x1, Math.min(yE,yT), w, Math.abs(yT-yE));
  ctx.strokeStyle = hexToRgba(THEME.down, 0.75);
  ctx.strokeRect(x1, Math.min(yE,yS), w, Math.abs(yS-yE));

  // entry line
  ctx.setLineDash([4,3]);
  ctx.strokeStyle = 'rgba(232,235,239,0.85)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(x1, yE); ctx.lineTo(x1+w, yE); ctx.stroke();
  ctx.setLineDash([]);

  // drag grips
  const grip = (y, color)=>{
    ctx.fillStyle = color;
    ctx.fillRect(x1 + w/2 - 9, y-2.5, 18, 5);
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    for(let g=-4; g<=4; g+=4) ctx.fillRect(x1 + w/2 + g - 0.5, y-1.5, 1, 3);
  };
  grip(yT, THEME.up);
  grip(yS, THEME.down);
  grip(yE, 'rgba(232,235,239,0.9)');
  // right-edge grip (duration)
  ctx.fillStyle = 'rgba(232,235,239,0.55)';
  ctx.fillRect(x1+w-2.5, Math.min(yT,yS)+ Math.abs(yT-yS)/2 - 9, 5, 18);

  // price tags
  ctx.font = '9px IBM Plex Mono, monospace';
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const tag = (y, text, color)=>{
    const tw = ctx.measureText(text).width + 8;
    ctx.fillStyle = color;
    ctx.fillRect(x1+w+2, y-7, tw, 14);
    ctx.fillStyle = '#08090b';
    ctx.fillText(text, x1+w+6, y);
  };
  const pctOf = v=> ((v-d.entry)/d.entry*100);
  tag(yT, 'TARGET '+fmtPrice(d.target,sym.dec)+'  '+pctStr(pctOf(d.target)), hexToRgba(THEME.up,0.92));
  tag(yS, 'STOP '+fmtPrice(d.stop,sym.dec)+'  '+pctStr(pctOf(d.stop)), hexToRgba(THEME.down,0.92));
  tag(yE, 'ENTRY '+fmtPrice(d.entry,sym.dec), 'rgba(232,235,239,0.92)');

  // summary chip
  const qty = currentTicketQty();
  const money = qty>0 ? `  ·  risk ${fmtMoney(risk*qty)} → reward ${fmtMoney(reward*qty)} on ${qty}` : '';
  const label = `${long?'LONG':'SHORT'}  ·  R:R ${rr.toFixed(1)} : 1${money}`;
  ctx.font = '10px IBM Plex Mono, monospace';
  const lw = ctx.measureText(label).width + 12;
  const ly = Math.min(yE, yT, yS) - 9;
  ctx.fillStyle = 'rgba(17,20,25,0.92)';
  ctx.fillRect(x1, ly-9, lw, 18);
  ctx.strokeStyle = long ? hexToRgba(THEME.up,0.6) : hexToRgba(THEME.down,0.6);
  ctx.lineWidth = 1; ctx.strokeRect(x1, ly-9, lw, 18);
  ctx.fillStyle = long ? THEME.up : THEME.down;
  ctx.fillText(label, x1+6, ly);
  ctx.textBaseline = 'alphabetic';

  if(!isTemp){
    // body of the box = grab to move the whole plan; the lines are separate handles
    DRAW_HITS.push({d, anchor:{x:x1+w/2, y:Math.min(yT,yS,yE)-12},
      test:(px,py)=> px>=x1 && px<=x1+w && py>=Math.min(yT,yS,yE) && py<=Math.max(yT,yS,yE)});
    POS_HANDLES.push({d, kind:'target', y:yT, x1, x2:x1+w});
    POS_HANDLES.push({d, kind:'stop',   y:yS, x1, x2:x1+w});
    POS_HANDLES.push({d, kind:'entry',  y:yE, x1, x2:x1+w});
    POS_HANDLES.push({d, kind:'right',  x:x1+w, yTop:Math.min(yT,yS), yBot:Math.max(yT,yS)});
    DRAWING_MARKERS.push({x:x1+w, y:Math.min(yT,yS,yE)-18, drawing:d});
  }
}

/* which draggable part of a position box is under the cursor (if any) */
function findPositionHandle(clientX, clientY, canvas){
  const rect = canvas.getBoundingClientRect();
  const x = clientX-rect.left, y = clientY-rect.top;
  for(let i=POS_HANDLES.length-1; i>=0; i--){
    const h = POS_HANDLES[i];
    if(h.kind==='right' || h.kind==='rleft'){
      if(Math.abs(x-h.x) <= 5 && y >= h.yTop-10 && y <= h.yBot+10) return h;
    } else {
      if(x >= h.x1-3 && x <= h.x2+3 && Math.abs(y-h.y) <= 5) return h;
    }
  }
  return null;
}
function handlePositionDragMove(e){
  const h = STATE.posDrag;
  const canvas = document.getElementById('chartCanvas');
  const d = h.d;
  if(d.type==='rect'){
    const price = frameYToPrice(e.clientY, canvas);
    const hi = Math.max(d.p1.price, d.p2.price), lo = Math.min(d.p1.price, d.p2.price);
    if(h.kind==='rtop'){ d.p1.price = Math.max(price, lo + lo*0.0002); d.p2.price = lo; }
    else if(h.kind==='rbot'){ d.p1.price = hi; d.p2.price = Math.min(price, hi - hi*0.0002); }
    else if(h.kind==='rmid'){
      const dy = price - (hi+lo)/2;
      d.p1.price = hi + dy; d.p2.price = lo + dy;
    } else if(h.kind==='rleft'){
      const idx = frameXToIdx(e.clientX, canvas);
      d.p1.idx = idx; d.p2.idx = idx;
    }
    requestRedraw();
    return;
  }
  const long = d.type==='longpos';
  if(h.kind==='right'){
    const idx = frameXToIdx(e.clientX, canvas);
    d.width = Math.max(3, Math.round(idx - d.idx));
  } else {
    const price = frameYToPrice(e.clientY, canvas);
    const minGap = d.entry * 0.0004;
    if(h.kind==='entry'){
      // dragging the entry slides the whole plan, keeping your risk and reward
      const dy = price - d.entry;
      d.entry += dy; d.stop += dy; d.target += dy;
    } else if(h.kind==='stop'){
      d.stop = long ? Math.min(price, d.entry-minGap) : Math.max(price, d.entry+minGap);
    } else if(h.kind==='target'){
      d.target = long ? Math.max(price, d.entry+minGap) : Math.min(price, d.entry-minGap);
    }
  }
  requestRedraw();
}

function removeDrawing(d){
  touchDrawings();
  if(STATE.selectedDrawing===d){ STATE.selectedDrawing=null; const tb=document.getElementById('drawTb'); if(tb) tb.style.display='none'; }
  pushUndo();
  const arr = getDrawings();
  const i = arr.indexOf(d);
  if(i>-1) arr.splice(i,1);
}

function onChartClickForDelete(e){
  if(e.currentTarget.id!=='chartCanvas') return;
  if(STATE.suppressNextClick){ STATE.suppressNextClick=false; return; }
  if(checkTradeLineDelete(e.clientX, e.clientY, e.currentTarget)) return;
  if(STATE.drawLock) return;
  const canvas = e.currentTarget;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX-rect.left, y = e.clientY-rect.top;
  for(const m of DRAWING_MARKERS){
    if(Math.abs(x-m.x)<9 && Math.abs(y-m.y)<9){
      removeDrawing(m.drawing);
      drawMainChart();
      toast('DRAWINGS','Drawing removed.','sell');
      return;
    }
  }
}

/* ---------------- DRAWING TOOL POINTER HANDLERS ----------------
   Two-point shapes (trend/rect/triangle/fib/ruler) support BOTH workflows:
   1) classic click-drag-release, and
   2) click to place the first point, move the mouse freely with the
      button UP to preview the shape, then click again to finish.
   The second workflow is what keeps a shape from vanishing just because
   you're not holding the mouse button down — STATE.drawPlacing (unlike
   the old toolDragging flag) stays true across the mouse-up in between.
------------------------------------------------------------------- */
function handleDrawPointerDown(e){
  const canvas = e.currentTarget;
  if(!CHART_FRAME) return;
  let idx = frameXToIdx(e.clientX, canvas);
  let price = frameYToPrice(e.clientY, canvas);
  ({idx, price} = maybeSnap(idx, price));
  const tool = STATE.tool;
  if(STATE.drawLock){ toast('DRAWINGS','Drawings are locked.','sell'); return; }
  if(tool==='longpos' || tool==='shortpos'){
    pushUndo();
    const long = tool==='longpos';
    const risk = defaultPosRisk(price);
    touchDrawings();
    getDrawings().push({
      type: tool,
      idx: idx,                                    // left edge (bar)
      width: 10,                                   // standard width — drag the right edge to extend
      entry: price,
      stop:   long ? price - risk : price + risk,
      target: long ? price + risk*2 : price - risk*2,
    });
    STATE.suppressNextClick = true;
    STATE.tool = 'cursor';
    document.querySelectorAll('.draw-btn[data-tool]').forEach(x=> x.classList.toggle('active', x.dataset.tool==='cursor'));
    drawMainChart();
    toast(long?'LONG POSITION':'SHORT POSITION', 'Drag the green target, the red stop, the entry line, or the right edge to adjust it.', 'buy');
    return;
  }
  if(tool==='hline'){
    pushUndo();
    getDrawings().push({type:'hline', price, color: STATE.drawColor||undefined});
    touchDrawings();
    STATE.suppressNextClick = true;
    finishOneShotDraw();
    drawMainChart();
    return;
  }
  if(tool==='text'){
    const txt = window.prompt('Annotation text:','');
    if(txt){ pushUndo(); getDrawings().push({type:'text', idx, price, text:txt, color: STATE.drawColor||undefined}); touchDrawings(); STATE.suppressNextClick = true; drawMainChart(); }
    finishOneShotDraw();
    return;
  }
  if(tool==='emoji'){
    openEmojiPicker(e.clientX, e.clientY, idx, price);
    return;
  }
  if(tool==='zoom'){
    const candles = getCandles(STATE.symbol, STATE.tf);
    const {rect, marginL, chartW} = chartGeometry(canvas);
    const frac = Math.min(1,Math.max(0,(e.clientX-rect.left-marginL)/chartW));
    zoomViewAt(frac, 0.55, candles.length);
    drawMainChart(); drawSubpanel();
    finishOneShotDraw();
    return;
  }
  // trend / rect / triangle / fib / ruler — two-point shape
  if(!STATE.drawPlacing || !STATE.drawTemp){
    // first click: place the anchor point and start a live preview that
    // follows the mouse whether or not the button stays held down
    STATE.drawPlacing = true;
    STATE.drawDownAt = {x:e.clientX, y:e.clientY};
    STATE.drawTemp = {type:tool, p1:{idx,price}, p2:{idx,price}};
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    drawMainChart();
  } else {
    // second click: finish the shape wherever the preview currently is
    finalizeTempDrawing(idx, price);
  }
}
function handleDrawPointerMove(e){
  if(!STATE.drawPlacing || !STATE.drawTemp) return;
  const canvas = e.currentTarget;
  let idx = frameXToIdx(e.clientX, canvas);
  let price = frameYToPrice(e.clientY, canvas);
  ({idx, price} = maybeSnap(idx, price));
  STATE.drawTemp.p2 = {idx, price};
  drawMainChart();
}
function handleDrawPointerUp(e){
  if(!STATE.drawPlacing || !STATE.drawTemp) return;
  const canvas = e.currentTarget;
  try{ canvas.releasePointerCapture(e.pointerId); }catch(err){}
  const down = STATE.drawDownAt || {x:e.clientX, y:e.clientY};
  const dragged = Math.abs(e.clientX-down.x) > 6 || Math.abs(e.clientY-down.y) > 6;
  if(dragged){
    // classic click-drag-release — finish right here on release
    let idx = frameXToIdx(e.clientX, canvas);
    let price = frameYToPrice(e.clientY, canvas);
    ({idx, price} = maybeSnap(idx, price));
    finalizeTempDrawing(idx, price);
  }
  // otherwise this was just the first click of a click-then-click shape —
  // leave drawTemp/drawPlacing alone so the preview keeps following the
  // mouse until the person clicks a second time to finish it
}
function finalizeTempDrawing(idx, price){
  const d = STATE.drawTemp;
  if(!d) return;
  d.p2 = {idx, price};
  STATE.drawTemp = null;
  STATE.drawPlacing = false;
  if(d.type==='ruler' || Math.abs(d.p1.idx-d.p2.idx)>0.15 || Math.abs(d.p1.price-d.p2.price)>0){
    pushUndo();
    if(STATE.drawColor) d.color = STATE.drawColor;
    getDrawings().push(d);
    touchDrawings();
    STATE.suppressNextClick = true;
  }
  finishOneShotDraw();
  drawMainChart();
}
function finishOneShotDraw(){
  // when "stay in drawing mode" is on (the pin toggle), the current tool
  // stays selected and ready to draw again instead of jumping back to
  // the cursor after every single shape
  if(!STATE.stayInDrawMode) resetToolToCursor();
}
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape' && STATE.selectedDrawing){ selectDrawing(null); return; }
  if((e.key==='Delete' || e.key==='Backspace') && STATE.selectedDrawing){
    const tag = (e.target.tagName||'').toLowerCase();
    if(tag==='input' || tag==='textarea' || tag==='select') return;
    e.preventDefault();
    pushUndo();
    removeDrawing(STATE.selectedDrawing);
    selectDrawing(null);
    toast('DRAWINGS','Drawing deleted.','sell');
  }
});

function resetToolToCursor(){
  STATE.tool = 'cursor';
  document.querySelectorAll('.draw-btn[data-tool]').forEach(x=>x.classList.toggle('active', x.dataset.tool==='cursor'));
}

const EMOJI_SET = ['🚀','📈','📉','🔥','⚠️','💰','🎯','🐂','🐻','✅','❌','⭐'];
function openEmojiPicker(clientX, clientY, idx, price){

let AUDIO_CTX = null;
function playAlertSound(){
  if(!STATE.soundAlerts) return;
  try{
    AUDIO_CTX = AUDIO_CTX || new (window.AudioContext||window.webkitAudioContext)();
    const ctx = AUDIO_CTX;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.setValueAtTime(660, ctx.currentTime+0.1);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.32);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+0.34);
  }catch(err){ /* audio not available — fail silently */ }
}

/* ---------------- CHART SETTINGS MODAL ---------------- */

/* ---------------- POSITION / ORDER LINES ON CHART (draggable TP/SL) ---------------- */
const POS_LINES = []; // {y, price, kind:'entry'|'tp'|'sl', ref, refKind, side}
const POS_LINE_DELETE_HITS = []; // {x,y,ref,field}

function drawTradeLines(ctx, xAt, yAt, sym, marginL, marginT, chartW, chartH, marginR){
  POS_LINES.length = 0;
  POS_LINE_DELETE_HITS.length = 0;
  const items = [];
  ACCOUNT.positions.filter(p=>p.symbol===STATE.symbol).forEach(p=> items.push({ref:p, refKind:'position', side: p.side==='long'?'buy':'sell', entry:p.entryPrice, qty:p.qty}));
  ACCOUNT.pendingOrders.filter(o=>o.symbol===STATE.symbol).forEach(o=> items.push({ref:o, refKind:'pending', side:o.side, entry:(o.limitPrice||o.stopPrice||currentPrice()), qty:o.qty}));
  if(items.length===0) return;

  const dir = (side)=> side==='buy' ? 1 : -1;
  const rightX = marginL+chartW;

  items.forEach(item=>{
    const sgn = dir(item.side);
    // Suggested (ghost) levels for a position with nothing set yet. These used to be
    // a flat ±1.5% of price, which on a 5m chart is ~37x the average candle — the
    // lines landed so far off that the whole scale had to zoom out to show them.
    // Size them off what the instrument actually does, like every other level here.
    // Suggested levels for a position with nothing set yet. Two rules, both needed:
    //   1. size off ATR, so the distance means something on this timeframe
    //   2. cap against what's on screen, so the suggestion never eats the chart
    //      (ATR alone still ran to ~40% of the height on a quiet 5m chart)
    const span = (CHART_FRAME && CHART_FRAME.hi > CHART_FRAME.lo) ? (CHART_FRAME.hi - CHART_FRAME.lo) : item.entry*0.02;
    const gRisk = Math.min(
      Math.max(atr14() * 0.8, item.entry * 0.0004),   // ATR-sized
      span * 0.06                                      // never more than 6% of the visible range
    );
    const ghostTP = item.entry + gRisk*2*sgn;   // 1:2 by default — the habit worth teaching
    const ghostSL = item.entry - gRisk*sgn;
    const tp = item.ref.takeProfit!=null ? item.ref.takeProfit : ghostTP;
    const sl = item.ref.stopLoss!=null ? item.ref.stopLoss : ghostSL;
    const tpIsGhost = item.ref.takeProfit==null;
    const slIsGhost = item.ref.stopLoss==null;

    const yEntry = yAt(item.entry), yTP = yAt(tp), ySL = yAt(sl);

    // shaded profit/loss zones
    ctx.fillStyle = 'rgba(0,217,100,0.07)';
    ctx.fillRect(marginL, Math.min(yEntry,yTP), chartW, Math.abs(yEntry-yTP));
    ctx.fillStyle = 'rgba(255,176,0,0.07)';
    ctx.fillRect(marginL, Math.min(yEntry,ySL), chartW, Math.abs(yEntry-ySL));

    // entry line
    ctx.setLineDash([]);
    ctx.strokeStyle = item.side==='buy' ? upColor() : downColor();
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(marginL, yEntry); ctx.lineTo(rightX, yEntry); ctx.stroke();
    POS_LINES.push({y:yEntry, price:item.entry, kind:'entry', ref:item.ref, refKind:item.refKind});

    // TP line
    ctx.setLineDash(tpIsGhost?[2,4]:[6,3]);
    ctx.strokeStyle = 'rgba(0,217,100,'+(tpIsGhost?0.45:0.95)+')';
    ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(marginL, yTP); ctx.lineTo(rightX, yTP); ctx.stroke();
    POS_LINES.push({y:yTP, price:tp, kind:'tp', ref:item.ref, refKind:item.refKind});

    // SL line
    ctx.strokeStyle = 'rgba(255,176,0,'+(slIsGhost?0.45:0.95)+')';
    ctx.beginPath(); ctx.moveTo(marginL, ySL); ctx.lineTo(rightX, ySL); ctx.stroke();
    ctx.setLineDash([]);
    POS_LINES.push({y:ySL, price:sl, kind:'sl', ref:item.ref, refKind:item.refKind});

    // price tags in the right margin (TP / SL) with $ amount + delete ✕
    const tagAmount = (price)=> (price-item.entry)*item.qty*sgn;
    const drawTag = (y, label, price, color, textColor, amount, ghost, field)=>{
      const amtStr = (amount>=0?'+':'')+amount.toFixed(2)+' USD';
      ctx.font='10px IBM Plex Mono, monospace';
      const txt = `${label}  ${fmtPrice(price,sym.dec)}   ${amtStr}`;
      const tw = ctx.measureText(txt).width;
      const boxW = tw+34, boxX = rightX - boxW - 4, boxY = y-9;
      ctx.globalAlpha = ghost?0.55:1;
      ctx.fillStyle = color;
      ctx.fillRect(boxX, boxY, boxW, 18);
      ctx.fillStyle = textColor;
      ctx.fillText(txt, boxX+6, y+3.5);
      // delete x
      ctx.fillStyle = textColor;
      ctx.fillText('✕', boxX+boxW-16, y+3.5);
      ctx.globalAlpha = 1;
      POS_LINE_DELETE_HITS.push({x:boxX+boxW-10, y, ref:item.ref, field});
    };
    drawTag(yTP, 'TP', tp, 'rgba(0,217,100,0.92)', '#00190a', tagAmount(tp), tpIsGhost, 'takeProfit');
    drawTag(ySL, 'SL', sl, 'rgba(255,176,0,0.92)', '#241900', tagAmount(sl), slIsGhost, 'stopLoss');
  });
}

function findTradeLineHit(clientX, clientY, canvas){
  const rect = canvas.getBoundingClientRect();
  const y = clientY - rect.top;
  for(const line of POS_LINES){
    if(line.kind==='entry') continue; // only TP/SL are draggable
    if(Math.abs(y-line.y) < 5) return line;
  }
  return null;
}
function handleLineDragMove(e){
  const canvas = e.currentTarget;
  const price = frameYToPrice(e.clientY, canvas);
  const hit = STATE.lineDrag;
  const field = hit.kind==='tp' ? 'takeProfit' : 'stopLoss';
  hit.ref[field] = Math.max(0.0001, price);
  requestRedraw();
}
function handleLineDragUp(e){
  thawScale();
  STATE.lineDrag = null;
  const canvas = e.currentTarget;
  canvas.style.cursor = 'crosshair';
  try{ canvas.releasePointerCapture(e.pointerId); }catch(err){}
  rerenderTradingPanels();
  drawMainChart();
}
function checkTradeLineDelete(clientX, clientY, canvas){
  const rect = canvas.getBoundingClientRect();
  const x = clientX-rect.left, y = clientY-rect.top;
  for(const h of POS_LINE_DELETE_HITS){
    if(Math.abs(x-h.x)<9 && Math.abs(y-h.y)<9){
      h.ref[h.field] = null;
      rerenderTradingPanels();
      drawMainChart();
      toast(STATE.symbol, `${h.field==='takeProfit'?'Take profit':'Stop loss'} removed.`, 'sell');
      return true;
    }
  }
  return false;
}

/* ---------------- CHART DRAWING ---------------- */
/* Assigning canvas.width/height reallocates the backing store and wipes the
   canvas — even when you assign the SAME number. This ran on every frame of
   every pan, zoom and tick, for every pane. That was the chop. Only touch it
   when the size has genuinely changed. */
function sizeCanvas(canvas){
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  const W = Math.max(1, Math.floor(rect.width*dpr));
  const H = Math.max(1, Math.floor(rect.height*dpr));
  if(canvas.width !== W || canvas.height !== H){
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = rect.width+'px';
    canvas.style.height = rect.height+'px';
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w:rect.width, h:rect.height};
}

/* ---------------- FRAME-COALESCED REDRAW ----------------
   A wheel can fire 100+ events a second and a pointer 120+; drawing the whole
   chart synchronously for each one means the work piles up behind the input
   queue and the chart lurches. Fold every request into one draw per animation
   frame, so the chart moves at the screen's refresh rate no matter how fast the
   events arrive. */
let _rafQueued = false, _rafPanes = false;
function requestRedraw(withPanes){
  if(withPanes) _rafPanes = true;
  if(_rafQueued) return;
  _rafQueued = true;
  const run = ()=>{
    _rafQueued = false;
    drawMainChart();
    if(_rafPanes){ _rafPanes = false; drawPanes(); }
    if(STATE.selectedDrawing) positionDrawToolbar();
  };
  (window.requestAnimationFrame || ((f)=>setTimeout(f,16)))(run);
}

function drawMainChart(){
  const canvas = document.getElementById('chartCanvas');
  if(!canvas) return;
  const cwrap = document.getElementById('chartWrap');
  if(cwrap) cwrap.classList.toggle('replay-picking', !!(STATE.replay.active && STATE.replay.selecting));
  const {ctx, w, h} = sizeCanvas(canvas);
  ctx.clearRect(0,0,w,h);
  const sym = currentSym();
  let candles = getCandles(STATE.symbol, STATE.tf);
  if(STATE.replay.active && STATE.replay.idx!=null){ candles = candles.slice(0, STATE.replay.idx+1); }
  const marginR = 64, marginT = 10, marginB = 22, marginL = 8;
  const chartW = w - marginL - marginR;
  const chartH = h - marginT - marginB;
  if(chartW<=0||chartH<=0) return;

  // ---- zoom/pan view window ----
  const view = ensureView(candles.length);
  const viewStart = view.start, viewEnd = view.end;
  const visRange = viewEnd - viewStart;
  const visLo = Math.max(0, Math.min(candles.length-1, Math.floor(viewStart)));
  const visHi = Math.max(0, Math.min(candles.length-1, Math.ceil(viewEnd)));

  let fvgZones = null;
  if(STATE.overlays.fvg || STATE.overlays.ifvg) fvgZones = getFVGZones(STATE.symbol, STATE.tf);

  // vertical auto-fit is based on what's actually visible, like TradingView — but if the
  // view has been panned/zoomed out into the blank right margin, widen the window so the
  // price scale stays stable instead of collapsing onto just the last candle or two.
  const fitHi = visHi;
  const fitLo = (visHi - visLo < 20) ? Math.max(0, visHi - 20) : visLo;
  let lo = Infinity, hi = -Infinity;
  for(let i=fitLo;i<=fitHi;i++){ const c=candles[i]; lo=Math.min(lo,c.l); hi=Math.max(hi,c.h); }
  const pad = (hi-lo)*0.08 || hi*0.01 || 1;
  lo -= pad; hi += pad;

  // Your own levels count as part of the picture. If you're in a trade, the entry,
  // stop and target belong on screen — having to zoom out to find your own stop is
  // backwards. Expansion is capped at 60% of the candle range each way so one wild
  // target can't flatten the candles into a line.
  if(!STATE.replay.active){
    const levels = [];
    ACCOUNT.positions.forEach(p=>{
      if(p.symbol!==STATE.symbol) return;
      levels.push(p.entryPrice);
      if(p.stopLoss) levels.push(p.stopLoss);
      if(p.takeProfit) levels.push(p.takeProfit);
    });
    ACCOUNT.pendingOrders.forEach(o=>{
      if(o.symbol!==STATE.symbol) return;
      if(o.limitPrice) levels.push(o.limitPrice);
      if(o.stopPrice) levels.push(o.stopPrice);
    });
    if(levels.length){
      const span = (hi - lo) || 1;
      const floorLo = lo - span*0.6, ceilHi = hi + span*0.6;
      levels.forEach(v=>{
        if(!isFinite(v)) return;
        if(v < lo && v >= floorLo) lo = v - span*0.04;
        if(v > hi && v <= ceilHi) hi = v + span*0.04;
      });
    }
  }

  // manual vertical zoom ("side zoom") — stretches/compresses around the auto-fit center
  const priceScale = STATE.priceScale || 1;
  if(priceScale !== 1){
    const midP = (lo+hi)/2;
    const halfP = ((hi-lo)/2) * priceScale;
    lo = midP - halfP; hi = midP + halfP;
  }
  // vertical pan — lets you drag the visible price window up/down past the auto-fit range,
  // the same way horizontal panning can now scroll past the last candle.
  if(STATE.priceOffsetFrac){
    const offsetP = STATE.priceOffsetFrac * (hi - lo);
    lo += offsetP; hi += offsetP;
  }

  // While you're dragging a level, the price scale is FROZEN. Without this the
  // auto-fit keeps growing to include the very level you're dragging, which
  // rescales the chart under your cursor, which moves the line away from the
  // cursor, which makes it grow again — the line runs away from you and the whole
  // thing judders. Lock the window for the duration of the drag.
  if(STATE.scaleFreeze){ lo = STATE.scaleFreeze.lo; hi = STATE.scaleFreeze.hi; }

  const xAt = (i)=> marginL + ((i - viewStart + 0.5)/visRange)*chartW;
  const yAt = (p)=> marginT + chartH - ((p-lo)/(hi-lo))*chartH;

  // grid + price labels
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.fillStyle = '#4b5361';
  ctx.font = '10px IBM Plex Mono, monospace';
  ctx.textBaseline = 'middle';
  const gridLines = 6;
  for(let i=0;i<=gridLines;i++){
    const p = lo + (hi-lo)*(i/gridLines);
    const y = yAt(p);
    ctx.beginPath(); ctx.moveTo(marginL,y); ctx.lineTo(marginL+chartW,y); ctx.stroke();
    ctx.fillText(fmtPrice(p, sym.dec), marginL+chartW+6, y);
  }
  // time labels
  ctx.textAlign='center';
  const timeStep = Math.max(1, Math.floor((visHi-visLo+1)/6));
  for(let i=visLo;i<=visHi;i+=timeStep){
    ctx.fillText(dateLabel(candles[i].t, STATE.tf), xAt(i), h-marginB+11);
  }
  ctx.textAlign='left';

  const barW = chartW/visRange;
  const bodyW = Math.max(1.5, barW*0.62);

  // everything below is clipped to the plot area so zoom/pan never bleeds into the axes
  ctx.save();
  ctx.beginPath(); ctx.rect(marginL, marginT, chartW, chartH); ctx.clip();

  // ---- FVG / IFVG zones (drawn behind price so candles/lines sit on top) ----
  if(fvgZones){
    const drawFVGBox = (zone, isInverse)=>{
      const startI = isInverse ? zone.invStartIdx : zone.startIdx;
      const endI = zone.endIdx;
      if(startI==null || endI==null) return;
      const x1 = xAt(startI) - barW/2, x2 = xAt(Math.max(endI, startI)) + barW/2;
      if(x2 < marginL || x1 > marginL+chartW) return; // fully offscreen — skip
      const r = zoneRemainder(zone);
      const y1 = yAt(r.top), y2 = yAt(r.bottom);
      const top = Math.min(y1,y2), boxH = Math.max(1, Math.abs(y2-y1));
      const cx1 = Math.max(marginL,x1), cx2 = Math.min(x2, marginL+chartW), boxW = Math.max(0,cx2-cx1);
      const col = isInverse
        ? (zone.type==='bull' ? '#ffb000' : '#4d9dff')     // flipped zones get their own colours
        : (zone.type==='bull' ? THEME.up : THEME.down);
      // flat translucent fill, faint edge — the box should sit behind price, not fight it
      ctx.fillStyle = hexToRgba(col, isInverse ? 0.13 : 0.16);
      ctx.fillRect(cx1, top, boxW, boxH);
      ctx.strokeStyle = hexToRgba(col, isInverse ? 0.5 : 0.28);
      ctx.lineWidth = 1;
      if(isInverse) ctx.setLineDash([3,2]);
      ctx.strokeRect(cx1, top, boxW, boxH);
      ctx.setLineDash([]);
      // label rides the right end of the zone, like every ICT indicator
      if(boxW > 26){
        const label = isInverse ? 'IFVG' : 'FVG';
        ctx.font = '9.5px IBM Plex Mono, monospace';
        ctx.fillStyle = hexToRgba(col, 0.95);
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.fillText(label, cx2-4, top + boxH/2);
        ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      }
    };
    fvgZones.forEach(z=>{
      if(STATE.overlays.fvg && !z.inverted && !z.dead) drawFVGBox(z,false);
      if(STATE.overlays.ifvg && z.inverted) drawFVGBox(z,true);
    });
  }

  if(STATE.chartType==='candles'){
    for(let i=visLo;i<=visHi;i++){
      const c = candles[i];
      const x = xAt(i);
      const up = c.c>=c.o;
      const col = up? upColor() : downColor();
      ctx.strokeStyle = wickColor(up);
      ctx.beginPath(); ctx.moveTo(x, yAt(c.h)); ctx.lineTo(x, yAt(c.l)); ctx.stroke();
      const yo = yAt(c.o), yc = yAt(c.c);
      const top = Math.min(yo,yc), bh = Math.max(1, Math.abs(yc-yo));
      ctx.strokeStyle = ctx.fillStyle = col;
      if(THEME.body==='hollow' && up && bh>1.2){
        ctx.lineWidth=1.2;
        ctx.strokeRect(x-bodyW/2+0.5, top+0.5, bodyW-1, bh-1);
        ctx.lineWidth=1;
      } else {
        ctx.fillRect(x-bodyW/2, top, bodyW, bh);
      }
    }
  } else if(STATE.chartType==='bars'){
    for(let i=visLo;i<=visHi;i++){
      const c = candles[i];
      const x = xAt(i);
      const up = c.c>=c.o;
      ctx.strokeStyle = up? upColor() : downColor();
      ctx.lineWidth=1.3;
      ctx.beginPath(); ctx.moveTo(x, yAt(c.h)); ctx.lineTo(x, yAt(c.l)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x-bodyW/2, yAt(c.o)); ctx.lineTo(x, yAt(c.o)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, yAt(c.c)); ctx.lineTo(x+bodyW/2, yAt(c.c)); ctx.stroke();
      ctx.lineWidth=1;
    }
  } else if(STATE.chartType==='line' || STATE.chartType==='area'){
    if(STATE.chartType==='area'){
      const grad = ctx.createLinearGradient(0,marginT,0,marginT+chartH);
      grad.addColorStop(0,'rgba(255,176,0,0.28)');
      grad.addColorStop(1,'rgba(255,176,0,0.02)');
      ctx.beginPath();
      let started=false;
      for(let i=visLo;i<=visHi;i++){ const c=candles[i]; const x=xAt(i), y=yAt(c.c); if(!started){ctx.moveTo(x,y);started=true;} else ctx.lineTo(x,y); }
      ctx.lineTo(xAt(visHi), marginT+chartH);
      ctx.lineTo(xAt(visLo), marginT+chartH);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();
    }
    ctx.beginPath();
    let started=false;
    for(let i=visLo;i<=visHi;i++){ const c=candles[i]; const x=xAt(i), y=yAt(c.c); if(!started){ctx.moveTo(x,y);started=true;} else ctx.lineTo(x,y); }
    ctx.strokeStyle = '#ffb000'; ctx.lineWidth=1.6; ctx.stroke(); ctx.lineWidth=1;
  }

  // ---- capture geometry for drawing tools (used to invert clientX/Y -> idx/price) ----
  CHART_FRAME = {marginL, marginT, chartW, chartH, viewStart, viewEnd, visRange, lo, hi, bodyW};
  DRAWING_MARKERS.length = 0;
  POS_HANDLES.length = 0;
  DRAW_HITS.length = 0;
  if(STATE.drawVisible) drawUserDrawings(ctx, xAt, yAt, sym, marginL, marginT, chartW, chartH);
  drawTradeLines(ctx, xAt, yAt, sym, marginL, marginT, chartW, chartH, marginR);

  // crosshair
  if(STATE.chartHoverIdx!=null && candles[STATE.chartHoverIdx]){
    const i = STATE.chartHoverIdx;
    const c = candles[i];
    const x = xAt(i);
    ctx.setLineDash([2,3]);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.moveTo(x,marginT); ctx.lineTo(x,marginT+chartH); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore(); // end clip

  // ---- replay marker: the blue line you're reading from ----
  if(STATE.replay.active && STATE.replay.idx!=null){
    const rx = xAt(candles.length-1) + barW/2;
    ctx.save();
    // everything to the right is the future — it doesn't exist yet
    ctx.fillStyle = 'rgba(8,9,11,0.5)';
    ctx.fillRect(rx, marginT, Math.max(0, marginL+chartW-rx), chartH);
    ctx.strokeStyle = '#2196f3'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(rx, marginT); ctx.lineTo(rx, marginT+chartH); ctx.stroke();
    const lastC = candles[candles.length-1];
    const txt = 'Re: ' + dateLabel(lastC.t, STATE.tf);
    ctx.font = '9.5px IBM Plex Mono, monospace';
    const tw = ctx.measureText(txt).width + 12;
    const ty = marginT + chartH + 3;
    ctx.fillStyle = '#2196f3';
    ctx.fillRect(Math.min(Math.max(rx - tw/2, marginL), marginL+chartW-tw), ty, tw, 15);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(txt, Math.min(Math.max(rx, marginL+tw/2), marginL+chartW-tw/2), ty+3);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.restore();
  }

  // last price line (drawn outside clip so the price tag can sit in the right margin)
  const last = candles[candles.length-1];
  const up = last.c >= candles[Math.max(0,candles.length-2)].o;
  const ly = yAt(last.c);
  ctx.setLineDash([2,3]);
  ctx.strokeStyle = up?upColor():downColor();
  ctx.beginPath(); ctx.moveTo(marginL,ly); ctx.lineTo(marginL+chartW,ly); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = up?upColor():downColor();
  ctx.fillRect(marginL+chartW, ly-8, marginR, 16);
  ctx.fillStyle = '#08090b';
  ctx.textAlign='left';
  ctx.fillText(fmtPrice(last.c, sym.dec), marginL+chartW+6, ly);

  // live unrealized P&L pill sitting on the price line — only if a position is
  // open on this symbol, and not while scrubbing bar replay
  if(!STATE.replay.active){
    const posHere = ACCOUNT.positions.find(p=>p.symbol===STATE.symbol);
    if(posHere){
      const lp = livePrice[STATE.symbol] ?? last.c;
      const uPnl = posHere.side==='long' ? posHere.qty*(lp-posHere.entryPrice)
                                         : posHere.qty*(posHere.entryPrice-lp);
      const win = uPnl >= 0;
      const pnlStr = (win?'+':'-')+'$'+Math.abs(uPnl).toFixed(2);
      ctx.font='bold 10px IBM Plex Mono, monospace';
      const tw = ctx.measureText(pnlStr).width;
      const padX = 7, boxW = tw+padX*2, boxH = 16;
      const boxX = marginL+chartW - boxW - 6, boxY = ly-boxH/2;
      ctx.fillStyle = win ? 'rgba(0,217,100,0.95)' : 'rgba(255,64,64,0.95)';
      ctx.fillRect(boxX, boxY, boxW, boxH);
      ctx.fillStyle = win ? '#04240f' : '#2a0606';
      ctx.textAlign='left';
      ctx.fillText(pnlStr, boxX+padX, ly+3.5);
      ctx.font='10px IBM Plex Mono, monospace';
    }
  }

  // teaching card — only while the cursor is genuinely on the candle itself
  if(STATE.chartHoverIdx!=null && STATE.hoverOnCandle && candles[STATE.chartHoverIdx]){
    const i = STATE.chartHoverIdx;
    const c = candles[i];
    const x = xAt(i);
    const label = document.getElementById('crosshairLabel');
    label.style.display='block';
    label.style.left = Math.min(Math.max(x+14, marginL), w-250)+'px';
    label.style.top = '8px';
    label.innerHTML = candleExplainer(c, i, candles, sym);
  } else {
    const label = document.getElementById('crosshairLabel');
    if(label) label.style.display='none';
  }
  ctx.textAlign='left';
}

      </div>
      <label>VIEW</label><div class="mgrid">
        <button data-mz="reset">Reset zoom</button>
        <button data-mz="tin">Time +</button>
        <button data-mz="tout">Time −</button>
        <button data-mz="pin">Price +</button>
        <button data-mz="pout">Price −</button>
      </div>
    </div>

  back.classList.add('open');
  back.querySelectorAll('[data-mtf]').forEach(b=> b.onclick = ()=>{
    STATE.tf = b.dataset.mtf; STATE.view=null; STATE.priceScale=1; STATE.priceOffsetFrac=0; resetLiveEdgeTracking(); refreshAll();
    back.querySelectorAll('[data-mtf]').forEach(x=>x.classList.toggle('sel', x===b));
  });
  back.querySelectorAll('[data-mct]').forEach(b=> b.onclick = ()=>{
    STATE.chartType = b.dataset.mct; drawMainChart();
    back.querySelectorAll('[data-mct]').forEach(x=>x.classList.toggle('sel', x===b));
  });
  back.querySelectorAll('[data-mov]').forEach(b=> b.onclick = ()=>{
    const k = b.dataset.mov;
    STATE.overlays[k] = !STATE.overlays[k];
    b.classList.toggle('sel', STATE.overlays[k]);
    document.querySelectorAll('.ov-btn').forEach(x=>{ if(x.textContent===k.toUpperCase()) x.classList.toggle('on', STATE.overlays[k]); });
    drawMainChart();
  });
  back.querySelectorAll('[data-mz]').forEach(b=> b.onclick = ()=>{
    const z = b.dataset.mz;
    const len = getCandles(STATE.symbol, STATE.tf).length;
    if(z==='reset'){ STATE.view=null; STATE.priceScale=1; STATE.priceOffsetFrac=0; }
    if(z==='tin') zoomViewAt(0.5, 1/1.35, len);
    if(z==='tout') zoomViewAt(0.5, 1.35, len);
    if(z==='pin') applyPriceScale(1/1.25);
    if(z==='pout') applyPriceScale(1.25);
    drawMainChart();
  });
  document.getElementById('mDone').onclick = ()=> back.classList.remove('open');
}
