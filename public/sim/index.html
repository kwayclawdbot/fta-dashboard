/* ---------------- UTILITIES ---------------- */
function hashStr(s){
  let h = 2166136261;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(seed){
  let a = seed;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function fmtPrice(v, dec){
  if(v===undefined||v===null||isNaN(v)) return '—';
  return v.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
function fmtMoney(v, forceSign){
  const sign = v<0?'-':(forceSign&&v>0?'+':'');
  return sign+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtCompact(v){
  if(Math.abs(v)>=1e9) return (v/1e9).toFixed(2)+'B';
  if(Math.abs(v)>=1e6) return (v/1e6).toFixed(2)+'M';
  if(Math.abs(v)>=1e3) return (v/1e3).toFixed(1)+'K';
  return Math.round(v).toString();
}
function pctStr(v){
  return (v>=0?'+':'')+v.toFixed(2)+'%';
}
function timeAgo(ts){
  const d = new Date(ts);
  return d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});
}
function dateLabel(ts, tfKey){
  const d = new Date(ts);
  if(tfKey==='1D'||tfKey==='1W') return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  return d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});
}

/* ---------------- SIMULATION CLOCK ----------------
   Everything on the chart runs off simNow() rather than the wall clock.
   At 1x, one 15m candle takes a real 15 minutes to build and close.
   The sim always runs at real speed: a 1m bar closes after 1 real minute,
   a 15m bar after 15, an hourly bar after an hour. */
const SIMCLOCK = { t: Date.now(), lastReal: Date.now(), speed: 1 }; // always real time (1x)

function simNow(){ return SIMCLOCK.t; }
function advanceSimClock(){
  const real = Date.now();
  SIMCLOCK.t += (real - SIMCLOCK.lastReal) * SIMCLOCK.speed;
  SIMCLOCK.lastReal = real;
}
// start of the bucket a timestamp belongs to, on the timeframe grid
function bucketStart(ts, tfMs){ return Math.floor(ts / tfMs) * tfMs; }
function tfMsOf(tfKey){ return TIMEFRAMES.find(t=>t.k===tfKey).ms; }

/* ---------------- CANDLE GENERATION ----------------
   ONE price history per symbol. Every timeframe is the SAME movement,
   just sliced differently.

   A symbol's history is generated once at the weekly level, then each
   weekly bar is recursively split into its 7 days, each day into its
   24 hours, each hour into its 4 x 15m, and so on. A child series always
   opens at its parent's open, closes at its parent's close, and never
   trades outside the parent's high/low — so a 1H bar is exactly the
   aggregate of the four 15m bars inside it. Switching timeframes now
   re-slices the same chart instead of showing a different market.
   30m and 3m are rolled up from 15m and 1m the same way.
   -------------------------------------------------- */
const candleCache = {}; // key: symbol|tf -> candle array

const MS = {'1m':60e3,'3m':180e3,'5m':300e3,'15m':900e3,'30m':1800e3,'1H':3600e3,'1D':86400e3,'1W':604800e3};

// subdivision ladder: each level is carved out of the level above it
const LADDER = [
  {k:'1W', ms:MS['1W'], root:520},                 // ~10 yrs of weekly bars
  {k:'1D', ms:MS['1D'], div:7,  parents:200},      // 1400 daily bars
  {k:'1H', ms:MS['1H'], div:24, parents:60},       // 1440 hourly bars
  {k:'15m', ms:MS['15m'], div:4, parents:300},     // 1200 bars
  {k:'5m', ms:MS['5m'], div:3,  parents:400},      // 1200 bars
  {k:'1m', ms:MS['1m'], div:5,  parents:240},      // 1200 bars
];
// timeframes rolled UP from a ladder level instead of carved down
const DERIVED = { '30m': {from:'15m', n:2}, '3m': {from:'1m', n:3} };

function baseVolumeFor(sym){
  return sym.cat==='Crypto'?1_000_000: sym.cat==='Forex'?5_000_000:
         sym.cat==='Indices'?2_000_000: sym.cat==='Commodities'?800_000: 3_000_000;
}

/* ---- root: the symbol's whole life, as weekly bars ---- */
function genRootWeeks(symTick, count){
  const sym = SYM_MAP[symTick];
  const rnd = mulberry32(hashStr(symTick+'|root'));
  const wkMs = MS['1W'];
  const cur = bucketStart(simNow(), wkMs);
  // sym.vol is treated as a DAILY move; a week is ~sqrt(7) of that
  const wVol = sym.vol * Math.sqrt(7);
  const driftBias = (rnd()-0.5) * 0.10;
  const bv = baseVolumeFor(sym) * 7 * 24 * 12;
  const out = [];
  // walk backwards in "shape", forwards in time, landing near sym.base today
  let price = sym.base;
  const path = [];
  for(let i=0;i<count;i++){
    const shock = (rnd()-0.5) * 2 * wVol;
    price = price * (1 + driftBias*wVol + shock);
    if(price <= 0.0001) price = 0.0001;
    path.push(price);
  }
  // rescale so the newest week lands on the symbol's headline price
  const adj = sym.base / path[path.length-1];
  for(let i=0;i<count;i++) path[i] *= adj;
  for(let i=0;i<count;i++){
    const t = cur - (count-1-i)*wkMs;
    const o = i===0 ? path[0]*(1-wVol*0.3) : path[i-1];
    const c = path[i];
    const h = Math.max(o,c) * (1 + rnd()*wVol*0.7);
    const l = Math.min(o,c) * (1 - rnd()*wVol*0.7);
    const v = Math.round(bv * (0.4 + rnd()*1.2));
    out.push({t, o, h, l, c, v});
  }
  return out;
}

/* ---- carve one parent bar into n children that add back up to it ---- */
function subdivide(parent, n, ms, seedKey){
  const rnd = mulberry32(hashStr(seedKey));
  const {o, c, h, l} = parent;
  const span = Math.max(h - l, Math.abs(o)*1e-6);
  // The move a candle of THIS duration should make, taken from the symbol's own
  // daily volatility. This is the floor that stops calm names collapsing into a
  // flat line: movement no longer depends only on how big the parent candle was.
  const symTick = seedKey.split('|')[0];
  const vol = (SYM_MAP[symTick] && SYM_MAP[symTick].vol) || 0.02;
  const childVol = Math.max(o * vol * Math.sqrt(ms/86400000), o*1e-5);

  // Volatility clustering: mostly ordinary candles, then an occasional BURST —
  // heat lifts, picks a direction and decays over several bars, so a bigger move
  // arrives as a run-up leg (that leaves fair-value gaps) with quiet candles on
  // either side, never a lone giant bar from nowhere. MOMENTUM keeps steps in runs.
  const MOMENTUM = 0.58, BASE_HEAT = 0.95;
  const inc = [];
  let w = 0, e = 0, heat = BASE_HEAT, dir = 0;
  const step = Math.max(span * 0.5 / Math.sqrt(n), childVol * 0.55);
  for(let i=0;i<n;i++){
    if(heat < BASE_HEAT*1.15 && rnd() < 0.02){ heat = 1.2 + rnd()*0.4; dir = rnd()<0.5?-1:1; }
    else heat = BASE_HEAT + (heat-BASE_HEAT)*0.80;
    const trendPush = heat>1.1 ? dir*0.28 : 0;
    const kick = ((rnd()-0.5)*2 + trendPush) * heat;
    e = MOMENTUM*e + kick;
    w += e * step;
    inc.push(w);
  }
  const wEnd = inc[n-1];
  // let children breathe a little past the parent's box — real intrabar chop
  // exceeds a calm parent candle, and hard-clamping is what flattened everything.
  const pad = childVol * 2.5;
  const loB = Math.min(l,o,c) - pad, hiB = Math.max(h,o,c) + pad;
  const closes = [];
  for(let i=0;i<n;i++){
    const f = (i+1)/n;
    let y = o + (c-o)*f + (inc[i] - wEnd*f);
    closes.push(Math.min(hiB, Math.max(loB, y)));
  }
  closes[n-1] = c; // last child must close exactly where the parent closed

  const kids = [];
  let open = o;
  for(let i=0;i<n;i++){
    const cc = closes[i];
    const bodyHi = Math.max(open, cc), bodyLo = Math.min(open, cc);
    // a candle that ran hard has little wick — that's what a displacement bar looks like
    const drive = Math.min(1, Math.abs(cc-open) / (childVol*1.5 + 1e-12));
    const wick = Math.max(span*0.14, childVol*0.7) * (1 - 0.6*drive);
    kids.push({
      t: parent.t + i*ms,
      o: open,
      c: cc,
      h: bodyHi + rnd()*wick,
      l: bodyLo - rnd()*wick,
      v: 0
    });
    open = cc;
  }
  // the parent's own extremes should still show up somewhere inside it
  let iH = 0, iL = 0;
  for(let i=1;i<n;i++){
    if(kids[i].h > kids[iH].h) iH = i;
    if(kids[i].l < kids[iL].l) iL = i;
  }
  kids[iH].h = Math.max(kids[iH].h, h);
  kids[iL].l = Math.min(kids[iL].l, l);
  kids.forEach(k=>{ k.h = Math.max(k.h, k.o, k.c); k.l = Math.min(k.l, k.o, k.c); });

  // split the parent's volume across the children (sums back to parent.v)
  const wts = kids.map(()=> 0.4 + rnd()*1.2);
  const tot = wts.reduce((a,b)=>a+b,0);
  kids.forEach((k,i)=>{ k.v = Math.round(parent.v * wts[i]/tot); });
  return kids;
}

function buildLevel(symTick, k){
  const key = symTick+'|'+k;
  if(candleCache[key]) return candleCache[key];
  const li = LADDER.findIndex(x=>x.k===k);
  const lvl = LADDER[li];
  if(li === 0){
    candleCache[key] = registerSeries(symTick, k, genRootWeeks(symTick, lvl.root));
    return candleCache[key];
  }
  const parentK = LADDER[li-1].k;
  const parents = buildLevel(symTick, parentK);
  const slice = parents.slice(Math.max(0, parents.length - lvl.parents));
  const out = [];
  slice.forEach(p=>{
    subdivide(p, lvl.div, lvl.ms, symTick+'|'+k+'|'+p.t).forEach(kid=> out.push(kid));
  });
  // THE BAR CLOCK STOPS AT NOW.
  // Carving the current week into days, hours and minutes generates the whole
  // week — including the part that hasn't happened yet. Left alone, the newest
  // "live" bar was up to 7,760 bars in the future, so the rollover test
  // (currentBucket > lastBar.t) could never be true: the countdown hit zero and
  // no new candle was ever born. Cut every level at the bucket the clock is
  // actually inside; everything past that is the tick engine's job.
  const cutoff = bucketStart(simNow(), lvl.ms);
  let end = out.length;
  while(end > 1 && out[end-1].t > cutoff) end--;
  candleCache[key] = registerSeries(symTick, k, out.slice(0, end));
  return candleCache[key];
}

/* ---- roll a finer series up into a coarser one on the timeframe grid ---- */
function aggregateFrom(symTick, tfKey){
  const d = DERIVED[tfKey];
  const src = getCandles(symTick, d.from);
  const ms = MS[tfKey];
  const out = [];
  let cur = null;
  src.forEach(c=>{
    const b = bucketStart(c.t, ms);
    if(!cur || cur.t !== b){
      cur = {t:b, o:c.o, h:c.h, l:c.l, c:c.c, v:c.v};
      out.push(cur);
    } else {
      cur.h = Math.max(cur.h, c.h);
      cur.l = Math.min(cur.l, c.l);
      cur.c = c.c;
      cur.v += c.v;
    }
  });
  return out;
}

function getCandles(symTick, tfKey){
  const key = symTick+'|'+tfKey;
  if(candleCache[key]) return candleCache[key];
  if(DERIVED[tfKey]){
    candleCache[key] = registerSeries(symTick, tfKey, aggregateFrom(symTick, tfKey));
    return candleCache[key];
  }
  return buildLevel(symTick, tfKey);
}

/* ---------------- LIVE SERIES REGISTRY ----------------
   The tick engine used to walk 383 symbols x 8 timeframes every second looking
   for cached arrays — 3,064 lookups a second for the ~20 series that actually
   exist. Keep an index of what's really built and iterate that instead. */
const SERIES_INDEX = {};   // symbol -> [{tf, ms, arr}]
function registerSeries(symTick, tfKey, arr){
  const list = SERIES_INDEX[symTick] || (SERIES_INDEX[symTick] = []);
  const found = list.find(x=>x.tf===tfKey);
  if(found) found.arr = arr;
  else list.push({tf: tfKey, ms: MS[tfKey], arr});
  return arr;
}

// live tick: nudge the last candle of every cached series + track live price per symbol
const livePrice = {}; // symTick -> current price
const prevClose = {}; // symTick -> price 24h ago (for % change)

function initLivePrices(){
  // With ~200 instruments we only build each symbol's weekly backbone at boot —
  // every finer level is carved out of it lazily the moment a chart asks for it.
  SYMBOLS.forEach(s=>{
    livePrice[s.t] = priceNow(s.t);
  });
}
/* The price RIGHT NOW. The weekly close is the end of the *current* week, which
   is still in the future — using it as the live price meant the newest candle
   snapped a whole week's move on the first tick (a giant candle every time you
   opened a chart). Instead, descend the ladder into the bucket that actually
   contains `now` and read its close, so the live edge lands where the chart is. */
function priceNow(symTick){
  const now = simNow();
  let node = buildLevel(symTick, '1W');
  node = node[node.length-1];                     // the current (still-forming) week
  for(let li=1; li<LADDER.length; li++){
    const lvl = LADDER[li];
    const kids = subdivide(node, lvl.div, lvl.ms, symTick+'|'+lvl.k+'|'+node.t);
    let pick = kids[0];
    for(const k of kids){ if(k.t <= now) pick = k; else break; }   // deepest bucket at/just before now
    node = pick;
  }
  return node.c;
}

/* yesterday's close, derived straight from the weekly backbone (14 bars of work)
   instead of materialising a full daily series for every symbol on the watchlist */
function computePrevClose(tick){
  const wk = buildLevel(tick, '1W');
  const days = [];
  wk.slice(-2).forEach(par=> subdivide(par, 7, MS['1D'], tick+'|1D|'+par.t).forEach(d=> days.push(d)));
  const target = bucketStart(simNow(), MS['1D']) - MS['1D'];
  const hit = days.find(d=> d.t === target);
  return hit ? hit.c : days[days.length-2].c;
}

/* ---------------- FVG MARKET PHYSICS ----------------
   The gaps are not paint. Every chart that's open publishes its live zones here
   and the tick engine adds a drift term from them:

     magnet    an unfilled gap pulls price toward it — gaps get filled
     reaction  once price is deep inside a gap it gets pushed back out the way
               it came: a bullish gap is support, a bearish gap is resistance
     barrier   an inverted gap (IFVG) does the opposite — the old support is a
               ceiling now, and it repels price

   The force is scaled to the same size as one tick of noise, so it bends the
   walk rather than dictating it. Gaps still break — they just have to earn it. */
const FVG_PHYSICS = {};   // symbol -> live zones from whatever is charted
let FVG_PHYS_TICK = 0;

/* Two different clocks, so two different strengths.

   MAGNET is a slow pull across minutes-to-hours. Noise compounds as sqrt(time)
   while drift compounds linearly, so a per-tick force this small still adds up
   to about 1x the walk's own standard deviation over an hour — gap fills become
   clearly more likely than chance without becoming a certainty. Crank it up and
   price teleports to every gap, which teaches a beginner something false.

   REACTION/BARRIER fire only while price is inside a zone, and that argument is
   settled in seconds, not hours — so they need to be an order of magnitude
   stronger to show up at all. They're bounded by the zone itself, so there's no
   runaway: leave the zone and the force is gone. */
let FVG_FORCE = 0.045;   // magnet — pull toward unfilled gaps (price gets drawn in)
let FVG_LOCAL = 0.20;    // reaction + inversion barrier — the decisive shove out of the zone

/* ---- SIM MODE: scripted practice setups ----
   For young traders. When on (default), the chart you're looking at runs clean,
   recognisable patterns — consolidation→breakout, head & shoulders→down, double
   tops/bottoms, clean trends — so a beginner can learn to read and PREDICT them.
   /real turns it off (ordinary random-walk charts with gentle gaps, like a live
   market); /sim turns it back on. Only the symbol on screen is scripted; the
   pattern name is never shown, so the prediction is real. */
let SIM_MODE = false;
let SIM_SYM = null;      // which symbol the current scenario belongs to (re-picks on switch)
let SCENARIO_BART = null; // last viewed-timeframe bucket, to detect when a candle closes
const SCENARIO = {};    // symTick -> { anchor, unit, legs:[{to,bars,k}], i, bar, name }

function pickScenario(symTick){
  const sym = SYM_MAP[symTick]; if(!sym) return;
  const anchor = livePrice[symTick] || sym.base;
  const u = Math.min(0.02, Math.max(0.006, sym.vol*1.0));  // pattern amplitude, realistic %
  const unit = anchor * u;
  // L(to, bars, k): pull toward anchor+to*unit, holding it for `bars` real candles.
  // consecutive waypoints make the peaks and troughs; each leg spans candles so
  // the shape is visible in the bars, not smeared inside one.
  const L = (to,bars,k)=>({to, bars: bars||3, k: k||0.13});
  const range = (n,a)=>{ const o=[]; for(let i=0;i<n;i++) o.push(L((i%2?-1:1)*a, 3, 0.08)); return o; };
  const lib = [
    { name:'Consolidation → breakout ▲', legs:[...range(6,0.3), L(3.2,6,0.17)] },
    { name:'Consolidation → breakdown ▼', legs:[...range(6,0.3), L(-3.2,6,0.17)] },
    { name:'Head & shoulders → down ▼',  legs:[L(1,3),L(0,3),L(2.1,4),L(0,3),L(1,3),L(0,2),L(-2.6,6,0.17)] },
    { name:'Inverse H&S → up ▲',         legs:[L(-1,3),L(0,3),L(-2.1,4),L(0,3),L(-1,3),L(0,2),L(2.6,6,0.17)] },
    { name:'Double top → down ▼',        legs:[L(2,4),L(0.6,3),L(2,4),L(-2.2,6,0.17)] },
    { name:'Double bottom → up ▲',       legs:[L(-2,4),L(-0.6,3),L(-2,4),L(2.2,6,0.17)] },
    { name:'Uptrend — higher highs ▲',   legs:[L(1.2,3),L(0.6,2),L(2,3),L(1.4,2),L(3,4)] },
    { name:'Downtrend — lower lows ▼',   legs:[L(-1.2,3),L(-0.6,2),L(-2,3),L(-1.4,2),L(-3,4)] },
    { name:'Ascending triangle → break ▲', legs:[L(2,3),L(0.6,2),L(2,3),L(1.1,2),L(2,3),L(3.4,6,0.17)] },
  ];
  const chosen = lib[Math.floor(Math.random()*lib.length)];
  SCENARIO[symTick] = { anchor, unit, legs: chosen.legs, i:0, bar:0, name: chosen.name };
}
function scenarioStep(symTick, price, amp, rnd, newBar){
  let sc = SCENARIO[symTick];
  if(!sc){ pickScenario(symTick); sc = SCENARIO[symTick]; if(!sc) return price; }
  if(newBar){                                          // one real candle closed
    sc.bar++;
    if(sc.bar >= sc.legs[sc.i].bars){                  // this leg has printed enough candles
      sc.bar = 0; sc.i++;
      if(sc.i >= sc.legs.length){ pickScenario(symTick); sc = SCENARIO[symTick]; }  // fresh setup
    }
  }
  const leg = sc.legs[sc.i];
  const target = sc.anchor + leg.to*sc.unit;
  const gap = (target - price)/price;                  // fractional distance to the waypoint
  const noise = (rnd()-0.5)*2*amp*0.3;                 // a little life, not a straight line
  return price*(1 + gap*leg.k + noise);
}
function setSimMode(on){
  SIM_MODE = on;
  SIM_SYM = null;   // force a fresh scenario on the next tick
  SCENARIO_BART = null;
  // sim mode runs the clock a bit quicker so a whole setup builds in a minute or
  // two of watching instead of a full trading day; real mode is honest 1x time.
  if(typeof SIMCLOCK!=='undefined'){ SIMCLOCK.speed = on ? 12 : 1; SIMCLOCK.lastReal = Date.now(); }
  if(on){ FVG_FORCE = 0.045; FVG_LOCAL = 0.20; }
  else  { FVG_FORCE = 0.03;  FVG_LOCAL = 0.09; for(const k in SCENARIO) delete SCENARIO[k]; }
  // NOT persisted: scripted practice mode is opt-in per session only, so it can
  // never silently resurrect from old storage and start throwing giant candles.
}
function loadSimMode(){
  // Always boot the realistic simulator. Clear any stale scripted-mode flag left
  // in storage by an earlier /sim so it can't come back and spike the chart.
  try{ localStorage.removeItem(ns('simmode')); }catch(e){}
  setSimMode(false);
}

function chartedTargets(){
  const out = [{sym: STATE.symbol, tf: STATE.tf}];
  STATE.panes.forEach(p=> out.push({sym: p.symbol, tf: p.tf}));
  return out;
}
function refreshFvgPhysics(){
  const seen = {};
  chartedTargets().forEach(({sym, tf})=>{
    if(!SYM_MAP[sym]) return;
    const zs = getFVGZones(sym, tf).filter(z=> (!z.dead && z.fill < 0.98) || z.inverted);
    seen[sym] = (seen[sym] || []).concat(zs);
  });
  Object.keys(FVG_PHYSICS).forEach(k=>{ if(!seen[k]) delete FVG_PHYSICS[k]; });
  Object.assign(FVG_PHYSICS, seen);
}

/* Net pull on a symbol from its live gaps. Returns {magnet, local} because the
   two act on different timescales and get scaled separately.
   Two geometries matter, and mixing them up is the classic bug:
     - the MAGNET targets the unfilled remainder (what's still worth filling)
     - the REACTION is measured against the ORIGINAL gap, because "how deep has
       price gone into this thing" is a fact about the whole gap, not the leftover */
function fvgDrift(symTick, price){
  const zones = FVG_PHYSICS[symTick];
  if(!zones || !zones.length) return 0;
  let magnet = 0, local = 0;
  const REACH = 0.015;          // gaps stop mattering past ~1.5% away
  for(let i=0;i<zones.length;i++){
    const z = zones[i];
    const r = zoneRemainder(z);

    if(z.inverted){
      // Flipped: a busted bullish gap is a ceiling now, a busted bearish gap a floor.
      // The push ramps up with how far price has pressed into the zone from the side
      // it approached from — a flat constant here just pins price and makes the level
      // unbreakable, which no real level is.
      if(price <= r.top && price >= r.bottom){
        const pen = z.type==='bull' ? (price - r.bottom)/z.size   // pressing up into a ceiling
                                    : (r.top - price)/z.size;     // pressing down into a floor
        const depth = Math.min(1, Math.max(0, pen));
        local += (z.type==='bull' ? -1 : 1) * (0.6 + depth * 1.4);
      }
      continue;
    }

    const midR = (r.top + r.bottom)/2;
    const dist = (midR - price)/price;
    const insideGap = price <= z.top && price >= z.bottom;

    // magnet — pulls toward whatever is still unfilled
    if(Math.abs(dist) < REACH){
      const w = 1 - Math.abs(dist)/REACH;
      magnet += Math.sign(dist) * w * w * 0.55;
    }
    // reaction — the moment price is inside, the gap defends itself and shoves
    // price back out the side it came in: a bullish gap launches UP, a bearish
    // gap slams DOWN. A hard kick on entry plus a ramp with depth, so a shallow
    // tag still reacts and a deep fill reacts hard.
    if(insideGap){
      const pen = z.type==='bull' ? (z.top - price)/z.size : (price - z.bottom)/z.size;
      const depth = Math.min(1, Math.max(0, pen));
      local += (z.type==='bull' ? 1 : -1) * (0.6 + depth * 1.4);
    }
  }
  magnet = Math.max(-1.5, Math.min(1.5, magnet));
  local  = Math.max(-1.5, Math.min(1.5, local));
  return magnet*FVG_FORCE + local*FVG_LOCAL;
}

let LAST_TICK_SIM = Date.now();
function tickLivePrices(rnd){
  const now = simNow();
  // scale each tick by how much SIM time actually passed (random-walk variance
  // grows with time), so a 15m bar looks like a 15m bar at any tick rate
  let dt = now - LAST_TICK_SIM;
  LAST_TICK_SIM = now;
  if(!(dt > 0)) dt = 1000;
  dt = Math.min(dt, 30*1000);   // never let one tick stand for more than ~30s of moves,
                                 // so a throttled tab or a time gap can't lurch the price
  // re-read the gaps off whatever charts are open, every few ticks
  if((FVG_PHYS_TICK++ % 4)===0) refreshFvgPhysics();

  // has a candle just closed on the timeframe you're looking at? scenarios step
  // one leg-bar per closed candle so the pattern spans real bars.
  let simNewBar = false;
  if(SIM_MODE){
    const vms = MS[STATE.tf] || 60000;
    const vb = bucketStart(now, vms);
    if(SCENARIO_BART===null) SCENARIO_BART = vb;
    else if(vb !== SCENARIO_BART){ simNewBar = true; SCENARIO_BART = vb; }
  }

  let newBars = 0;
  SYMBOLS.forEach(s=>{
    // s.vol is a DAILY move; size each tick so the walk compounds to that over a
    // real day. Same maths regardless of timeframe.
    const amp = s.vol * Math.sqrt(1.6 * dt / 86400000);
    let p;
    if(SIM_MODE && s.t===STATE.symbol){
      // fresh setup, anchored at the current price, whenever you switch charts
      if(SIM_SYM !== STATE.symbol){ pickScenario(STATE.symbol); SIM_SYM = STATE.symbol; }
      // the chart you're watching runs a clean, readable setup instead of noise
      p = scenarioStep(s.t, livePrice[s.t], amp, rnd, simNewBar);
    } else {
      const shock = (rnd()-0.5) * 2 * amp;
      // gaps bend the walk (see fvgDrift) — magnet, reaction and inversion barrier
      const drift = FVG_PHYSICS[s.t] ? fvgDrift(s.t, livePrice[s.t]) * amp : 0;
      p = livePrice[s.t] * (1 + shock + drift);
    }
    if(p<=0) p = livePrice[s.t];
    // Hard safety net: a single tick can't move more than a few times its own
    // expected step. Normal ticks sit at ~1x; this only catches freak steps (a
    // time gap, an FVG shove, a scripted pull) so the live edge can never explode
    // into one giant candle. Big moves still happen — as a run of candles, never a spike.
    const _cap = livePrice[s.t] * Math.max(amp * 4, 0.0004);
    if(p > livePrice[s.t] + _cap) p = livePrice[s.t] + _cap;
    else if(p < livePrice[s.t] - _cap) p = livePrice[s.t] - _cap;
    livePrice[s.t] = p;

    const series = SERIES_INDEX[s.t];
    if(!series) return;
    for(let i=0;i<series.length;i++){
      const {ms, arr} = series[i];
      let last = arr[arr.length-1];
      const cur = bucketStart(now, ms);
      // roll into a new bar only when the clock crosses a real timeframe
      // boundary — a 15m bar takes 15 real minutes to close, not 1.5 seconds
      if(cur > last.t){
        let guard = 0;
        while(last.t + ms <= cur && guard++ < 500){
          const o = last.c;
          const bar = {t: last.t + ms, o, h:o, l:o, c:o, v:0};
          arr.push(bar);
          if(arr.length > 3000) arr.shift();
          last = bar;
          newBars++;
        }
      }
      last.c = p;
      if(p > last.h) last.h = p;
      if(p < last.l) last.l = p;
      last.v += Math.round(baseVolumeFor(s) * (ms/86400000) * (0.5+Math.random()));
    }
  });
  followLiveEdge();
}

/* When a fresh candle is born, keep it in view. If you were sitting at the right
   edge the whole window steps forward one bar, exactly like TradingView; if you
   had scrolled back into history you're left where you were. */
function followLiveEdge(){
  // Runs on EVERY tick, not just the ones that birth a bar — otherwise the
  // remembered bar count is stale the first time a candle appears and the new
  // one is born just off the right edge, which looks exactly like a frozen chart.
  const step = (key, tf, view, prevLen, onGrow)=>{
    const arr = candleCache[key];
    if(!arr) return prevLen;
    const len = arr.length;
    if(prevLen != null && len > prevLen && view && view.end >= prevLen - 0.5){
      onGrow(len - prevLen);
    }
    return len;
  };
  STATE._lastBarCount = step(STATE.symbol+'|'+STATE.tf, STATE.tf, STATE.view, STATE._lastBarCount, (grew)=>{
    STATE.view.start += grew;
    STATE.view.end += grew;
  });
  STATE.panes.forEach(pane=>{
    pane._lastLen = step(pane.symbol+'|'+pane.tf, pane.tf, pane.view, pane._lastLen, (g)=>{
      pane.view.start += g; pane.view.end += g;
    });
  });
}
/* switching symbol or timeframe resets the bookmark — a different series has a
   different bar count and the old number would fake a rollover */
function resetLiveEdgeTracking(){
  STATE._lastBarCount = null;
  STATE.panes.forEach(p=> p._lastLen = null);
}

/* time remaining in the current bar of the active timeframe (sim ms) */
function barTimeLeft(){
  const ms = tfMsOf(STATE.tf);
  const left = (bucketStart(simNow(), ms) + ms) - simNow();
  return Math.max(0, left);
}
function fmtCountdown(ms){
  const total = Math.ceil(ms/1000);
  const d = Math.floor(total/86400);
  const h = Math.floor(total%86400/3600);
  const m = Math.floor(total%3600/60);
  const sec = total%60;
  const pad = n=>String(n).padStart(2,'0');
  if(d>0) return `${d}d ${pad(h)}:${pad(m)}:${pad(sec)}`;
  if(h>0) return `${pad(h)}:${pad(m)}:${pad(sec)}`;
  return `${pad(m)}:${pad(sec)}`;
}

/* ---------------- INDICATORS ---------------- */
function sma(vals, period){
  const out = new Array(vals.length).fill(null);
  let sum = 0;
  for(let i=0;i<vals.length;i++){
    sum += vals[i];
    if(i>=period) sum -= vals[i-period];
    if(i>=period-1) out[i] = sum/period;
  }
  return out;
}
function ema(vals, period){
  const out = new Array(vals.length).fill(null);
  const k = 2/(period+1);
  let prev = null;
  for(let i=0;i<vals.length;i++){
    if(i===period-1){
      let s=0; for(let j=0;j<period;j++) s+=vals[j];
      prev = s/period; out[i]=prev;
    } else if(i>=period){
      prev = vals[i]*k + prev*(1-k);
      out[i]=prev;
    }
  }
  return out;
}
function rsi(closes, period){
  const out = new Array(closes.length).fill(null);
  let gainSum=0, lossSum=0;
  for(let i=1;i<closes.length;i++){
    const diff = closes[i]-closes[i-1];
    const gain = diff>0?diff:0, loss = diff<0?-diff:0;
    if(i<=period){
      gainSum+=gain; lossSum+=loss;
      if(i===period){
        const rs = lossSum===0?100:gainSum/lossSum;
        out[i] = lossSum===0?100:100-(100/(1+rs));
      }
    } else {
      gainSum = (gainSum*(period-1)+gain)/period;
      lossSum = (lossSum*(period-1)+loss)/period;
      const rs = lossSum===0?100:gainSum/lossSum;
      out[i] = lossSum===0?100:100-(100/(1+rs));
    }
  }
  return out;
}
function macdCalc(closes, fast=12, slow=26, signalP=9){
  const emaFast = ema(closes, fast);
  const emaSlow = ema(closes, slow);
  const macdLine = closes.map((_,i)=> (emaFast[i]!=null && emaSlow[i]!=null) ? emaFast[i]-emaSlow[i] : null);
  const validVals = macdLine.filter(v=>v!=null);
  // compute signal on the compact series then map back
  const signalCompact = ema(validVals, signalP);
  let vi=0;
  const signalLine = macdLine.map(v=>{
    if(v==null) return null;
    const sv = signalCompact[vi]; vi++;
    return sv;
  });
  const hist = macdLine.map((v,i)=> (v!=null && signalLine[i]!=null) ? v-signalLine[i] : null);
  return {macdLine, signalLine, hist};
}
function bollinger(closes, period=20, mult=2){
  const mid = sma(closes, period);
  const upper = new Array(closes.length).fill(null);
  const lower = new Array(closes.length).fill(null);
  for(let i=0;i<closes.length;i++){
    if(mid[i]==null) continue;
    let sum=0;
    for(let j=i-period+1;j<=i;j++) sum += Math.pow(closes[j]-mid[i],2);
    const sd = Math.sqrt(sum/period);
    upper[i] = mid[i]+mult*sd;
    lower[i] = mid[i]-mult*sd;
  }
  return {upper, mid, lower};
}
function atrCalc(candles, period=14){
  const out = new Array(candles.length).fill(null);
  const trs = [];
  for(let i=0;i<candles.length;i++){
    const c = candles[i];
    let tr;
    if(i===0) tr = c.h-c.l;
    else tr = Math.max(c.h-c.l, Math.abs(c.h-candles[i-1].c), Math.abs(c.l-candles[i-1].c));
    trs.push(tr);
    if(i===period-1){
      const s = trs.slice(0,period).reduce((a,b)=>a+b,0);
      out[i]=s/period;
    } else if(i>=period){
      out[i] = (out[i-1]*(period-1)+tr)/period;
    }
  }
  return out;
}
function vwapCalc(candles){
  const out = new Array(candles.length).fill(null);
  let cumPV=0, cumV=0;
  for(let i=0;i<candles.length;i++){
    const tp = (candles[i].h+candles[i].l+candles[i].c)/3;
    cumPV += tp*candles[i].v;
    cumV += candles[i].v;
    out[i] = cumV>0 ? cumPV/cumV : null;
  }
  return out;
}
function stochastic(candles, period=14, kSmooth=3, dSmooth=3){
  const rawK = new Array(candles.length).fill(null);
  for(let i=0;i<candles.length;i++){
    if(i<period-1) continue;
    let hi=-Infinity, lo=Infinity;
    for(let j=i-period+1;j<=i;j++){ hi=Math.max(hi,candles[j].h); lo=Math.min(lo,candles[j].l); }
    const c = candles[i].c;
    rawK[i] = hi===lo ? 50 : ((c-lo)/(hi-lo))*100;
  }
  const kVals = rawK.map(v=>v==null?null:v);
  const compactK = kVals.filter(v=>v!=null);
  const kSmoothCompact = sma(compactK, kSmooth);
  let vi=0;
  const k = kVals.map(v=>{
    if(v==null) return null;
    const sv = kSmoothCompact[vi]; vi++;
    return sv;
  });
  const compactKforD = k.filter(v=>v!=null);
  const dCompact = sma(compactKforD, dSmooth);
  vi=0;
  const d = k.map(v=>{
    if(v==null) return null;
    const sv = dCompact[vi]; vi++;
    return sv;
  });
  return {k, d};
}

/* ---------------- FVG / IFVG (Fair Value Gap / Inverse Fair Value Gap) ----------------
   Works identically for every ticker since it's derived purely from each symbol's own
   candle series — no symbol-specific tuning needed, so it "expands" across the whole
   universe automatically.
   Bullish FVG: 3-candle gap where candle[i-1].high < candle[i+1].low  → zone between them.
   Bearish FVG: 3-candle gap where candle[i-1].low  > candle[i+1].high → zone between them.
   A zone is "mitigated" when a later candle closes back through it. Once mitigated it
   flips polarity and is tracked onward as an Inverse FVG (IFVG) — the same zone now
   acting as resistance-turned-support (or vice versa) until price closes through it again.
---------------------------------------------------------------------------------------- */
/* ---------------- FAIR VALUE GAPS ----------------
   A real 3-candle FVG: candle 1's high is below candle 3's low (bullish) or
   candle 1's low is above candle 3's high (bearish). The gap is the untraded
   space in between. Two separate things then happen to it, and they are NOT the
   same event:
     mitigation — price trades back into the gap and eats it, top-down for a
                  bullish gap, bottom-up for a bearish one. Tracked as a 0-1
                  fill, so the box shrinks to whatever is left unfilled.
     inversion  — a candle CLOSES clean through the far side. The gap flips
                  polarity: old support becomes resistance (IFVG). The
                  inversion dies if price closes back through it.
   These zones are not decoration — the live engine trades against them
   (see fvgDrift below). */
function computeFVGZones(candles){
  const zones = [];
  const active = [];
  const WINDOW = 900;
  const scanStart = Math.max(2, candles.length - WINDOW);

  // ignore specks: a gap has to be a real slice of this instrument's range
  let avg = 0, n = 0;
  for(let i=Math.max(0,candles.length-100); i<candles.length; i++){ avg += candles[i].h-candles[i].l; n++; }
  avg = n ? avg/n : 0;
  const minSize = Math.max(avg*0.20, candles[candles.length-1].c*0.00008);

  const update = (z, c, i)=>{
    if(!z.inverted){
      // how much of the gap has been eaten (bull fills from the top, bear from the bottom)
      const pen = z.type==='bull' ? (z.top - c.l)/z.size : (c.h - z.bottom)/z.size;
      if(pen > z.fill) z.fill = Math.min(1, Math.max(0, pen));
      const closedThrough = z.type==='bull' ? (c.c < z.bottom) : (c.c > z.top);
      if(closedThrough){
        z.inverted = true;
        z.invStartIdx = i;
        z.fill = 1;
      } else if(z.fill >= 1){
        z.filled = true;            // fully mitigated but held — done, stop drawing
        z.endIdx = i;
        z.dead = true;
      }
    } else {
      const invBroke = z.type==='bull' ? (c.c > z.top) : (c.c < z.bottom);
      if(invBroke){ z.endIdx = i; z.dead = true; z.invalidated = true; }
    }
    if(!z.dead) z.endIdx = candles.length-1;
  };

  for(let i=scanStart; i<candles.length; i++){
    for(let k=active.length-1; k>=0; k--){
      const z = active[k];
      if(i <= z.startIdx) continue;
      update(z, candles[i], i);
      if(z.dead) active.splice(k,1);
    }
    const a = candles[i-2], d = candles[i];
    if(!a || !d) continue;
    if(a.h < d.l && (d.l - a.h) >= minSize){
      const z = {type:'bull', top:d.l, bottom:a.h, size:d.l-a.h, startIdx:i, endIdx:candles.length-1,
                 fill:0, filled:false, inverted:false, invStartIdx:null, dead:false};
      zones.push(z); active.push(z);
    } else if(a.l > d.h && (a.l - d.h) >= minSize){
      const z = {type:'bear', top:a.l, bottom:d.h, size:a.l-d.h, startIdx:i, endIdx:candles.length-1,
                 fill:0, filled:false, inverted:false, invStartIdx:null, dead:false};
      zones.push(z); active.push(z);
    }
  }
  // What's worth keeping: still-open gaps, and inverted zones that are recent
  // enough to matter. An IFVG from 300 bars ago that price never revisited is
  // noise, not structure.
  const EXPIRY = 250;
  const now = candles.length-1;
  const live = zones.filter(z=>{
    if(z.dead && !z.inverted) return false;
    if(z.invalidated) return false;
    const born = z.inverted ? (z.invStartIdx ?? z.startIdx) : z.startIdx;
    return (now - born) <= EXPIRY;
  });
  return live.slice(-40);
}

/* the unfilled remainder of a gap — this is the part that still matters */
function zoneRemainder(z){
  if(z.inverted) return {top:z.top, bottom:z.bottom};
  const eaten = z.size * z.fill;
  return z.type==='bull' ? {top: z.top - eaten, bottom: z.bottom}
                         : {top: z.top, bottom: z.bottom + eaten};
}

/* zones are re-derived rather than stored, so cache per symbol|timeframe */
const FVG_CACHE = {};
function getFVGZones(symTick, tfKey){
  const candles = getCandles(symTick, tfKey);
  const key = symTick+'|'+tfKey;
  const c = FVG_CACHE[key];
  const lastT = candles[candles.length-1].t;
  if(c && c.len===candles.length && c.lastT===lastT && (simNow()-c.at) < 4000) return c.zones;
  const zones = computeFVGZones(candles);
  FVG_CACHE[key] = {zones, len:candles.length, lastT, at:simNow()};
  return zones;
}

/* ---------------- ACCOUNTS ----------------
   Real accounts, with one honest caveat: there is no server behind this file, so
   they live in this browser's storage on this device. Passwords are never stored
   — only a PBKDF2-SHA256 hash (120k iterations) over a random per-user salt, so
   the stored blob can't be read back into a password. Every account gets its own
   namespace: balance, positions, trade history, drawings and colours are yours
   alone, and switching accounts switches all of it.
   What this can't do: log you in on another device, or recover a lost password. */
const SESSION = { email: null, guest: false };
const AUTH_KEY = 'simbot.users';

function ns(key){ return 'simbot.' + (SESSION.email || 'guest') + '.' + key; }
function loadUsers(){ try{ return JSON.parse(localStorage.getItem(AUTH_KEY)) || {}; }catch(e){ return {}; } }
function saveUsers(u){ try{ localStorage.setItem(AUTH_KEY, JSON.stringify(u)); }catch(e){} }
function randHex(n){
  const a = new Uint8Array(n);
  (window.crypto || {}).getRandomValues ? window.crypto.getRandomValues(a) : a.forEach((_,i)=>a[i]=Math.floor(Math.random()*256));
  return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hashPassword(pw, saltHex){
  const enc = new TextEncoder();
  if(window.crypto && window.crypto.subtle){
    try{
      const salt = new Uint8Array(saltHex.match(/../g).map(h=>parseInt(h,16)));
      const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations:120000, hash:'SHA-256'}, key, 256);
      return 'pbkdf2$' + Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }catch(e){ /* fall through */ }
  }
  // fallback for contexts without WebCrypto — weaker, but nothing here is a real secret
  let h1 = 0x811c9dc5, h2 = 0x1000193;
  const str = saltHex + '|' + pw;
  for(let r=0;r<20000;r++){
    for(let i=0;i<str.length;i++){
      h1 ^= str.charCodeAt(i); h1 = Math.imul(h1, 16777619) >>> 0;
      h2 = (Math.imul(h2 ^ h1, 2246822519) + r) >>> 0;
    }
  }
  return 'weak$' + h1.toString(16) + h2.toString(16);
}
function validEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

async function signUp(email, pw, pw2){
  email = email.trim().toLowerCase();
  if(!validEmail(email)) throw new Error('That does not look like an email address.');
  if(pw.length < 8) throw new Error('Use at least 8 characters — this is practice for good habits.');
  if(pw !== pw2) throw new Error('The two passwords do not match.');
  const users = loadUsers();
  if(users[email]) throw new Error('An account already exists for that email on this device. Try logging in.');
  const salt = randHex(16);
  users[email] = { email, salt, hash: await hashPassword(pw, salt), createdAt: Date.now() };
  saveUsers(users);
  SESSION.email = email; SESSION.guest = false;
  try{ localStorage.setItem('simbot.session', email); }catch(e){}
}
async function logIn(email, pw){
  email = email.trim().toLowerCase();
  const users = loadUsers();
  const u = users[email];
  if(!u) throw new Error('No account for that email on this device. Sign up instead?');
  const h = await hashPassword(pw, u.salt);
  if(h !== u.hash) throw new Error('Wrong password.');
  SESSION.email = email; SESSION.guest = false;
  try{ localStorage.setItem('simbot.session', email); }catch(e){}
}
function logOut(){
  saveAccount(); saveDrawings();
  try{ localStorage.removeItem('simbot.session'); }catch(e){}
  location.reload();
}
function restoreSession(){
  try{
    const email = localStorage.getItem('simbot.session');
    if(email === 'guest'){ SESSION.email = null; SESSION.guest = true; return true; }
    if(email && loadUsers()[email]){ SESSION.email = email; return true; }
  }catch(e){}
  return false;
}

function buildAuthScreen(){
  const overlay = document.getElementById('authOverlay');
  document.getElementById('authLogo').src = document.querySelector('link[rel="icon"]').href;
  const note = document.getElementById('authNote');
  note.textContent = 'Your account lives in this browser on this device — there is no server, so nothing you type here leaves your computer. Passwords are salted and hashed, never stored as text.';
  let mode = 'login';
  const err = document.getElementById('authErr');
  const go = document.getElementById('authGo');
  const setMode = (m)=>{
    mode = m;
    document.querySelectorAll('.auth-tab').forEach(b=> b.classList.toggle('active', b.dataset.mode===m));
    document.getElementById('authConfirmWrap').style.display = m==='signup' ? '' : 'none';
    document.getElementById('authPw').setAttribute('autocomplete', m==='signup'?'new-password':'current-password');
    go.textContent = m==='signup' ? 'CREATE ACCOUNT' : 'LOG IN';
    err.textContent = '';
  };
  document.querySelectorAll('.auth-tab').forEach(b=> b.onclick = ()=> setMode(b.dataset.mode));

  // show / hide password
  document.querySelectorAll('.pw-eye').forEach(btn=>{
    const input = document.getElementById(btn.dataset.for);
    const paint = ()=>{
      const shown = input.type === 'text';
      btn.innerHTML = shown ? ICONS.eyeOff : ICONS.eye;
      btn.classList.toggle('on', shown);
      btn.setAttribute('aria-label', shown ? 'Hide password' : 'Show password');
      btn.title = shown ? 'Hide password' : 'Show password';
    };
    btn.onclick = ()=>{
      input.type = input.type === 'password' ? 'text' : 'password';
      paint();
      input.focus();
    };
    paint();
  });
  document.getElementById('authForm').onsubmit = async (e)=>{
    e.preventDefault();
    err.textContent = '';
    go.disabled = true; go.textContent = 'WORKING…';
    try{
      const email = document.getElementById('authEmail').value;
      const pw = document.getElementById('authPw').value;
      if(mode==='signup') await signUp(email, pw, document.getElementById('authPw2').value);
      else await logIn(email, pw);
      overlay.style.display = 'none';
      bootApp();
    }catch(ex){
      err.textContent = ex.message;
      go.disabled = false;
      go.textContent = mode==='signup' ? 'CREATE ACCOUNT' : 'LOG IN';
    }
  };
  document.getElementById('authGuest').onclick = ()=>{
    SESSION.email = null; SESSION.guest = true;
    try{ localStorage.setItem('simbot.session','guest'); }catch(e){}
    overlay.style.display = 'none';
    bootApp();
  };
  setMode('login');
  // if there are no accounts yet, sign-up is the sensible landing tab
  if(!Object.keys(loadUsers()).length) setMode('signup');
}

/* ---------------- ACCOUNT PERSISTENCE ----------------
   Balance, positions, orders and every closed trade survive a reload — otherwise
   a P&L calendar would be pointless. */
function saveAccount(){
  try{
    localStorage.setItem(ns('account'), JSON.stringify({
      v: 1,
      startingBalance: ACCOUNT.startingBalance,
      balance: ACCOUNT.balance,
      positions: ACCOUNT.positions,
      pendingOrders: ACCOUNT.pendingOrders,
      history: ACCOUNT.history.slice(0, 2000),
      sessionStart: ACCOUNT.sessionStart,
      seq: {pos: posIdSeq, ord: ordIdSeq, hist: histIdSeq},
    }));
  }catch(e){}
}
function loadAccount(){
  try{
    const raw = localStorage.getItem(ns('account'));
    if(!raw) return;
    const o = JSON.parse(raw);
    if(!o || o.v!==1) return;
    ACCOUNT.startingBalance = o.startingBalance ?? ACCOUNT.startingBalance;
    ACCOUNT.balance = o.balance ?? ACCOUNT.balance;
    // drop anything referring to an instrument that no longer exists
    ACCOUNT.positions = (o.positions||[]).filter(p=> SYM_MAP[p.symbol]);
    ACCOUNT.pendingOrders = (o.pendingOrders||[]).filter(p=> SYM_MAP[p.symbol]);
    ACCOUNT.history = (o.history||[]).filter(h=> SYM_MAP[h.symbol]);
    ACCOUNT.sessionStart = o.sessionStart ?? Date.now();
    if(o.seq){ posIdSeq = o.seq.pos||1; ordIdSeq = o.seq.ord||1; histIdSeq = o.seq.hist||1; }
  }catch(e){}
}

/* ---------------- BID / ASK ----------------
   Until now every fill happened at one clean mid price, which quietly taught that
   trading is free. It isn't: you buy at the ask and sell at the bid, and the gap
   between them is a cost you pay on every single round trip. */
const SPREAD_BPS = {Stocks:5, ETFs:2, Crypto:4, Futures:2, Forex:1, Indices:2, Commodities:3};
function spreadOf(symTick){
  const sym = SYM_MAP[symTick || STATE.symbol];
  const bps = SPREAD_BPS[sym.cat] ?? 4;
  const tick = Math.pow(10, -sym.dec);
  return Math.max(tick, livePrice[sym.t] * bps / 10000);
}
function bidOf(symTick){ const t = symTick||STATE.symbol; return livePrice[t] - spreadOf(t)/2; }
function askOf(symTick){ const t = symTick||STATE.symbol; return livePrice[t] + spreadOf(t)/2; }

function currentSym(){ return SYM_MAP[STATE.symbol]; }
function currentPrice(){ return livePrice[STATE.symbol]; }

   Green up / red down out of the box — what every new trader already expects.
   The gear in the top bar lets you change the two candle colors and nothing else. */
const THEME_DEFAULT = { up:'#00d964', down:'#ff3b30' };
const THEME = Object.assign({}, THEME_DEFAULT);

const COLOR_PRESETS = [
  {n:'Classic',  up:'#00d964', down:'#ff3b30'},
  {n:'Soft',     up:'#26a69a', down:'#ef5350'},
  {n:'Punch',    up:'#00ff88', down:'#ff2e63'},
  {n:'Terminal', up:'#00d964', down:'#2f5fe0'},
  {n:'Mono',     up:'#e8ebef', down:'#5b6473'},
  {n:'Amber',    up:'#ffb000', down:'#7a4dff'},
];

function hexToRgba(hex, a){
  const v = hex.replace('#','');
  const n = parseInt(v.length===3 ? v.split('').map(c=>c+c).join('') : v, 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
const upColor   = ()=> THEME.up;
const downColor = ()=> THEME.down;
const wickColor = (up)=> up ? THEME.up : THEME.down;

function applyTheme(){
  const r = document.documentElement.style;
  r.setProperty('--green', THEME.up);
  r.setProperty('--red', THEME.down);
  r.setProperty('--green-dim', hexToRgba(THEME.up, 0.16));
  r.setProperty('--red-dim', hexToRgba(THEME.down, 0.16));
  try{ localStorage.setItem(ns('colors'), JSON.stringify(THEME)); }catch(e){}
  if(document.getElementById('chartCanvas')){ drawMainChart(); drawPanes(); updateWatchlistPrices(); }
}
function loadTheme(){
  try{
    const raw = localStorage.getItem(ns('colors'));
    if(raw){ const o = JSON.parse(raw); if(o.up) THEME.up=o.up; if(o.down) THEME.down=o.down; }
  }catch(e){}
}

  const TF_WORDS = {'1m':'one minute','3m':'three minutes','5m':'five minutes','15m':'fifteen minutes',

/* ---------------- SCREENSHOT ---------------- */
function takeScreenshot(){
  const canvas = document.getElementById('chartCanvas');
  if(!canvas) return;
  // the chart canvas is transparent (the panel behind it supplies the color), so
  // compose onto an opaque background first or the saved PNG comes out see-through
  const out = document.createElement('canvas');
  out.width = canvas.width; out.height = canvas.height;
  const c = out.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  c.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--panel2').trim() || '#0d1015';
  c.fillRect(0,0,out.width,out.height);
  c.drawImage(canvas, 0, 0);
  c.setTransform(dpr,0,0,dpr,0,0);
  const sym = currentSym();
  c.font = 'bold 13px IBM Plex Mono, monospace';
  c.fillStyle = 'rgba(232,235,239,0.9)';
  c.textAlign = 'left'; c.textBaseline = 'top';
  c.fillText(`${sym.t} · ${STATE.tf} · ${fmtPrice(currentPrice(), sym.dec)}`, 10, 8);
  c.font = '10px IBM Plex Mono, monospace';
  c.fillStyle = 'rgba(123,132,148,0.85)';
  c.fillText('SIMBOT — simulated data, paper trading', 10, 24);
  const link = document.createElement('a');
  link.download = `SIMBOT_${STATE.symbol}_${STATE.tf}_${Date.now()}.png`;
  link.href = out.toDataURL('image/png');
  link.click();
  toast('SCREENSHOT', 'Chart image saved to your downloads.', 'buy');
}

/* ---------------- REPLAY MODE ----------------
   Same flow as TradingView: turn it on, pick the bar you want to start from,
   then step or play forward. Everything to the right of the marker is gone —
   you're reading the chart without knowing what happens next, which is the
   entire point. */
const REPLAY_SPEEDS = [1, 3, 10];
function toggleReplay(){
  STATE.replay.active = !STATE.replay.active;
  document.getElementById('replayBtn').classList.toggle('active', STATE.replay.active);
  if(STATE.replay.active){
    STATE.replay.selecting = true;
    STATE.replay.idx = null;
    STATE.replay.playing = false;
    buildReplayBar();
    toast('BAR REPLAY','Click any candle on the chart to rewind to it. Everything after it gets hidden.','buy');
  } else {
    stopReplayPlayback();
    STATE.replay.selecting = false;
    STATE.replay.idx = null;
    document.getElementById('replayBarWrap').classList.remove('active');
    toast('BAR REPLAY','Replay off — back to live.','sell');
  }
  drawMainChart();
}
function startReplayAt(idx){
  const candles = getCandles(STATE.symbol, STATE.tf);
  STATE.replay.idx = Math.max(10, Math.min(candles.length-1, Math.round(idx)));
  STATE.replay.selecting = false;
  buildReplayBar();
  drawMainChart();
}
function buildReplayBar(){
  const wrap = document.getElementById('replayBarWrap');
  const candles = getCandles(STATE.symbol, STATE.tf);
  const r = STATE.replay;
  wrap.classList.add('active');
  if(r.selecting){
    wrap.innerHTML = `<span class="rb-select-hint">${ICONS.scissors} Click a candle on the chart to start the replay from there</span>
      <button class="rb-x" id="rbExit" data-tip="Leave replay and go back to live">✕</button>`;
    document.getElementById('rbExit').onclick = toggleReplay;
    return;
  }
  wrap.innerHTML = `
    <button id="rbSelect" class="rb-wide" data-tip="Pick a different starting candle">${ICONS.scissors} Select bar</button>
    <span class="rb-div"></span>
    <button id="rbStepBack" data-tip="Back one candle">${ICONS.step.replace('viewBox="0 0 24 24"','viewBox="0 0 24 24" style="transform:scaleX(-1)"')}</button>
    <button id="rbPlay" data-tip="Play the chart forward one candle at a time">${r.playing?ICONS.pause:ICONS.play}</button>
    <button id="rbStepFwd" data-tip="Forward one candle — the honest way to practise: decide, then step">${ICONS.step}</button>
    <span class="rb-div"></span>
    <div class="rb-speeds" id="rbSpeeds"></div>
    <span class="rb-tf">${TIMEFRAMES.find(t=>t.k===STATE.tf).label}</span>
    <button id="rbEnd" data-tip="Jump to the live edge">${ICONS.step}${ICONS.step}</button>
    <input type="range" id="rbSlider" min="10" max="${candles.length-1}" value="${r.idx}">
    <span class="rb-label" id="rbLabel"></span>
    <button class="rb-x" id="rbExit" data-tip="Leave replay and go back to live">✕</button>
  `;
  const sp = document.getElementById('rbSpeeds');
  REPLAY_SPEEDS.forEach(x=>{
    const b = document.createElement('button');
    b.className = 'rb-speed'+(x===r.speed?' active':'');
    b.textContent = x+'x';
    b.dataset.tip = 'Play back '+x+' candles per beat';
    b.onclick = ()=>{
      r.speed = x;
      document.querySelectorAll('.rb-speed').forEach(z=>z.classList.toggle('active', z.textContent===x+'x'));
      if(r.playing){ stopReplayPlayback(); toggleReplayPlayback(); }
    };
    sp.appendChild(b);
  });
  updateReplayLabel();
  document.getElementById('rbSlider').oninput = (e)=>{ r.idx = parseInt(e.target.value); updateReplayLabel(); drawMainChart(); };
  document.getElementById('rbStepBack').onclick = ()=> stepReplay(-1);
  document.getElementById('rbStepFwd').onclick = ()=> stepReplay(1);
  document.getElementById('rbPlay').onclick = toggleReplayPlayback;
  document.getElementById('rbEnd').onclick = ()=>{ stopReplayPlayback(); r.idx = candles.length-1; buildReplayBar(); drawMainChart(); };
  document.getElementById('rbSelect').onclick = ()=>{ stopReplayPlayback(); r.selecting = true; buildReplayBar(); drawMainChart(); };
  document.getElementById('rbExit').onclick = toggleReplay;
}
function updateReplayLabel(){
  const candles = getCandles(STATE.symbol, STATE.tf);
  const c = candles[STATE.replay.idx];
  const lbl = document.getElementById('rbLabel');
  if(lbl && c) lbl.textContent = dateLabel(c.t, STATE.tf) + `  (${STATE.replay.idx+1}/${candles.length})`;
}
function stepReplay(dir){
  const candles = getCandles(STATE.symbol, STATE.tf);
  STATE.replay.idx = Math.max(10, Math.min(candles.length-1, STATE.replay.idx+dir));
  const slider = document.getElementById('rbSlider');
  if(slider) slider.value = STATE.replay.idx;
  updateReplayLabel();
  drawMainChart();
}
function toggleReplayPlayback(){
  if(STATE.replay.playing){ stopReplayPlayback(); return; }
  STATE.replay.playing = true;
  const btn = document.getElementById('rbPlay'); if(btn) btn.innerHTML = ICONS.pause;
  STATE.replay.timer = setInterval(()=>{
    const candles = getCandles(STATE.symbol, STATE.tf);
    if(STATE.replay.idx >= candles.length-1){ stopReplayPlayback(); return; }
    stepReplay(1);
  }, Math.round(500/STATE.replay.speed));
}
function stopReplayPlayback(){
  STATE.replay.playing = false;
  if(STATE.replay.timer){ clearInterval(STATE.replay.timer); STATE.replay.timer=null; }
  const btn = document.getElementById('rbPlay'); if(btn) btn.innerHTML = ICONS.play;
}

function populateSymbolList(query){
  const list = document.getElementById('symList');
  list.innerHTML='';
  const q = query.trim().toUpperCase();
  CATS.forEach(cat=>{
    const syms = SYMBOLS.filter(s=>s.cat===cat && (q==='' || s.t.includes(q) || s.n.toUpperCase().includes(q)));
    if(syms.length===0) return;
    const label = document.createElement('div');
    label.className='symbol-group-label'; label.textContent = cat.toUpperCase();
    list.appendChild(label);
    syms.forEach(s=>{
      const row = document.createElement('div');
      row.className='symbol-row';
      const chg = pctChange(s.t);
      row.innerHTML = `<div class="s-left"><span class="s-tick">${s.t}</span><span class="s-name">${s.n}</span></div>
        <div class="s-right"><span class="s-price">${fmtPrice(livePrice[s.t],s.dec)}</span><span class="s-chg ${chg>=0?'up':'down'}">${pctStr(chg)}</span></div>`;
      row.onclick = ()=>{ STATE.symbol = s.t; document.getElementById('symDropdown').classList.remove('open'); refreshAll(); };
      list.appendChild(row);
    });
  });
  if(list.innerHTML==='') list.innerHTML = '<div class="empty-state">No matches</div>';
}

function pctChange(tick){
  const p = livePrice[tick];
  if(prevClose[tick] == null) prevClose[tick] = computePrevClose(tick);
  const pc = prevClose[tick];
  if(!pc) return 0;
  return ((p-pc)/pc)*100;
}

/* ---------------- WATCHLIST ----------------
   Your own named list, saved to your account. Browse the full universe and hit +
   to add anything to it. */
const DEFAULT_WATCH = ['AAPL','NVDA','TSLA','SPY','QQQ','BTC','ETH','/ES','EURUSD','GOLD'];
const WATCH = { name: 'My Watchlist', syms: DEFAULT_WATCH.slice() };

function saveWatchlist(){ try{ localStorage.setItem(ns('watchlist'), JSON.stringify(WATCH)); }catch(e){} }
function loadWatchlist(){
  try{
    const raw = localStorage.getItem(ns('watchlist'));
    if(raw){
      const o = JSON.parse(raw);
      if(o && Array.isArray(o.syms)){
        WATCH.name = o.name || WATCH.name;
        WATCH.syms = o.syms.filter(t=> SYM_MAP[t]);   // drop anything that no longer exists
      }
    }
  }catch(e){}
}
function inWatch(t){ return WATCH.syms.includes(t); }
function addToWatch(t){
  if(inWatch(t)) return;
  WATCH.syms.push(t);
  saveWatchlist();
  renderWatchlist();
  toast(t, 'Added to '+WATCH.name+'.', 'buy');
}
function removeFromWatch(t){
  WATCH.syms = WATCH.syms.filter(x=>x!==t);
  saveWatchlist();
  renderWatchlist();
}
function renameWatchlist(){
  const name = prompt('Name this watchlist:', WATCH.name);
  if(name===null) return;
  WATCH.name = name.trim().slice(0,28) || 'My Watchlist';
  saveWatchlist();
  renderWatchlist();
}

function renderWatchlist(){
  const scroll = document.getElementById('watchScroll');
  if(!scroll) return;
  const q = (STATE.watchFilter||'').trim().toUpperCase();
  const nameEl = document.getElementById('wlName');
  if(nameEl) nameEl.innerHTML = WATCH.name.toUpperCase() + ' <span class="wl-pencil">✎</span>';
  document.querySelectorAll('.wl-tab').forEach(b=> b.classList.toggle('active', b.dataset.t===STATE.wlTab));
  scroll.innerHTML = '';

  const row = (sym, mode)=>{
    const r = document.createElement('div');
    r.className = 'watch-item'+(sym.t===STATE.symbol?' active':'');
    r.dataset.sym = sym.t;
    r.dataset.tip = sym.n;
    const btn = mode==='browse'
      ? `<button class="wl-add ${inWatch(sym.t)?'has':''}" data-add="${sym.t}" data-tip="${inWatch(sym.t)?'Already in '+WATCH.name:'Add '+sym.t+' to '+WATCH.name}">${inWatch(sym.t)?'✓':'+'}</button>`
      : `<button class="wl-rm" data-rm="${sym.t}" data-tip="Remove ${sym.t} from ${WATCH.name}">×</button>`;
    r.innerHTML = `<span class="w-tick">${sym.t}</span>
      <div class="w-sub"><span class="w-px"></span><span class="w-chg"></span></div>${btn}`;
    r.onclick = (e)=>{
      if(e.target.closest('[data-add]') || e.target.closest('[data-rm]')) return;
      STATE.symbol = sym.t; STATE.view=null; STATE.priceScale=1; STATE.priceOffsetFrac=0; resetLiveEdgeTracking(); refreshAll();
      if(isMobile()) toggleMobileDrawer(null);
    };
    return r;
  };

  let shown = 0;
  if(STATE.wlTab === 'list'){
    const list = WATCH.syms.map(t=> SYM_MAP[t]).filter(Boolean)
      .filter(s=> !q || s.t.includes(q) || s.n.toUpperCase().includes(q));
    shown = list.length;
    if(!list.length){
      scroll.innerHTML = `<div class="wl-empty">Nothing in ${WATCH.name} yet.<br><br>
        Open <b>BROWSE ALL</b> and hit the <b>+</b> next to anything you want to follow.</div>`;
    } else {
      list.forEach(sym=> scroll.appendChild(row(sym,'list')));
    }
  } else {
    CATS.forEach(cat=>{
      const list = SYMBOLS.filter(s=> s.cat===cat && (!q || s.t.includes(q) || s.n.toUpperCase().includes(q)));
      if(!list.length) return;
      shown += list.length;
      const label = document.createElement('div');
      label.className='watch-cat'; label.textContent = cat.toUpperCase()+' ('+list.length+')';
      scroll.appendChild(label);
      list.forEach(sym=> scroll.appendChild(row(sym,'browse')));
    });
    if(!shown) scroll.innerHTML = `<div class="wl-empty">Nothing matches “${STATE.watchFilter}”.</div>`;
  }

  scroll.querySelectorAll('[data-add]').forEach(b=> b.onclick = (e)=>{ e.stopPropagation(); addToWatch(b.dataset.add); });
  scroll.querySelectorAll('[data-rm]').forEach(b=> b.onclick = (e)=>{ e.stopPropagation(); removeFromWatch(b.dataset.rm); });

  const cnt = document.getElementById('wlCount');
  if(cnt) cnt.textContent = STATE.wlTab==='list' ? WATCH.syms.length : shown+'/'+SYMBOLS.length;
  cacheWatchRows();
  updateWatchlistPrices();
}

// prices tick every second — repainting ~200 rows of HTML that often is wasteful,
// so rows are built once and only their numbers get touched after that
/* Row elements are cached when the list is built, so a price update is a handful
   of text writes — not 383 querySelectorAll sweeps plus 1,149 sub-queries a second.
   Text is only written when the number actually changed, which keeps the browser
   from re-laying-out rows that didn't move. */
let WATCH_ROWS = [];
function cacheWatchRows(){
  WATCH_ROWS = [...document.querySelectorAll('.watch-item')].map(row=>({
    row, t: row.dataset.sym,
    px: row.querySelector('.w-px'),
    chg: row.querySelector('.w-chg'),
    lastPx: null, lastChg: null,
  }));
}
function updateWatchlistPrices(){
  for(let i=0;i<WATCH_ROWS.length;i++){
    const r = WATCH_ROWS[i];
    const sym = SYM_MAP[r.t];
    if(!sym) continue;
    const px = fmtPrice(livePrice[r.t], sym.dec);
    if(px !== r.lastPx){ r.px.textContent = px; r.lastPx = px; }
    const chg = pctChange(r.t);
    const txt = pctStr(chg);
    if(txt !== r.lastChg){
      r.chg.textContent = txt;
      r.chg.className = 'w-chg '+(chg>=0?'up':'down');
      r.lastChg = txt;
    }
    r.row.classList.toggle('active', r.t===STATE.symbol);
  }
}

/* ---------------- ZOOM / PAN INTERACTION WIRING (TradingView-style) ----------------
   Uses Pointer Events with pointer capture so a drag never "drops" even if the
   cursor moves fast or briefly leaves the canvas — this is what makes grab/pan
   reliable across mouse, trackpad and touch/pen in one implementation.
------------------------------------------------------------------------------------ */
const activePointers = new Map(); // pointerId -> {x,y}
let pinchStartDist = null, pinchStartView = null;

function wireChartInteraction(canvas){
  canvas.addEventListener('wheel', onChartWheel, {passive:false});
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);
  canvas.addEventListener('pointerleave', (e)=>{
    if(activePointers.size===0){
      STATE.chartHoverIdx=null;
      STATE.hoverOnCandle=false;
      const label = document.getElementById('crosshairLabel');
      if(label) label.style.display='none';
      drawMainChart();
    }
  });
  canvas.addEventListener('dblclick', ()=>{ STATE.view=null; STATE.priceScale=1; STATE.priceOffsetFrac=0; drawMainChart(); drawSubpanel(); });
  canvas.addEventListener('contextmenu', (e)=>{ e.preventDefault(); cancelPendingDraw(); });
  canvas.addEventListener('click', onChartClickForDelete);
}
