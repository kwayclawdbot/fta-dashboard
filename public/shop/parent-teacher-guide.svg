  <line x1="60" y1="200" x2="540" y2="200" stroke="#B45309" stroke-width="2" opacity="0.4"/>
  <text font-family="Poppins, sans-serif" font-size="52" font-weight="800" fill="#101828"><tspan x="60" y="270">Parent &amp; Teacher</tspan><tspan x="60" y="332">Guide</tspan></text>
  <text font-family="Inter, sans-serif" font-size="20" font-style="italic" fill="#5B6472"><tspan x="60" y="428">Confident coaching, zero jargon</tspan></text>
  <circle cx="510" cy="710" r="46" fill="#B45309" opacity="0.10"/>
  <text x="510" y="718" font-family="Poppins, sans-serif" font-size="30" font-weight="900"
        fill="#B45309" text-anchor="middle">$</text>
  <text x="60" y="740" font-family="Inter, sans-serif" font-size="15" fill="#98A2B3">Money stuff, minus the snooze.</text>
