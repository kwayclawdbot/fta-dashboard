<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="Parent &amp; Teacher Guide">
  <defs>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B45309"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF7EF"/>
      <stop offset="1" stop-color="#F3EDE1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#paper)"/>
  <rect x="0" y="0" width="26" height="800" fill="url(#spine)"/>
  <rect x="60" y="70" width="120" height="30" rx="15" fill="#B45309" opacity="0.12"/>
  <text x="120" y="90" font-family="Poppins, sans-serif" font-size="15" font-weight="700"
        fill="#B45309" text-anchor="middle" letter-spacing="2">ADULT</text>
  <text x="60" y="150" font-family="Poppins, sans-serif" font-size="18" font-weight="800"
